<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradeWay CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --navy:#1E3A5F; --ink:#14213D; --muted:#4A5568; --line:#DCE2EA; --bg:#F3F5F8; --card:#FFFFFF;
  --warnbg:#FFF4DC; --warn:#7A4B00; --okbg:#E4F4EC; --ok:#1B6B45; --field:#7B8798;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--navy)}
button{font-family:inherit}
.hidden{display:none!important}
/* login */
.login-wrap{min-height:100vh;display:flex;flex-wrap:wrap}
.login-left{flex:1 1 420px;background:var(--navy);color:#fff;padding:64px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.login-left h1{margin:0;font-size:40px;line-height:1.15;font-weight:600;letter-spacing:-.8px;max-width:460px}
.login-left p{margin:0;font-size:17px;line-height:1.5;color:#C9D6E8;max-width:460px}
.login-right{flex:1 1 420px;display:flex;align-items:center;justify-content:center;padding:48px}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:36px;display:flex;flex-direction:column;gap:18px}
.login-card h2{margin:0;font-size:24px;font-weight:600}
.brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:600}
.brand span{font-weight:400;color:#C9D6E8}
/* shell */
.shell{min-height:100vh;display:flex;flex-wrap:wrap}
.side{flex:0 0 220px;background:var(--card);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:24px}
.side .brand{color:var(--ink);font-size:16px;padding:0 8px}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav a{display:block;padding:10px 12px;font-size:14px;color:var(--ink);border-radius:8px;text-decoration:none}
.side nav a.active{background:#E6EDF6;color:var(--navy);font-weight:600}
.side .spacer{flex:1}
.main{flex:999 1 560px;min-width:0;padding:32px;display:flex;flex-direction:column;gap:24px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px}
.top h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.5px}
.sub{font-size:13px;color:var(--muted)}
.btn{padding:11px 18px;font-size:14px;font-weight:500;color:#fff;background:var(--navy);border:0;border-radius:8px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--field)}
.btn.small{padding:8px 12px;font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px}
.metric .l{font-size:13px;color:var(--muted)}
.metric .v{font-size:28px;font-weight:600;letter-spacing:-.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card h3{margin:0;padding:18px 20px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600}
.scroll{overflow-x:auto}
table{width:100%;min-width:860px;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-size:12px;font-weight:500;padding:12px 8px}
td{padding:14px 8px;border-top:1px solid var(--line)}
th:first-child,td:first-child{padding-left:20px}
th:last-child,td:last-child{padding-right:20px}
.r{text-align:right}
.pos{color:var(--ok);font-weight:600}
.neg{color:#9B1C1C;font-weight:600}
.chip{display:inline-block;font-size:12px;padding:4px 10px;border-radius:12px;background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding:20px}
.kv .k{font-size:12px;color:var(--muted);margin-bottom:4px}
.kv .val{font-size:14px;line-height:1.5;word-break:break-word}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.cols>.a{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px}
.cols>.b{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:24px}
.row{padding:16px 20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.row:first-of-type{border-top:0}
.pad{padding:20px;display:flex;flex-direction:column;gap:14px}
label{font-size:13px;font-weight:500;display:block;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 12px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff;border:1px solid var(--field);border-radius:8px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.err{background:#FCEBEB;color:#9B1C1C;border-radius:8px;padding:10px 14px;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(20,33,61,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:560px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:20px}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
details{padding:0 20px 16px}
summary{cursor:pointer;font-size:13px;color:var(--muted);padding:6px 0}
pre{margin:8px 0 0;white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--bg);padding:12px;border-radius:8px}
.search{max-width:320px}
/* расчёты сделок */
.tbl-sm{min-width:560px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.okbox{background:var(--okbg);color:var(--ok);border-radius:8px;padding:8px 12px;font-size:13px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.4}
.dealv{display:flex;flex-direction:column;gap:14px}
.deal-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.deal-head h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.3px}
.deal-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.deal-left{display:flex;flex-direction:column;gap:14px;min-width:0}
.deal-side{position:sticky;top:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.deal-side #dWarn:empty{display:none}
.card h3.sm{padding:10px 14px;font-size:14px}
/* условия: одна компактная строка полей */
.dfields{display:flex;flex-wrap:wrap;gap:8px 10px;padding:12px 14px}
.dfields>div{flex:1 1 68px;min-width:0}
.dfields>.w{flex:2 1 120px}
.dfields>.dt{flex:1 1 130px}
.dfields>.w3{flex:3 1 200px}
.dfields>.fx{flex:2 1 170px}
.dfields .hint{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.eq{display:block;font-size:11px;font-weight:400;color:var(--muted);white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.filters>div{flex:0 1 200px;min-width:140px}
.filters label{font-size:12px;color:var(--muted);margin-bottom:3px;display:block}
.filters select{padding:8px 10px;font-size:13px}
.filters .cnt{flex:1 1 auto;font-size:13px;padding-bottom:9px;text-align:right}
table.orders{min-width:860px}
table.orders tbody tr[data-href]{cursor:pointer}
table.orders tbody tr[data-href]:hover td{background:#F7F9FC}
.kind{display:inline-block;font-size:12px;padding:3px 9px;border-radius:12px;white-space:nowrap}
.k-trip{background:#EEF1F5;color:var(--muted)}
.k-deal{background:#E6EDF6;color:var(--navy);font-weight:500}
.toggle{display:flex;align-items:center;gap:8px;padding:0 14px 12px;font-size:13px;cursor:pointer;width:max-content}
.toggle input{width:auto}
.stsel{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.stsel label{margin:0;font-weight:400;color:var(--muted)}
.stsel select{width:auto;padding:7px 10px;font-size:13px}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--navy);text-decoration:underline;cursor:pointer}
tr.total td{font-weight:600;border-top:2px solid var(--line)}
.period{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--field);border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:8px 12px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;border:0;border-left:1px solid var(--line);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:500}
.period .rng{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.period .rng input{width:auto;padding:7px 8px;font-size:13px}
.dfields label{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dfields input,.dfields select{padding:6px 8px;font-size:13px;border-radius:6px}
/* плотная таблица строк; прокручивается только она */
.lines-wrap{max-height:calc(100vh - 290px);min-height:200px;overflow:auto}
.lines{min-width:720px;font-size:13px}
.lines th{position:sticky;top:0;z-index:1;background:var(--card);padding:7px 5px;font-size:11px;box-shadow:inset 0 -1px 0 var(--line);line-height:1.25}
.lines td{padding:3px 5px;vertical-align:middle;border-top:0;border-bottom:1px solid var(--line)}
.lines th:first-child,.lines td:first-child{padding-left:12px}
.lines th:last-child,.lines td:last-child{padding-right:8px}
.lines td.r{white-space:nowrap}
.lines input,.lines select{padding:4px 6px;font-size:13px;border-radius:6px;border-color:var(--line)}
.lines input:focus,.lines select:focus{border-color:var(--field)}
.lines input[data-f="name"]{min-width:110px}
.lines select{width:158px}
.lines input.num{width:64px;text-align:right}
.lines input[type=checkbox]{width:16px;height:16px;margin:0;vertical-align:middle}
.lines .x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px}
.lines .x:hover{background:var(--bg);color:#9B1C1C}
.addrow{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.addrow select{flex:1 1 auto;width:auto;min-width:0;padding:6px 8px;font-size:13px;border-radius:6px}
/* панель «Итог» */
.tot{min-width:0;font-size:13px}
.tot th,.tot td{white-space:nowrap;padding:6px 8px}
.tot th:first-child,.tot td:first-child{padding-left:14px;white-space:normal}
.tot th:last-child,.tot td:last-child{padding-right:14px}
.side-acts{display:flex;gap:8px;flex-wrap:wrap}
.side-acts .btn{flex:1 1 auto}
@media (max-width:900px){.deal-grid{grid-template-columns:minmax(0,1fr)}.deal-side{position:static}.lines-wrap{max-height:60vh}}
</style>
</head>
<body>

<div id="login" class="login-wrap hidden">
  <div class="login-left">
    <div class="brand">TradeWay <span>Solution</span></div>
    <div>
      <h1>Рейсы, документы и акциз в одном месте</h1>
      <p style="margin-top:20px">CRM для международного экспедитора. Рейс в центре: вокруг него клиент, перевозчик, деньги и документы.</p>
    </div>
    <div style="font-size:14px;color:#C9D6E8">Доступ только по логину</div>
  </div>
  <div class="login-right">
    <form id="loginForm" class="login-card">
      <h2>Вход</h2>
      <div id="loginErr" class="err hidden"></div>
      <div><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" id="loginBtn">Войти</button>
    </form>
  </div>
</div>

<div id="app" class="shell hidden">
  <aside class="side">
    <div class="brand">TradeWay</div>
    <nav>
      <a href="#/" id="nav-home">Дашборд</a>
      <a href="#/orders" id="nav-orders">Заказы</a>
    </nav>
    <div class="spacer"></div>
    <button class="btn ghost small" id="logoutBtn" type="button">Выйти</button>
  </aside>
  <main class="main" id="view"></main>
</div>

<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://imwfzjeewbfseexumard.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bz86mNhG0gcyqr67nFhq1Q_9FG6hhaz';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = (n) => (n == null || n === '') ? '—' : '€' + Number(n).toLocaleString('ru-RU', {maximumFractionDigits: 2});
const fdate = (v) => { if (!v) return '—'; const p = String(v).split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : esc(v); };
const numOrNull = (v) => { v = String(v == null ? '' : v).trim().replace(',', '.'); return v === '' ? null : Number(v); };
const DOC_TYPES = {
  carrier_order: 'Заявка перевозчику', client_order: 'Заявка клиенту', cmr: 'CMR',
  packing_list: 'Packing list', invoice: 'Счёт', customs_certificate: 'Довідка', act: 'Акт', other: 'Другое'
};

let trips = [], clients = [], carriers = [];

async function loadAll() {
  const [t, c, k] = await Promise.all([
    db.from('trips').select('*, clients(name), carriers(name)').order('loading_date', {ascending: false, nullsFirst: false}),
    db.from('clients').select('id, name').order('name'),
    db.from('carriers').select('id, name').order('name')
  ]);
  if (t.error) throw t.error;
  if (c.error) throw c.error;
  if (k.error) throw k.error;
  trips = t.data; clients = c.data; carriers = k.data;
  await loadOrders();
}

// Сделки для дашборда: только active и done. Ошибка не ломает дашборд, а показывается плашкой.
let deals = [], dealsErr = null, dealsLoadedAt = 0;
async function loadDeals() {
  const r = await db.from('deals')
    .select('id, client_id, status, tax_rate, final_price, qty_marks, qty_stickers, start_date, currency, fx_to_eur, clients(name), deal_lines(basis, cost_rate, sale_rate)')
    .in('status', ['active', 'done']);
  if (r.error) { deals = []; dealsErr = r.error.message; } else { deals = r.data; dealsErr = null; }
  dealsLoadedAt = Date.now();
}

// Валюта сделки. Суммы сделки хранятся в её валюте; в евро = сумма × fx_to_eur. Для EUR курс всегда 1.
const CUR_SIGN = {EUR: '€', USD: '$', UAH: '₴'};
// Гривна пишется после суммы и всегда с копейками: «72 300,00 ₴». Евро и доллар — знак перед суммой.
const CUR_AFTER = {UAH: true};
const FX_PLACEHOLDER = {USD: 'напр. 0,92', UAH: 'напр. 0,0225'};
const dealCur = (d) => (d && d.currency) || 'EUR';
function dealFx(d) {
  if (dealCur(d) === 'EUR') return 1;
  const x = Number(d.fx_to_eur);
  return (d.fx_to_eur != null && d.fx_to_eur !== '' && isFinite(x) && x > 0) ? x : 1;
}
const money = (n, cur, fine) => {
  if (n == null || n === '' || !isFinite(n)) return '—';
  if (CUR_AFTER[cur]) return Number(n).toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: fine ? 4 : 2}) + '\u00a0' + CUR_SIGN[cur];
  return (CUR_SIGN[cur] || (esc(cur) + ' ')) + Number(n).toLocaleString('ru-RU', fine ? {minimumFractionDigits: 2, maximumFractionDigits: 4} : {maximumFractionDigits: 2});
};
const curOption = (c, selected) => '<option value="' + esc(c) + '"' + (selected ? ' selected' : '') + '>' + esc(c) + (CUR_SIGN[c] ? ' (' + CUR_SIGN[c] + ')' : '') + '</option>';
// Поле «Курс к EUR» для не-евро валют (для EUR поле не показывается, курс сохраняется как 1).
function fxFieldHtml(id, cur, value) {
  if (cur === 'EUR') return '';
  const hint = 'Сколько EUR за 1 ' + esc(cur) + ', курс НБУ на дату загрузки';
  return '<div class="fx"><label for="' + id + '" title="' + hint + '">Курс к EUR</label>' +
    '<input id="' + id + '" inputmode="decimal" value="' + (value == null ? '' : esc(value)) + '" placeholder="' + (FX_PLACEHOLDER[cur] || 'курс') + '" title="' + hint + '" aria-describedby="' + id + 'Hint">' +
    '<div class="hint" id="' + id + 'Hint">' + hint + '</div></div>';
}
// Сумма в валюте сделки, а для не-EUR рядом мелко эквивалент в евро.
function moneyEq(n, d) {
  const cur = dealCur(d);
  if (cur === 'EUR' || n == null || !isFinite(n)) return money(n, cur);
  return money(n, cur) + ' <span class="eq">≈ ' + money(n * dealFx(d), 'EUR') + '</span>';
}

// Период дашборда (по дате загрузки). range = null — «Всё время»; иначе {from, to} в виде 'ГГГГ-ММ-ДД', любая граница может быть пустой.
// Запись без даты попадает только во «Всё время».
const iso = (dt) => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
function periodRange(p, today) {
  const t = today || new Date();
  if (p.mode === 'month') return {from: iso(new Date(t.getFullYear(), t.getMonth(), 1)), to: iso(new Date(t.getFullYear(), t.getMonth() + 1, 0))};
  if (p.mode === 'year') return {from: t.getFullYear() + '-01-01', to: t.getFullYear() + '-12-31'};
  if (p.mode === 'custom') return {from: p.from || null, to: p.to || null};
  return null;
}
function inRange(date, range) {
  if (!range) return true;
  if (!date) return false;
  const d = String(date).slice(0, 10);
  return !(range.from && d < range.from) && !(range.to && d > range.to);
}

// Чистая функция итогов дашборда: рейсы + сделки (active/done), без обращения к странице и базе.
// Рейс с deal_id, чья сделка учтена, в сумму не идёт: его объём уже посчитан в сделке (по дате сделки).
function dashboardTotals(tripRows, dealRows, range) {
  const allCounted = (dealRows || []).filter((d) => d.status === 'active' || d.status === 'done');
  const countedIds = new Set(allCounted.map((d) => d.id));
  const counted = allCounted.filter((d) => inRange(d.start_date, range));
  const periodTrips = (tripRows || []).filter((t) => inRange(t.loading_date, range));
  const groups = new Map();
  const tot = {income: 0, cost: 0, tax: 0};
  const add = (clientId, clientName, income, cost, tax) => {
    tot.income += income; tot.cost += cost; tot.tax += tax;
    const key = clientId || '';
    if (!groups.has(key)) groups.set(key, {name: clientId ? (clientName || 'Без названия') : 'Без клиента', noClient: !clientId, income: 0, cost: 0, tax: 0});
    const g = groups.get(key);
    g.income += income; g.cost += cost; g.tax += tax;
  };
  let tripsUsed = 0;
  periodTrips.forEach((t) => {
    if (t.deal_id && countedIds.has(t.deal_id)) return;
    tripsUsed++;
    add(t.client_id, t.clients && t.clients.name, Number(t.income_eur) || 0, Number(t.cost_eur) || 0, Number(t.tax_eur) || 0);
  });
  counted.forEach((d) => {
    const b = calcDeal(d, d.deal_lines).billed, fx = dealFx(d);
    add(d.client_id, d.clients && d.clients.name, b.price * fx, b.cost * fx, b.tax * fx);
  });
  const fin = (x) => Object.assign(x, {profit: x.income - x.cost - x.tax, margin: x.income ? (x.income - x.cost - x.tax) / x.income : null});
  const byClient = Array.from(groups.values()).map(fin).sort((a, b) => b.profit - a.profit);
  return Object.assign(fin(tot), {dealsCount: counted.length, tripsCount: periodTrips.length, tripsUsed: tripsUsed, byClient: byClient});
}

const profit = (t) => (Number(t.income_eur) || 0) - (Number(t.cost_eur) || 0);
const taxOf = (t) => Number(t.tax_eur) || 0;
const net = (t) => profit(t) - taxOf(t);

function showError(msg) {
  const v = $('view');
  v.insertAdjacentHTML('afterbegin', '<div class="err">' + esc(msg) + '</div>');
}

function setNav(active) {
  $('nav-home').classList.toggle('active', active === 'home');
  $('nav-orders').classList.toggle('active', active === 'orders' || active === 'trips' || active === 'deals');
}

function tripStatus(t) {
  if (!t.clients) return '<span class="chip warn">Нужен клиент</span>';
  return '<span class="chip">Клиент указан</span>';
}

function tripsTable(rows) {
  if (!rows.length) return '<div class="pad muted">Рейсов нет</div>';
  return '<div class="scroll"><table><thead><tr>' +
    '<th>Загрузка</th><th>Выгрузка</th><th>Клиент</th><th>Город</th><th>Перевозчик</th><th class="r">Доход</th><th class="r">Расход</th><th class="r">Налог</th><th class="r">Чистая прибыль</th><th>Статус</th>' +
    '</tr></thead><tbody>' +
    rows.map((t) => {
      const p = net(t);
      return '<tr>' +
        '<td><a href="#/trip/' + esc(t.id) + '" style="font-weight:500">' + fdate(t.loading_date) + '</a></td>' +
        '<td>' + fdate(t.unloading_date) + '</td>' +
        '<td>' + (t.clients ? esc(t.clients.name) : '<span class="muted">не указан</span>') + '</td>' +
        '<td>' + esc(t.city || '—') + '</td>' +
        '<td>' + esc(t.carriers ? t.carriers.name : '—') + '</td>' +
        '<td class="r">' + eur(t.income_eur) + '</td>' +
        '<td class="r">' + eur(t.cost_eur) + '</td>' +
        '<td class="r">' + eur(t.tax_eur) + '</td>' +
        '<td class="r ' + (p >= 0 ? 'pos' : 'neg') + '">' + eur(p) + '</td>' +
        '<td>' + tripStatus(t) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

let dashPeriod = {mode: 'all', from: '', to: ''};
const PERIODS = [['all', 'Всё время'], ['month', 'Этот месяц'], ['year', 'Этот год'], ['custom', 'Свои даты']];

// «Прибыль по клиентам»: все клиенты из данных, по чистой прибыли; больше пяти — топ-5 и кнопка «Показать всех».
// «Без клиента» отдельной строкой внизу, «Итого» по всем строкам совпадает с плитками.
let dashAllClients = false;
const CLIENTS_TOP = 5;
function clientsBlock(tot) {
  const list = tot.byClient.filter((g) => !g.noClient), none = tot.byClient.find((g) => g.noClient);
  if (!list.length && !none) return '<div class="card"><h3>Прибыль по клиентам</h3><div class="pad muted">Данных пока нет</div></div>';
  const shown = (dashAllClients || list.length <= CLIENTS_TOP) ? list : list.slice(0, CLIENTS_TOP);
  const row = (name, g, cls) => '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td>' + name + '</td>' +
    '<td class="r">' + eur(g.income) + '</td>' +
    '<td class="r ' + (g.profit >= 0 ? 'pos' : 'neg') + '">' + eur(g.profit) + '</td>' +
    '<td class="r">' + pct(g.margin) + '</td><td class="r">' + g.count + '</td></tr>';
  return '<div class="card"><h3>Прибыль по клиентам <span class="muted" style="font-weight:400;font-size:13px">· клиентов: ' + list.length + '</span></h3>' +
    '<div class="scroll"><table class="tbl-sm"><thead><tr><th>Клиент</th><th class="r">Доход</th><th class="r">Чистая прибыль</th><th class="r">Маржа</th><th class="r">Заказов</th></tr></thead><tbody>' +
    shown.map((g) => row(esc(g.name), g)).join('') +
    (list.length > CLIENTS_TOP ? '<tr><td colspan="5"><button class="linkbtn" id="toggleClients" type="button">' +
      (dashAllClients ? 'Свернуть до топ-' + CLIENTS_TOP : 'Показать всех (' + list.length + ')') + '</button></td></tr>' : '') +
    (none ? row('<span class="muted">Без клиента</span>', none) : '') +
    row('Итого', tot, 'total') +
    '</tbody></table></div></div>';
}

  setNav('home');
  const range = periodRange(dashPeriod);
  const tot = ordersTotals(orders, range, clientName);
  const inc = tot.income, tax = tot.tax, pr = tot.profit;
  const margin = inc > 0 ? (pr / inc * 100) : 0;

    '<div class="top" id="dashTop"><div><h1>Дашборд</h1><div class="sub">Заказы: рейсы и сделки, без черновиков. Суммы в евро. Чистая прибыль: доход минус расход минус налог. ' + periodNote(range) + '</div></div>' +
    '<a class="btn" href="#/orders/new" style="text-decoration:none">+ Новый заказ</a></div>' +
    periodHtml(dashPeriod, 'p') +
    (ordersErr ? '<div class="err">Заказы не загрузились, цифры дашборда неполные: ' + esc(ordersErr) + '</div>' : '') +
    '<div class="metrics">' +
      '<div class="metric"><div class="l">Доход</div><div class="v">' + eur(inc) + '</div></div>' +
      '<div class="metric"><div class="l">Налоги</div><div class="v">' + eur(tax) + '</div></div>' +
      '<div class="metric"><div class="l">Чистая прибыль</div><div class="v ' + (pr >= 0 ? 'pos' : 'neg') + '">' + eur(pr) + '</div></div>' +
      '<div class="metric"><div class="l">Маржа</div><div class="v">' + margin.toFixed(1).replace('.', ',') + '%</div></div>' +
      '<div class="metric"><div class="l">Рейсов</div><div class="v">' + tot.tripsCount + '</div></div>' +
      '<div class="metric"><div class="l">Сделок</div><div class="v">' + tot.dealsCount + '</div></div>' +
    '</div>' +
    (tot.noClientCount ? '<div class="card"><div class="row"><div><strong>У ' + tot.noClientCount + ' заказов не указан клиент.</strong><div class="sub">Откройте заказ и назначьте клиента, тогда он появится в отчётах по клиентам.</div></div><button class="btn ghost small" id="showNoClient" type="button">Показать заказы</button></div></div>' : '') +
    clientsBlock(tot) +
    '<div class="card" id="recentCard"><h3>Последние заказы</h3>' + ordersTable(recent) + '</div>';
  bindPeriod(dashPeriod, 'p', () => renderDashboard(true));
  bindOrderRows($('recentCard'));
  if ($('toggleClients')) $('toggleClients').onclick = () => { dashAllClients = !dashAllClients; renderDashboard(true); };
  if ($('showNoClient')) $('showNoClient').onclick = () => {
    Object.assign(ordersFilter, {mode: dashPeriod.mode, from: dashPeriod.from, to: dashPeriod.to, client: '__none', kind: '', status: ''});
    location.hash = '#/orders';
  };
  // Заказы могли измениться в карточках: подгружаем свежие и перерисовываем один раз.
  if (!fresh && Date.now() - ordersLoadedAt > 3000) {
    loadOrders().then(() => { if ($('dashTop')) renderDashboard(true); });
  }
}

async function findOrCreate(table, name) {
  name = String(name || '').trim();
  if (!name) return null;
  let r = await db.from(table).select('id').eq('name', name).maybeSingle();
  if (r.error) throw r.error;
  if (r.data) return r.data.id;
  r = await db.from(table).insert({name}).select('id').single();
  if (r.error) throw r.error;
  return r.data.id;
}

    e.preventDefault();

      box.classList.remove('hidden'); return;

    const btn = $('saveTrip'); btn.disabled = true; btn.textContent = 'Сохраняю...';
    try {
      const cid = await findOrCreate('clients', $('nClient').value);

/* ===== Расчёты сделок ===== */
// Единые статусы всех заказов (и рейсов, и сделок). Черновик в итоги не идёт.
const DEAL_STATUS = {draft: 'Черновик', active: 'Активный', done: 'Завершён'};
const BASIS = {fixed: 'Фиксированно', per_mark: 'За бутылку (марки)', per_sticker: 'За бутылку (стикеры)'};
const TAX_RATES = [0.18, 0.05];
const COMPANIES = ['ТОВ TradeWay', 'ФОП Эльнур'];
const pct = (x) => (x == null || !isFinite(x)) ? '—' : (x * 100).toFixed(1).replace('.', ',') + '%';
const eurFine = (n) => (n == null || !isFinite(n)) ? '—' : '€' + Number(n).toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 4});

// Чистая функция расчёта: не трогает страницу и базу, только считает.
// deal: {qty_marks, qty_stickers, tax_rate, final_price}; lines: [{basis, cost_rate, sale_rate, unconfirmed}]
function calcDeal(deal, lines) {
  const num = (v) => { const x = Number(v); return (v == null || v === '' || !isFinite(x)) ? 0 : x; };
  const qtyMarks = num(deal.qty_marks), qtyStickers = num(deal.qty_stickers), taxRate = num(deal.tax_rate);
  const mult = (basis) => basis === 'per_mark' ? qtyMarks : basis === 'per_sticker' ? qtyStickers : 1;
  const list = lines || [];
  const rows = list.map((l) => {
    const m = mult(l.basis);
    const cost = num(l.cost_rate) * m, sale = num(l.sale_rate) * m;
    return {cost: cost, sale: sale, diff: sale - cost};
  });
  const cost = rows.reduce((s, r) => s + r.cost, 0);
  const calcPrice = rows.reduce((s, r) => s + r.sale, 0);
  const fp = deal.final_price;
  const billedPrice = (fp == null || fp === '' || !isFinite(Number(fp))) ? calcPrice : Number(fp);
  const sum = (price) => {
    const diff = price - cost;
    const tax = Math.max(0, diff) * taxRate;
    const profit = diff - tax;
    return {price: price, cost: cost, diff: diff, tax: tax, profit: profit,
      margin: price ? profit / price : null, perMark: qtyMarks ? price / qtyMarks : null};
  };
  return {rows: rows, calc: sum(calcPrice), billed: sum(billedPrice), unconfirmed: list.some((l) => !!l.unconfirmed)};
}

function dealStatusChip(st) {
  return '<span class="chip' + (st === 'draft' ? ' warn' : '') + '">' + esc(DEAL_STATUS[st] || st) + '</span>';

// Новые загрузки сверху; расчёты без даты в конце, среди них новее созданные выше.
function sortDealsByStart(rows) {
  return (rows || []).slice().sort((a, b) => {
    const da = a.start_date ? String(a.start_date).slice(0, 10) : '', dbb = b.start_date ? String(b.start_date).slice(0, 10) : '';
    if (da !== dbb) { if (!da) return 1; if (!dbb) return -1; return da < dbb ? 1 : -1; }
    const ca = String(a.created_at || ''), cb = String(b.created_at || '');
    return ca === cb ? 0 : (ca < cb ? 1 : -1);
  });
}

        '<div class="w"><label for="dCompany">Компания</label><select id="dCompany"><option value="">— не выбрана —</option>' +

      '</div></section>' +

'</div>' +

  $('dClient').oninput = (e) => { d.client_name = e.target.value; };
  bindNum('dMarks', 'qty_marks'); bindNum('dStickers', 'qty_stickers'); bindNum('dPallets', 'pallets'); bindNum('dFinal', 'final_price');

  $('dEnd').onchange = (e) => { d.end_date = e.target.value || null; };

  const onLine = (e) => {

    if (!l) return;
    if (f === 'unconfirmed') l.unconfirmed = e.target.checked;
    else if (f === 'cost_rate' || f === 'sale_rate') l[f] = numOrNull(e.target.value);
    else l[f] = e.target.value;

    const tr = b.closest('tr[data-key]');

}

function updateDealCalc() {
  const s = dealState, res = calcDeal(s.deal, s.lines), cur = dealCur(s.deal);
  const m = (n) => money(n, cur), mFine = (n) => money(n, cur, true);
  s.lines.forEach((l, i) => {
    const tr = document.querySelector('#dLines tr[data-key="' + l.key + '"]');
    if (!tr) return;
    const r = res.rows[i];
    tr.querySelector('[data-c="cost"]').textContent = l.cost_rate == null ? '—' : m(r.cost);
    tr.querySelector('[data-c="sale"]').textContent = l.sale_rate == null ? '—' : m(r.sale);
    const dc = tr.querySelector('[data-c="diff"]');
    dc.textContent = (l.cost_rate == null && l.sale_rate == null) ? '—' : m(r.diff);
    dc.className = 'r ' + (r.diff >= 0 ? 'pos' : 'neg');
  });
  const a = res.calc, b = res.billed;
  const line = (label, f, fmt, cls) => '<tr><td' + (cls ? ' style="font-weight:600"' : '') + '>' + label + '</td>' +
    [a, b].map((x) => '<td class="r' + (cls ? ' ' + (x[f] >= 0 ? 'pos' : 'neg') : '') + '">' + fmt(x[f]) + '</td>').join('') + '</tr>';
  const mEq = (n) => moneyEq(n, s.deal);
  $('dTot').innerHTML =
    line('Цена', 'price', mEq) + line('Себестоимость', 'cost', mEq) + line('Разница', 'diff', mEq) +
    line('Налог (' + pct(Number(s.deal.tax_rate) || 0) + ')', 'tax', mEq) + line('Прибыль', 'profit', mEq, true) +
    line('Маржа', 'margin', pct) + line('Цена за бутылку (марки)', 'perMark', mFine);
  const fxNum = Number(s.deal.fx_to_eur);
  $('dWarn').innerHTML = (res.unconfirmed ? '<div class="warnbox">Есть строки «не подтверждено»: итог может быть неполным.</div>' : '') +
    (cur !== 'EUR' && fxNum === 1 ? '<div class="warnbox">Курс к евро равен 1. Проверьте, что он указан верно.</div>' : '');
  $('dFinal').placeholder = m(a.price);
}

async function saveDeal(activate) {
  const s = dealState, d = s.deal, box = $('dealErr');
  box.classList.add('hidden');
  const fail = (m) => { box.textContent = m; box.classList.remove('hidden'); box.scrollIntoView({block: 'center'}); };
  const title = String(d.title || '').trim();
  if (!title) return fail('Укажите название расчёта.');
  for (const v of [d.qty_marks, d.qty_stickers, d.pallets]) {
    if (v != null && !(Number.isInteger(v) && v >= 0)) return fail('Количество бутылок и палет: только целые числа без минуса.');
  }
  if (d.final_price != null && Number.isNaN(d.final_price)) return fail('Проверьте поле «Выставлено клиенту»: только цифры.');
  if (dealCur(d) !== 'EUR' && !(d.fx_to_eur != null && d.fx_to_eur !== '' && isFinite(Number(d.fx_to_eur)) && Number(d.fx_to_eur) > 0)) return fail('Укажите курс к евро: число больше нуля, например 0,92.');
  if (d.start_date && d.end_date && d.end_date < d.start_date) return fail('Дата выгрузки на складе раньше даты загрузки. Проверьте даты.');
  for (const l of s.lines) {
    if (!String(l.name || '').trim()) return fail('У каждой строки должно быть название.');
    if ([l.cost_rate, l.sale_rate].some((x) => x != null && Number.isNaN(x))) return fail('Проверьте ставки в строке «' + l.name + '»: только цифры.');
  }
  const btns = [$('dSave'), $('dActivate')].filter(Boolean);
  btns.forEach((b) => { b.disabled = true; });
  $('dSave').textContent = 'Сохраняю...';
  try {
    const cid = await findOrCreate('clients', d.client_name);
    const row = {title: title, client_id: cid, qty_marks: d.qty_marks == null ? 0 : d.qty_marks,
      qty_stickers: d.qty_stickers == null ? 0 : d.qty_stickers, pallets: d.pallets,
      tax_rate: Number(d.tax_rate) || 0, final_price: d.final_price,
      start_date: d.start_date || null, end_date: d.end_date || null, company: d.company || null,
      currency: dealCur(d), fx_to_eur: dealCur(d) === 'EUR' ? 1 : Number(d.fx_to_eur)};
    row.status = activate ? 'active' : normStatus(d.status);
    let r = await db.from('deals').update(row).eq('id', s.id);
    if (r.error) throw r.error;
    if (s.removed.length) {
      r = await db.from('deal_lines').delete().in('id', s.removed);
      if (r.error) throw r.error;
      s.removed = [];
    }
    const toDb = (l, i) => ({deal_id: s.id, name: String(l.name).trim(), basis: l.basis, cost_rate: l.cost_rate,
      sale_rate: l.sale_rate, unconfirmed: !!l.unconfirmed, sort: i});
    const upd = [], ins = [];
    s.lines.forEach((l, i) => {
      if (!l.id) ins.push(toDb(l, i));
      else if (l.dirty || l.sort !== i) upd.push(Object.assign({id: l.id}, toDb(l, i)));
    });
    if (upd.length) { r = await db.from('deal_lines').upsert(upd); if (r.error) throw r.error; }
    if (ins.length) { r = await db.from('deal_lines').insert(ins); if (r.error) throw r.error; }
    const cl = await db.from('clients').select('id, name').order('name');
    if (!cl.error) clients = cl.data;
    await renderDeal(s.id, 'Сохранено. Статус: ' + DEAL_STATUS[row.status] + '.');
  } catch (err) {
    fail('Не удалось сохранить: ' + err.message);
    btns.forEach((b) => { b.disabled = false; });
    $('dSave').textContent = 'Сохранить';
  }
}

/* ===== Заказы: общий список рейсов и сделок из представления orders (все суммы там уже в евро) ===== */
const ORDER_KIND = {trip: 'Рейс', deal: 'С расчётом'};
const ORDER_STATUS = DEAL_STATUS;
const ORDER_COUNTED = ['active', 'done'];   // черновики в итоги не идут
// Статус рейса хранится в самом рейсе (trips.status). Всё, что не draft/active/done
// (старые «Импорт», пустые и прочие значения из старой таблицы), считается «Завершён».
const normStatus = (st) => DEAL_STATUS[st] ? st : 'done';
function normalizeOrders(rows, tripRows) {
  const tripSt = new Map((tripRows || []).map((t) => [t.id, t.status]));
  return (rows || []).map((o) => Object.assign({}, o, {status: o.kind === 'trip' ? normStatus(tripSt.get(o.id)) : normStatus(o.status)}));
}
const NEW_ORDER_TAX = 0.18;
const NEW_ORDER_COMPANY = COMPANIES[0];

let orders = [], ordersErr = null, ordersLoadedAt = 0, ordersOkMsg = '';
let ordersFilter = {mode: 'all', from: '', to: '', client: '', kind: '', status: ''};

async function loadOrders() {
  const r = await db.from('orders').select('*');
  if (r.error) { orders = []; ordersErr = r.error.message; } else { orders = normalizeOrders(r.data, trips); ordersErr = null; }
  ordersLoadedAt = Date.now();
}
const clientName = (id) => { const c = clients.find((x) => x.id === id); return c ? c.name : ''; };
const numZ = (v) => { const x = Number(v); return (v == null || v === '' || !isFinite(x)) ? 0 : x; };

// Чистая функция итогов: только active/done, по дате загрузки (start_date). Прибыль = сумма net_eur.
function ordersTotals(rows, range, nameOf) {
  const list = (rows || []).filter((o) => ORDER_COUNTED.includes(o.status) && inRange(o.start_date, range));
  const blank = () => ({income: 0, cost: 0, tax: 0, profit: 0, count: 0});
  const tot = blank(), groups = new Map();
  list.forEach((o) => {
    const v = {income: numZ(o.income_eur), cost: numZ(o.cost_eur), tax: numZ(o.tax_eur), profit: numZ(o.net_eur)};
    const key = o.client_id || '';
    if (!groups.has(key)) groups.set(key, Object.assign(blank(), {name: key ? ((nameOf && nameOf(key)) || 'Без названия') : 'Без клиента', noClient: !key}));
    const g = groups.get(key);
    Object.keys(v).forEach((k) => { tot[k] += v[k]; g[k] += v[k]; });
    g.count++; tot.count++;
  });
  const fin = (x) => Object.assign(x, {margin: x.income ? x.profit / x.income : null});
  return Object.assign(fin(tot), {
    tripsCount: list.filter((o) => o.kind === 'trip').length,
    dealsCount: list.filter((o) => o.kind === 'deal').length,
    noClientCount: list.filter((o) => !o.client_id).length,
    byClient: Array.from(groups.values()).map(fin).sort((a, b) => b.profit - a.profit)
  });
}
// Чистая функция списка: фильтры и сортировка по дате загрузки, новые сверху, без даты в конце.
function filterOrders(rows, f, range) {
  return (rows || []).filter((o) => inRange(o.start_date, range) &&
      (!f.client || (f.client === '__none' ? !o.client_id : o.client_id === f.client)) &&
      (!f.kind || o.kind === f.kind) && (!f.status || o.status === f.status))
    .sort((a, b) => {
      const da = a.start_date ? String(a.start_date).slice(0, 10) : '', dbb = b.start_date ? String(b.start_date).slice(0, 10) : '';
      if (da !== dbb) { if (!da) return 1; if (!dbb) return -1; return da < dbb ? 1 : -1; }
      const ea = a.end_date ? String(a.end_date) : '', eb = b.end_date ? String(b.end_date) : '';
      return ea === eb ? 0 : (ea < eb ? 1 : -1);
    });
}
// Сумма в евро; для не-EUR мелко исходная сумма в валюте заказа (евро ÷ курс).
function orderMoney(n, o) {
  const fx = Number(o.fx_to_eur), cur = o.currency || 'EUR';
  if (cur === 'EUR' || n == null || !(isFinite(fx) && fx > 0)) return eur(n);
  return eur(n) + '<span class="eq">' + money(Number(n) / fx, cur) + '</span>';
}
function orderStatusChip(st) {
  return '<span class="chip' + (st === 'draft' ? ' warn' : '') + '">' + esc(ORDER_STATUS[st] || st) + '</span>';
}
function ordersTable(rows) {
  if (!rows.length) return '<div class="pad muted">Заказов не найдено</div>';
  return '<div class="scroll"><table class="orders"><thead><tr>' +
    '<th>Загрузка</th><th>Выгрузка</th><th>Клиент</th><th>Название</th><th>Тип</th><th>Статус</th><th class="r">Доход</th><th class="r">Чистая прибыль</th>' +
    '</tr></thead><tbody>' +
    rows.map((o) => {
      const href = (o.kind === 'trip' ? '#/trip/' : '#/deal/') + o.id;
      const name = clientName(o.client_id), p = numZ(o.net_eur);
      return '<tr data-href="' + esc(href) + '">' +
        '<td style="white-space:nowrap"><a href="' + esc(href) + '" style="font-weight:500">' + fdate(o.start_date) + '</a></td>' +
        '<td style="white-space:nowrap">' + fdate(o.end_date) + '</td>' +
        '<td>' + (name ? esc(name) : '<span class="muted">не указан</span>') + '</td>' +
        '<td>' + esc(o.title || '—') + '</td>' +
        '<td><span class="kind ' + (o.kind === 'trip' ? 'k-trip' : 'k-deal') + '">' + esc(ORDER_KIND[o.kind] || o.kind) + '</span></td>' +
        '<td>' + orderStatusChip(o.status) + '</td>' +
        '<td class="r">' + orderMoney(o.income_eur, o) + '</td>' +
        '<td class="r ' + (p >= 0 ? 'pos' : 'neg') + '">' + orderMoney(o.net_eur, o) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}
function bindOrderRows(root) {
  root.querySelectorAll('tr[data-href]').forEach((tr) => {
    tr.onclick = (e) => { if (!e.target.closest('a')) location.hash = tr.getAttribute('data-href'); };
  });
}

// Переключатель периода (общий для дашборда и списка заказов).
function periodHtml(p, pre) {
  return '<div class="period"><div class="seg" role="group" aria-label="Период по дате загрузки" id="' + pre + 'Seg">' +
    PERIODS.map(([k, v]) => '<button type="button" data-p="' + k + '" aria-pressed="' + (p.mode === k) + '">' + v + '</button>').join('') + '</div>' +
    (p.mode === 'custom' ? '<div class="rng"><label for="' + pre + 'From">с</label><input type="date" id="' + pre + 'From" value="' + esc(p.from) + '">' +
      '<label for="' + pre + 'To">по</label><input type="date" id="' + pre + 'To" value="' + esc(p.to) + '"></div>' : '') + '</div>';
}
function bindPeriod(p, pre, redraw) {
  $(pre + 'Seg').querySelectorAll('[data-p]').forEach((b) => { b.onclick = () => { p.mode = b.getAttribute('data-p'); redraw(); }; });
  if ($(pre + 'From')) {
    $(pre + 'From').onchange = (e) => { p.from = e.target.value; redraw(); };
    $(pre + 'To').onchange = (e) => { p.to = e.target.value; redraw(); };
  }
}
const periodNote = (range) => !range ? '' : 'Период: ' + (range.from ? fdate(range.from) : '…') + ' — ' + (range.to ? fdate(range.to) : '…') + '. Заказы без даты загрузки не входят.';

    '<a class="btn" href="#/orders/new" style="text-decoration:none">+ Новый заказ</a></div>' +

        clients.map((c) => opt(c.id, c.name, f.client)).join('') + '</select></div>' +
      '<div><label for="fKind">Тип</label><select id="fKind">' + opt('', 'Все типы', f.kind) + Object.entries(ORDER_KIND).map(([k, v]) => opt(k, v, f.kind)).join('') + '</select></div>' +
      '<div><label for="fStatus">Статус</label><select id="fStatus">' + opt('', 'Все статусы', f.status) + Object.entries(ORDER_STATUS).map(([k, v]) => opt(k, v, f.status)).join('') + '</select></div>' +
      '<div class="cnt muted">Найдено: ' + rows.length + '</div>' +

  bindPeriod(f, 'o', () => renderOrders(true));
  $('fClient').onchange = (e) => { f.client = e.target.value; renderOrders(true); };
  $('fKind').onchange = (e) => { f.kind = e.target.value; renderOrders(true); };

  bindOrderRows($('ordersCard'));
  // Заказы могли измениться в карточках: подгружаем свежие и перерисовываем один раз.
  if (!fresh && Date.now() - ordersLoadedAt > 3000) {
    loadOrders().then(() => { if ($('ordersTop')) renderOrders(true); });

}

/* ----- Новый заказ: быстрый режим (доход/затраты) или расчёт по услугам ----- */
let newOrder = null;

async function renderNewOrder() {
  setNav('orders');
  $('view').innerHTML = '<div class="muted">Открываю форму...</div>';
  const cat = await db.from('service_catalog').select('*').order('sort').order('name');
  if (location.hash !== '#/orders/new') return;
  newOrder = {client_name: '', title: '', start_date: null, end_date: null, currency: 'EUR', fx_to_eur: null,
    income: null, cost: null, services: false, qty_marks: null, qty_stickers: null, lines: [],
    catalog: cat.error ? [] : cat.data, catErr: cat.error ? cat.error.message : ''};
  drawNewOrder();
}

// Сделка и строки, которые будут сохранены; по ним же считаем налог и прибыль в форме.
function newOrderDeal(s) {
  const deal = {qty_marks: s.services ? s.qty_marks : 0, qty_stickers: s.services ? s.qty_stickers : 0, tax_rate: NEW_ORDER_TAX,
    final_price: s.services ? null : s.income, currency: s.currency, fx_to_eur: s.fx_to_eur};
  const lines = s.services ? s.lines : [{name: 'Перевозка', basis: 'fixed', cost_rate: s.cost, sale_rate: s.income, unconfirmed: false}];
  return {deal: deal, lines: lines};
}

function drawNewOrder() {
  const s = newOrder, cur = s.currency, sign = CUR_SIGN[cur] || esc(cur);
  const val = (v) => v == null ? '' : esc(v);
  $('view').innerHTML =
    '<div class="dealv">' +
    '<div class="deal-head"><a href="#/orders" style="font-size:14px;text-decoration:none">← Все заказы</a><h1>Новый заказ</h1></div>' +
    '<div id="noErr" class="err hidden"></div>' +
    '<div class="deal-grid"><div class="deal-left">' +
      '<section class="card" aria-label="Заказ"><div class="dfields">' +
        '<div class="w3"><label for="noClient">Клиент</label><input id="noClient" list="noClientList" value="' + val(s.client_name) + '" placeholder="Выберите или впишите нового"><datalist id="noClientList">' + clients.map((c) => '<option value="' + esc(c.name) + '">').join('') + '</datalist></div>' +
        '<div class="w3"><label for="noTitle">Название / маршрут</label><input id="noTitle" value="' + val(s.title) + '" placeholder="Напр. Город А — Город Б"></div>' +
        '<div class="dt"><label for="noStart">Загрузка</label><input id="noStart" type="date" value="' + val(s.start_date) + '"></div>' +
        '<div class="dt"><label for="noEnd">Выгрузка</label><input id="noEnd" type="date" value="' + val(s.end_date) + '"></div>' +
        '<div><label for="noCur">Валюта</label><select id="noCur">' + Object.keys(CUR_SIGN).map((c) => curOption(c, c === cur)).join('') + '</select></div>' +
        fxFieldHtml('noFx', cur, s.fx_to_eur) +
        '<div><label for="noIncome">Доход, ' + sign + '</label><input id="noIncome" inputmode="decimal" value="' + val(s.income) + '"' + (s.services ? ' readonly title="Считается из расчёта по услугам"' : '') + '></div>' +
        '<div><label for="noCost">Затраты, ' + sign + '</label><input id="noCost" inputmode="decimal" value="' + val(s.cost) + '"' + (s.services ? ' readonly title="Считается из расчёта по услугам"' : '') + '></div>' +
      '</div>' +
      '<label class="toggle"><input type="checkbox" id="noSvc"' + (s.services ? ' checked' : '') + '> Добавить расчёт по услугам</label>' +
      '</section>' +
      (!s.services ? '' :
      '<section class="card" aria-label="Расчёт по услугам">' +
        (s.catErr ? '<div class="err" style="margin:12px 14px 0">Каталог услуг не загрузился: ' + esc(s.catErr) + '</div>' : '') +
        '<div class="dfields">' +
          '<div><label for="noMarks" title="Бутылок под акцизные марки">Бут. под марки</label><input id="noMarks" inputmode="numeric" value="' + val(s.qty_marks) + '"></div>' +
          '<div><label for="noStickers" title="Бутылок под стикеры">Бут. под стикеры</label><input id="noStickers" inputmode="numeric" value="' + val(s.qty_stickers) + '"></div>' +
        '</div>' +
        '<div class="lines-wrap"><table class="lines"><thead><tr>' +
          '<th>Статья</th><th>Основа</th><th class="r" title="Ставка затрат">Затраты/ед., ' + sign + '</th><th class="r" title="Ставка продажи">Продажа/ед., ' + sign + '</th><th class="r">Затраты</th><th class="r">Продажа</th><th class="r">Разница</th><th title="Не подтверждено">Не подтв.</th><th><span class="sr">Удалить</span></th>' +
        '</tr></thead><tbody id="noLines">' + s.lines.map(dealLineRow).join('') + '</tbody></table></div>' +
        '<div class="addrow"><label for="noAdd" class="sr">Добавить строку</label><select id="noAdd"><option value="">Своя строка</option>' +
          s.catalog.map((c) => '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>').join('') + '</select>' +
          '<button class="btn small" id="noAddBtn" type="button">+ Добавить строку</button></div>' +
      '</section>') +
    '</div><aside class="deal-side">' +
      '<div class="card"><h3 class="sm">Итог (налог ' + pct(NEW_ORDER_TAX) + ')</h3><div class="scroll"><table class="tot"><tbody id="noTot"></tbody></table></div></div>' +
      '<div id="noWarn"></div>' +
      '<div class="side-acts"><button class="btn" id="noSave" type="button">Сохранить заказ</button><a class="btn ghost" href="#/orders" style="text-decoration:none;text-align:center">Отмена</a></div>' +
    '</aside></div></div>';

  const num = (id, f) => { if ($(id)) $(id).oninput = (e) => { s[f] = numOrNull(e.target.value); updateNewOrderCalc(); }; };
  $('noClient').oninput = (e) => { s.client_name = e.target.value; };
  $('noTitle').oninput = (e) => { s.title = e.target.value; };
  $('noStart').onchange = (e) => { s.start_date = e.target.value || null; };
  $('noEnd').onchange = (e) => { s.end_date = e.target.value || null; };
  $('noCur').onchange = (e) => { s.currency = e.target.value; drawNewOrder(); };
  num('noFx', 'fx_to_eur');
  if (!s.services) { num('noIncome', 'income'); num('noCost', 'cost'); }
  $('noSvc').onchange = (e) => {
    if (e.target.checked) {
      // Первая строка расчёта — то, что уже вписано в доход и затраты.
      if (!s.lines.length) s.lines.push({name: 'Перевозка', basis: 'fixed', cost_rate: s.cost, sale_rate: s.income, unconfirmed: false, key: 'k' + (++lineSeq)});
      s.services = true;
    } else {
      const b = calcDeal(newOrderDeal(s).deal, s.lines).billed;
      s.income = b.price; s.cost = b.cost; s.services = false;
    }
    drawNewOrder();
  };
  if (s.services) {
    num('noMarks', 'qty_marks'); num('noStickers', 'qty_stickers');
    const onLine = (e) => {
      const tr = e.target.closest('tr[data-key]'); const f = e.target.getAttribute('data-f');
      if (!tr || !f) return;
      const l = s.lines.find((x) => x.key === tr.getAttribute('data-key'));
      if (!l) return;
      if (f === 'unconfirmed') l.unconfirmed = e.target.checked;
      else if (f === 'cost_rate' || f === 'sale_rate') l[f] = numOrNull(e.target.value);
      else l[f] = e.target.value;
      updateNewOrderCalc();
    };
    $('noLines').addEventListener('input', onLine);
    $('noLines').addEventListener('change', onLine);
    $('noLines').addEventListener('click', (e) => {
      const b = e.target.closest('[data-del]'); if (!b) return;
      const tr = b.closest('tr[data-key]');
      const i = s.lines.findIndex((x) => x.key === tr.getAttribute('data-key'));
      if (i < 0) return;
      s.lines.splice(i, 1); tr.remove(); updateNewOrderCalc();
    });
    $('noAddBtn').onclick = () => {
      const c = s.catalog.find((x) => x.id === $('noAdd').value);
      const l = c ? {name: c.name, basis: c.basis, cost_rate: c.cost_rate, sale_rate: c.sale_rate}
                  : {name: '', basis: 'fixed', cost_rate: null, sale_rate: null};
      l.unconfirmed = false; l.key = 'k' + (++lineSeq);
      s.lines.push(l);
      $('noLines').insertAdjacentHTML('beforeend', dealLineRow(l));
      updateNewOrderCalc();
      if (!c) $('noLines').lastElementChild.querySelector('[data-f="name"]').focus();
    };
  }
  $('noSave').onclick = saveNewOrder;
  updateNewOrderCalc();
}

function updateNewOrderCalc() {
  const s = newOrder, x = newOrderDeal(s), res = calcDeal(x.deal, x.lines), b = res.billed, cur = s.currency;
  const m = (n) => money(n, cur), mEq = (n) => moneyEq(n, x.deal);
  if (s.services) {
    s.lines.forEach((l, i) => {
      const tr = document.querySelector('#noLines tr[data-key="' + l.key + '"]');
      if (!tr) return;
      const r = res.rows[i];
      tr.querySelector('[data-c="cost"]').textContent = l.cost_rate == null ? '—' : m(r.cost);
      tr.querySelector('[data-c="sale"]').textContent = l.sale_rate == null ? '—' : m(r.sale);
      const dc = tr.querySelector('[data-c="diff"]');
      dc.textContent = (l.cost_rate == null && l.sale_rate == null) ? '—' : m(r.diff);
      dc.className = 'r ' + (r.diff >= 0 ? 'pos' : 'neg');
    });
    $('noIncome').value = Math.round(b.price * 100) / 100;
    $('noCost').value = Math.round(b.cost * 100) / 100;
  }
  const row = (label, n, bold) => '<tr><td' + (bold ? ' style="font-weight:600"' : '') + '>' + label + '</td><td class="r' + (bold ? ' ' + (n >= 0 ? 'pos' : 'neg') : '') + '">' + mEq(n) + '</td></tr>';
  $('noTot').innerHTML = row('Доход', b.price) + row('Затраты', b.cost) + row('Разница', b.diff) +
    row('Налог (' + pct(NEW_ORDER_TAX) + ' с разницы)', b.tax) + row('Чистая прибыль', b.profit, true) +
    '<tr><td>Маржа</td><td class="r">' + pct(b.margin) + '</td></tr>';
  $('noWarn').innerHTML = (res.unconfirmed ? '<div class="warnbox">Есть строки «не подтверждено»: итог может быть неполным.</div>' : '') +
    (cur !== 'EUR' && Number(s.fx_to_eur) === 1 ? '<div class="warnbox">Курс к евро равен 1. Проверьте, что он указан верно.</div>' : '');
}

async function saveNewOrder() {
  const s = newOrder, box = $('noErr');
  box.classList.add('hidden');
  const fail = (m) => { box.textContent = m; box.classList.remove('hidden'); box.scrollIntoView({block: 'center'}); };
  const bad = (v) => v != null && Number.isNaN(v);
  const title = String(s.title || '').trim();
  if (!title) return fail('Укажите название или маршрут заказа.');
  if (s.currency !== 'EUR' && !(s.fx_to_eur != null && isFinite(s.fx_to_eur) && s.fx_to_eur > 0)) return fail('Укажите курс к евро: число больше нуля, например 0,92.');
  if (s.start_date && s.end_date && s.end_date < s.start_date) return fail('Дата выгрузки раньше даты загрузки. Проверьте даты.');
  if (!s.services) {
    if (s.income == null || s.cost == null) return fail('Укажите доход и затраты (можно 0).');
    if (bad(s.income) || bad(s.cost)) return fail('Доход и затраты: только цифры.');
  } else {
    if (!s.lines.length) return fail('Добавьте хотя бы одну строку расчёта или выключите расчёт по услугам.');
    for (const v of [s.qty_marks, s.qty_stickers]) {
      if (v != null && !(Number.isInteger(v) && v >= 0)) return fail('Количество бутылок: только целые числа без минуса.');
    }
    for (const l of s.lines) {
      if (!String(l.name || '').trim()) return fail('У каждой строки должно быть название.');
      if (bad(l.cost_rate) || bad(l.sale_rate)) return fail('Проверьте ставки в строке «' + l.name + '»: только цифры.');
    }
  }
  const btn = $('noSave'); btn.disabled = true; btn.textContent = 'Сохраняю...';
  let newId = null;
  try {
    const cid = await findOrCreate('clients', s.client_name);
    const x = newOrderDeal(s);
    const d = await db.from('deals').insert({
      title: title, client_id: cid, status: 'active', tax_rate: NEW_ORDER_TAX, company: NEW_ORDER_COMPANY,
      start_date: s.start_date || null, end_date: s.end_date || null,
      currency: s.currency, fx_to_eur: s.currency === 'EUR' ? 1 : s.fx_to_eur,
      final_price: x.deal.final_price, qty_marks: x.deal.qty_marks || 0, qty_stickers: x.deal.qty_stickers || 0
    }).select('id').single();
    if (d.error) throw d.error;
    newId = d.data.id;
    const ins = await db.from('deal_lines').insert(x.lines.map((l, i) => ({deal_id: newId, name: String(l.name).trim(), basis: l.basis,
      cost_rate: l.cost_rate, sale_rate: l.sale_rate, unconfirmed: !!l.unconfirmed, sort: i})));
    if (ins.error) {
      // Строки не сохранились: убираем только что созданную пустую сделку, чтобы не осталось заказа без расчёта.
      await db.from('deals').delete().eq('id', newId);
      throw ins.error;
    }
    const cl = await db.from('clients').select('id, name').order('name');
    if (!cl.error) clients = cl.data;
    await loadOrders();
    ordersOkMsg = 'Заказ «' + title + '» сохранён.';
    newOrder = null;
    location.hash = '#/orders';
  } catch (err) {
    fail('Не удалось сохранить: ' + err.message);
    btn.disabled = false; btn.textContent = 'Сохранить заказ';
  }
}

function route() {
  const h = location.hash || '#/';
  if (h.startsWith('#/trip/')) return renderTrip(h.slice(7));
  if (h === '#/trips') { ordersFilter.kind = 'trip'; location.replace('#/orders'); return; }
  if (h.startsWith('#/deal/')) return renderDeal(h.slice(7));
  if (h === '#/deals') { ordersFilter.kind = 'deal'; location.replace('#/orders'); return; }
  if (h === '#/orders/new') return renderNewOrder();
  if (h === '#/orders') return renderOrders();
  return renderDashboard();
}

async function enterApp() {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('view').innerHTML = '<div class="muted">Загружаю данные...</div>';
  try { await loadAll(); route(); }
  catch (err) { $('view').innerHTML = '<div class="err">Не удалось загрузить данные: ' + esc(err.message) + '</div>'; }
}

function enterLogin() {
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
}

$('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const box = $('loginErr'); box.classList.add('hidden');
  const btn = $('loginBtn'); btn.disabled = true; btn.textContent = 'Входим...';
  const r = await db.auth.signInWithPassword({email: $('email').value.trim(), password: $('password').value});
  btn.disabled = false; btn.textContent = 'Войти';
  if (r.error) { box.textContent = 'Не удалось войти. Проверьте email и пароль.'; box.classList.remove('hidden'); return; }
  $('password').value = '';
  enterApp();
};

$('logoutBtn').onclick = async () => { await db.auth.signOut(); trips = []; clients = []; carriers = []; deals = []; orders = []; enterLogin(); };
window.addEventListener('hashchange', () => { if (!$('app').classList.contains('hidden') && trips.length + clients.length >= 0) route(); });

(async () => {
  const s = await db.auth.getSession();
  if (s.data.session) enterApp(); else enterLogin();
})();
</script>
</body>
</html>

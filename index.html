<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradeWay CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --navy:#1E3A5F; --ink:#14213D; --muted:#4A5568; --line:#DCE2EA; --bg:#F3F5F8; --card:#FFFFFF;
  --warnbg:#FFF4DC; --warn:#7A4B00; --okbg:#E4F4EC; --ok:#1B6B45; --field:#7B8798;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--navy)}
button{font-family:inherit}
.hidden{display:none!important}
/* login */
.login-wrap{min-height:100vh;display:flex;flex-wrap:wrap}
.login-left{flex:1 1 420px;background:var(--navy);color:#fff;padding:64px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.login-left h1{margin:0;font-size:40px;line-height:1.15;font-weight:600;letter-spacing:-.8px;max-width:460px}
.login-left p{margin:0;font-size:17px;line-height:1.5;color:#C9D6E8;max-width:460px}
.login-right{flex:1 1 420px;display:flex;align-items:center;justify-content:center;padding:48px}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:36px;display:flex;flex-direction:column;gap:18px}
.login-card h2{margin:0;font-size:24px;font-weight:600}
.brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:600}
.brand span{font-weight:400;color:#C9D6E8}
/* shell */
.shell{min-height:100vh;display:flex;flex-wrap:wrap}
.side{flex:0 0 220px;background:var(--card);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:24px}
.side .brand{color:var(--ink);font-size:16px;padding:0 8px}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav a{display:block;padding:10px 12px;font-size:14px;color:var(--ink);border-radius:8px;text-decoration:none}
.side nav a.active{background:#E6EDF6;color:var(--navy);font-weight:600}
.side .spacer{flex:1}
.main{flex:999 1 560px;min-width:0;padding:32px;display:flex;flex-direction:column;gap:24px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px}
.top h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.5px}
.sub{font-size:13px;color:var(--muted)}
.btn{padding:11px 18px;font-size:14px;font-weight:500;color:#fff;background:var(--navy);border:0;border-radius:8px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--field)}
.btn.small{padding:8px 12px;font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px}
.metric .l{font-size:13px;color:var(--muted)}
.metric .v{font-size:28px;font-weight:600;letter-spacing:-.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card h3{margin:0;padding:18px 20px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600}
.scroll{overflow-x:auto}
table{width:100%;min-width:860px;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-size:12px;font-weight:500;padding:12px 8px}
td{padding:14px 8px;border-top:1px solid var(--line)}
th:first-child,td:first-child{padding-left:20px}
th:last-child,td:last-child{padding-right:20px}
.r{text-align:right}
.pos{color:var(--ok);font-weight:600}
.neg{color:#9B1C1C;font-weight:600}
.chip{display:inline-block;font-size:12px;padding:4px 10px;border-radius:12px;background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding:20px}
.kv .k{font-size:12px;color:var(--muted);margin-bottom:4px}
.kv .val{font-size:14px;line-height:1.5;word-break:break-word}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.cols>.a{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px}
.cols>.b{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:24px}
.row{padding:16px 20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.row:first-of-type{border-top:0}
.pad{padding:20px;display:flex;flex-direction:column;gap:14px}
label{font-size:13px;font-weight:500;display:block;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 12px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff;border:1px solid var(--field);border-radius:8px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.err{background:#FCEBEB;color:#9B1C1C;border-radius:8px;padding:10px 14px;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(20,33,61,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:560px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:20px}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
details{padding:0 20px 16px}
summary{cursor:pointer;font-size:13px;color:var(--muted);padding:6px 0}
pre{margin:8px 0 0;white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--bg);padding:12px;border-radius:8px}
.search{max-width:320px}
/* расчёты сделок */
.tbl-sm{min-width:560px}
.lines{min-width:1000px}
.lines td{vertical-align:middle}
.lines input,.lines select{padding:8px 10px}
.lines input.num{text-align:right;min-width:90px}
.lines td:first-child input{min-width:180px}
.tot{min-width:0}
.tot th,.tot td{white-space:nowrap}
.tot td:first-child{white-space:normal;min-width:90px}
.lines select{min-width:190px}
.chk{display:flex;align-items:center;gap:8px;margin:0;font-weight:400;white-space:nowrap}
.chk input{width:auto;margin:0}
.okbox{background:var(--okbg);color:var(--ok);border-radius:8px;padding:10px 14px;font-size:13px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:13px;margin:16px 20px 0}
@media (max-width:640px){.dealv .f2{grid-template-columns:1fr}.dealv .tot th,.dealv .tot td{padding-left:12px;padding-right:12px;font-size:13px}.dealv .acts{justify-content:stretch}.dealv .acts .btn{flex:1 1 auto}}
</style>
</head>
<body>

<div id="login" class="login-wrap hidden">
  <div class="login-left">
    <div class="brand">TradeWay <span>Solution</span></div>
    <div>
      <h1>Рейсы, документы и акциз в одном месте</h1>
      <p style="margin-top:20px">CRM для международного экспедитора. Рейс в центре: вокруг него клиент, перевозчик, деньги и документы.</p>
    </div>
    <div style="font-size:14px;color:#C9D6E8">Доступ только по логину</div>
  </div>
  <div class="login-right">
    <form id="loginForm" class="login-card">
      <h2>Вход</h2>
      <div id="loginErr" class="err hidden"></div>
      <div><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" id="loginBtn">Войти</button>
    </form>
  </div>
</div>

<div id="app" class="shell hidden">
  <aside class="side">
    <div class="brand">TradeWay</div>
    <nav>
      <a href="#/" id="nav-home">Дашборд</a>
      <a href="#/trips" id="nav-trips">Рейсы</a>
      <a href="#/deals" id="nav-deals">Расчёты</a>
    </nav>
    <div class="spacer"></div>
    <button class="btn ghost small" id="logoutBtn" type="button">Выйти</button>
  </aside>
  <main class="main" id="view"></main>
</div>

<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://imwfzjeewbfseexumard.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bz86mNhG0gcyqr67nFhq1Q_9FG6hhaz';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = (n) => (n == null || n === '') ? '—' : '€' + Number(n).toLocaleString('ru-RU', {maximumFractionDigits: 2});
const fdate = (v) => { if (!v) return '—'; const p = String(v).split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : esc(v); };
const numOrNull = (v) => { v = String(v == null ? '' : v).trim().replace(',', '.'); return v === '' ? null : Number(v); };
const DOC_TYPES = {
  carrier_order: 'Заявка перевозчику', client_order: 'Заявка клиенту', cmr: 'CMR',
  packing_list: 'Packing list', invoice: 'Счёт', customs_certificate: 'Довідка', act: 'Акт', other: 'Другое'
};

let trips = [], clients = [], carriers = [];

async function loadAll() {
  const [t, c, k] = await Promise.all([
    db.from('trips').select('*, clients(name), carriers(name)').order('loading_date', {ascending: false, nullsFirst: false}),
    db.from('clients').select('id, name').order('name'),
    db.from('carriers').select('id, name').order('name')
  ]);
  if (t.error) throw t.error;
  if (c.error) throw c.error;
  if (k.error) throw k.error;
  trips = t.data; clients = c.data; carriers = k.data;
}

const profit = (t) => (Number(t.income_eur) || 0) - (Number(t.cost_eur) || 0);
const taxOf = (t) => Number(t.tax_eur) || 0;
const net = (t) => profit(t) - taxOf(t);

function showError(msg) {
  const v = $('view');
  v.insertAdjacentHTML('afterbegin', '<div class="err">' + esc(msg) + '</div>');
}

function setNav(active) {
  $('nav-home').classList.toggle('active', active === 'home');
  $('nav-trips').classList.toggle('active', active === 'trips');
  $('nav-deals').classList.toggle('active', active === 'deals');
}

function tripStatus(t) {
  if (!t.clients) return '<span class="chip warn">Нужен клиент</span>';
  return '<span class="chip">Клиент указан</span>';
}

function tripsTable(rows) {
  if (!rows.length) return '<div class="pad muted">Рейсов нет</div>';
  return '<div class="scroll"><table><thead><tr>' +
    '<th>Загрузка</th><th>Выгрузка</th><th>Клиент</th><th>Город</th><th>Перевозчик</th><th class="r">Доход</th><th class="r">Расход</th><th class="r">Налог</th><th class="r">Чистая прибыль</th><th>Статус</th>' +
    '</tr></thead><tbody>' +
    rows.map((t) => {
      const p = net(t);
      return '<tr>' +
        '<td><a href="#/trip/' + esc(t.id) + '" style="font-weight:500">' + fdate(t.loading_date) + '</a></td>' +
        '<td>' + fdate(t.unloading_date) + '</td>' +
        '<td>' + (t.clients ? esc(t.clients.name) : '<span class="muted">не указан</span>') + '</td>' +
        '<td>' + esc(t.city || '—') + '</td>' +
        '<td>' + esc(t.carriers ? t.carriers.name : '—') + '</td>' +
        '<td class="r">' + eur(t.income_eur) + '</td>' +
        '<td class="r">' + eur(t.cost_eur) + '</td>' +
        '<td class="r">' + eur(t.tax_eur) + '</td>' +
        '<td class="r ' + (p >= 0 ? 'pos' : 'neg') + '">' + eur(p) + '</td>' +
        '<td>' + tripStatus(t) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

function renderDashboard() {
  setNav('home');
  const inc = trips.reduce((s, t) => s + (Number(t.income_eur) || 0), 0);
  const cost = trips.reduce((s, t) => s + (Number(t.cost_eur) || 0), 0);
  const tax = trips.reduce((s, t) => s + taxOf(t), 0);
  const pr = inc - cost - tax;
  const margin = inc > 0 ? (pr / inc * 100) : 0;
  const noClient = trips.filter((t) => !t.clients).length;
  $('view').innerHTML =
    '<div class="top"><div><h1>Дашборд</h1><div class="sub">Чистая прибыль: доход минус расход минус налог</div></div>' +
    '<button class="btn" id="newTripBtn" type="button">Новый рейс</button></div>' +
    '<div class="metrics">' +
      '<div class="metric"><div class="l">Доход</div><div class="v">' + eur(inc) + '</div></div>' +
      '<div class="metric"><div class="l">Налоги</div><div class="v">' + eur(tax) + '</div></div>' +
      '<div class="metric"><div class="l">Чистая прибыль</div><div class="v pos">' + eur(pr) + '</div></div>' +
      '<div class="metric"><div class="l">Маржа</div><div class="v">' + margin.toFixed(1).replace('.', ',') + '%</div></div>' +
      '<div class="metric"><div class="l">Рейсов</div><div class="v">' + trips.length + '</div></div>' +
    '</div>' +
    (noClient ? '<div class="card"><div class="row"><div><strong>У ' + noClient + ' рейсов не указан клиент.</strong><div class="sub">Откройте рейс и назначьте клиента, тогда он появится в отчётах по клиентам.</div></div><a class="btn ghost small" href="#/trips" style="text-decoration:none">Показать рейсы</a></div></div>' : '') +
    '<div class="card"><h3>Последние рейсы</h3>' + tripsTable(trips.slice(0, 8)) + '</div>';
  $('newTripBtn').onclick = openNewTrip;
}

function renderTrips() {
  setNav('trips');
  $('view').innerHTML =
    '<div class="top"><h1>Рейсы</h1><div style="display:flex;gap:12px;flex-wrap:wrap">' +
    '<input class="search" id="q" type="search" placeholder="Поиск: клиент, город, перевозчик" aria-label="Поиск">' +
    '<button class="btn" id="newTripBtn" type="button">Новый рейс</button></div></div>' +
    '<div class="card" id="tripsCard">' + tripsTable(trips) + '</div>';
  $('newTripBtn').onclick = openNewTrip;
  $('q').oninput = (e) => {
    const s = e.target.value.trim().toLowerCase();
    const rows = !s ? trips : trips.filter((t) =>
      [t.clients && t.clients.name, t.city, t.carriers && t.carriers.name, t.vehicle, t.invoice_number].join(' ').toLowerCase().includes(s));
    $('tripsCard').innerHTML = tripsTable(rows);
  };
}

async function renderTrip(id) {
  setNav('trips');
  const t = trips.find((x) => x.id === id);
  if (!t) { $('view').innerHTML = '<div class="err">Рейс не найден</div><a href="#/trips">К списку рейсов</a>'; return; }
  const dr = await db.from('documents').select('*').eq('trip_id', id).order('created_at');
  const docs = dr.error ? [] : dr.data;
  const p = profit(t);
  const legacy = t.legacy ? Object.entries(t.legacy).map(([k, v]) => esc(k) + ': ' + esc(v)).join('\n') : '';
  $('view').innerHTML =
    '<div><a href="#/trips" style="font-size:14px;text-decoration:none">← Все рейсы</a>' +
    '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:10px"><h1 style="margin:0;font-size:28px;letter-spacing:-.5px">Рейс ' + fdate(t.loading_date) + (t.clients ? ' · ' + esc(t.clients.name) : '') + '</h1>' + tripStatus(t) + '<button class="btn ghost small" id="editTripBtn" type="button">Редактировать</button></div></div>' +
    (dr.error ? '<div class="err">Документы не загрузились: ' + esc(dr.error.message) + '</div>' : '') +
    '<div class="cols"><div class="a">' +
      '<div class="card"><h3>Маршрут и груз</h3><div class="grid2">' +
        '<div class="kv"><div class="k">Загрузка</div><div class="val">' + esc(t.city || '—') + '<br>' + fdate(t.loading_date) + '</div></div>' +
        '<div class="kv"><div class="k">Выгрузка</div><div class="val">' + fdate(t.unloading_date) + '</div></div>' +
        '<div class="kv"><div class="k">Груз</div><div class="val">' + esc(t.cargo || '—') + '<br>' + (t.weight_kg != null ? Number(t.weight_kg).toLocaleString('ru-RU') + ' кг' : '') + (t.pallets != null ? ', ' + esc(t.pallets) + ' палет' : '') + '</div></div>' +
        '<div class="kv"><div class="k">Перевозчик и авто</div><div class="val">' + esc(t.carriers ? t.carriers.name : '—') + '<br>' + esc(t.vehicle || '') + '</div></div>' +
        '<div class="kv"><div class="k">Счёт</div><div class="val">' + esc(t.invoice_number || '—') + '</div></div>' +
      '</div>' +
      (legacy ? '<details><summary>Исходные данные из старой таблицы</summary><pre>' + legacy + '</pre></details>' : '') +
      '</div>' +
      '<div class="card"><h3>Документы</h3>' +
        (docs.length ? docs.map((d) => '<div class="row"><div><div style="font-weight:500">' + esc(d.title || DOC_TYPES[d.doc_type] || d.doc_type) + '</div><div class="sub">' + esc(DOC_TYPES[d.doc_type] || d.doc_type) + '</div></div>' +
          '<div style="display:flex;align-items:center;gap:16px">' + (d.drive_url ? '<a href="' + esc(d.drive_url) + '" target="_blank" rel="noopener noreferrer">Открыть</a>' : '') +
          '<button class="btn ghost small" type="button" data-deldoc="' + esc(d.id) + '">Удалить</button></div></div>').join('') : '<div class="pad muted">Документов пока нет</div>') +
        '<form id="docForm" class="pad" style="border-top:1px solid var(--line)"><div id="docErr" class="err hidden"></div>' +
          '<div class="f2"><div><label for="docType">Тип</label><select id="docType">' + Object.entries(DOC_TYPES).map(([k, v]) => '<option value="' + k + '">' + v + '</option>').join('') + '</select></div>' +
          '<div><label for="docTitle">Название</label><input id="docTitle" placeholder="Напр. CMR №456812"></div></div>' +
          '<div><label for="docUrl">Ссылка на файл в Google Drive</label><input id="docUrl" type="url" placeholder="https://drive.google.com/..." required></div>' +
          '<div><button class="btn small" type="submit">Добавить документ</button></div></form>' +
      '</div>' +
    '</div><div class="b">' +
      '<div class="card"><h3>Деньги</h3><div class="pad">' +
        '<div style="display:flex;justify-content:space-between"><span class="muted">Доход</span><span>' + eur(t.income_eur) + '</span></div>' +
        '<div style="display:flex;justify-content:space-between"><span class="muted">Расход</span><span>' + eur(t.cost_eur) + '</span></div>' +
        '<div style="display:flex;justify-content:space-between"><span class="muted">Налог</span><span>' + eur(t.tax_eur) + '</span></div>' +
        '<div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px"><span class="muted">Прибыль до налога</span><span>' + eur(p) + '</span></div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center"><strong>Чистая прибыль</strong><span class="' + (net(t) >= 0 ? 'pos' : 'neg') + '" style="font-size:22px">' + eur(net(t)) + '</span></div>' +
      '</div></div>' +
      '<div class="card"><h3>Клиент</h3><form id="clientForm" class="pad"><div id="clientErr" class="err hidden"></div>' +
        '<div><label for="clientName">Клиент этого рейса</label><input id="clientName" list="clientList" value="' + esc(t.clients ? t.clients.name : '') + '" placeholder="Название клиента"><datalist id="clientList">' + clients.map((c) => '<option value="' + esc(c.name) + '">').join('') + '</datalist></div>' +
        '<div><button class="btn small" type="submit">Сохранить клиента</button></div></form></div>' +
    '</div></div>';

  $('editTripBtn').onclick = () => openTripForm(t);
  $('clientForm').onsubmit = async (e) => {
    e.preventDefault();
    const box = $('clientErr'); box.classList.add('hidden');
    try {
      const cid = await findOrCreate('clients', $('clientName').value);
      const r = await db.from('trips').update({client_id: cid}).eq('id', id);
      if (r.error) throw r.error;
      await loadAll(); renderTrip(id);
    } catch (err) { box.textContent = 'Не удалось сохранить: ' + err.message; box.classList.remove('hidden'); }
  };
  $('docForm').onsubmit = async (e) => {
    e.preventDefault();
    const box = $('docErr'); box.classList.add('hidden');
    const url = $('docUrl').value.trim();
    if (!/^https:\/\//i.test(url)) { box.textContent = 'Ссылка должна начинаться с https://'; box.classList.remove('hidden'); return; }
    const r = await db.from('documents').insert({trip_id: id, doc_type: $('docType').value, title: $('docTitle').value.trim() || null, drive_url: url});
    if (r.error) { box.textContent = 'Не удалось добавить: ' + r.error.message; box.classList.remove('hidden'); return; }
    renderTrip(id);
  };
  document.querySelectorAll('[data-deldoc]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('Удалить этот документ из рейса? Файл в Google Drive останется.')) return;
      const r = await db.from('documents').delete().eq('id', b.getAttribute('data-deldoc'));
      if (r.error) { alert('Не удалось удалить: ' + r.error.message); return; }
      renderTrip(id);
    };
  });
}

async function findOrCreate(table, name) {
  name = String(name || '').trim();
  if (!name) return null;
  let r = await db.from(table).select('id').eq('name', name).maybeSingle();
  if (r.error) throw r.error;
  if (r.data) return r.data.id;
  r = await db.from(table).insert({name}).select('id').single();
  if (r.error) throw r.error;
  return r.data.id;
}

/* ===== Расчёты сделок ===== */
const DEAL_STATUS = {draft: 'Черновик', active: 'Сделка', done: 'Завершена'};
const BASIS = {fixed: 'Фиксированно', per_mark: 'За бутылку (марки)', per_sticker: 'За бутылку (стикеры)'};
const TAX_RATES = [0.18, 0.05];
const pct = (x) => (x == null || !isFinite(x)) ? '—' : (x * 100).toFixed(1).replace('.', ',') + '%';
const eurFine = (n) => (n == null || !isFinite(n)) ? '—' : '€' + Number(n).toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 4});

// Чистая функция расчёта: не трогает страницу и базу, только считает.
// deal: {qty_marks, qty_stickers, tax_rate, final_price}; lines: [{basis, cost_rate, sale_rate, unconfirmed}]
function calcDeal(deal, lines) {
  const num = (v) => { const x = Number(v); return (v == null || v === '' || !isFinite(x)) ? 0 : x; };
  const qtyMarks = num(deal.qty_marks), qtyStickers = num(deal.qty_stickers), taxRate = num(deal.tax_rate);
  const mult = (basis) => basis === 'per_mark' ? qtyMarks : basis === 'per_sticker' ? qtyStickers : 1;
  const list = lines || [];
  const rows = list.map((l) => {
    const m = mult(l.basis);
    const cost = num(l.cost_rate) * m, sale = num(l.sale_rate) * m;
    return {cost: cost, sale: sale, diff: sale - cost};
  });
  const cost = rows.reduce((s, r) => s + r.cost, 0);
  const calcPrice = rows.reduce((s, r) => s + r.sale, 0);
  const fp = deal.final_price;
  const billedPrice = (fp == null || fp === '' || !isFinite(Number(fp))) ? calcPrice : Number(fp);
  const sum = (price) => {
    const diff = price - cost;
    const tax = Math.max(0, diff) * taxRate;
    const profit = diff - tax;
    return {price: price, cost: cost, diff: diff, tax: tax, profit: profit,
      margin: price ? profit / price : null, perMark: qtyMarks ? price / qtyMarks : null};
  };
  return {rows: rows, calc: sum(calcPrice), billed: sum(billedPrice), unconfirmed: list.some((l) => !!l.unconfirmed)};
}

function dealStatusChip(st) {

}

async function createDeal(btn) {

    if (d.error) throw d.error;
    if (cat.data.length) {
      const ins = await db.from('deal_lines').insert(cat.data.map((c, i) => ({
        deal_id: d.data.id, name: c.name, basis: c.basis, cost_rate: c.cost_rate, sale_rate: c.sale_rate, sort: i})));

    }

let dealState = null;
let lineSeq = 0;

async function renderDeal(id, okMsg) {
  setNav('deals');
  $('view').innerHTML = '<div class="muted">Загружаю расчёт...</div>';
  const [d, l, c] = await Promise.all([
    db.from('deals').select('*, clients(name)').eq('id', id).maybeSingle(),
    db.from('deal_lines').select('*').eq('deal_id', id).order('sort'),
    db.from('service_catalog').select('*').order('sort').order('name')
  ]);
  if (location.hash !== '#/deal/' + id) return;
  const back = '<a href="#/deals" style="font-size:14px;text-decoration:none">← Все расчёты</a>';
  const e = d.error || l.error || c.error;
  if (e) { $('view').innerHTML = '<div>' + back + '</div><div class="err">Расчёт не загрузился: ' + esc(e.message) + '</div>'; return; }
  if (!d.data) { $('view').innerHTML = '<div>' + back + '</div><div class="err">Расчёт не найден</div>'; return; }
  dealState = {
    id: id,
    deal: Object.assign({}, d.data, {client_name: d.data.clients ? d.data.clients.name : ''}),
    lines: l.data.map((x) => Object.assign({}, x, {key: 'k' + (++lineSeq), dirty: false})),
    removed: [],
    catalog: c.data
  };
  drawDeal(okMsg);
}

function dealLineRow(l) {
  const rate = (f, label) => '<td><input class="num" data-f="' + f + '" inputmode="decimal" value="' + (l[f] == null ? '' : esc(l[f])) + '" placeholder="—" aria-label="' + label + '"></td>';
  return '<tr data-key="' + esc(l.key) + '">' +
    '<td><input data-f="name" value="' + esc(l.name) + '" placeholder="Название статьи" aria-label="Название статьи"></td>' +
    '<td><select data-f="basis" aria-label="Основа">' + Object.entries(BASIS).map(([k, v]) => '<option value="' + k + '"' + (l.basis === k ? ' selected' : '') + '>' + v + '</option>').join('') + '</select></td>' +
    rate('cost_rate', 'Ставка себестоимости') + rate('sale_rate', 'Ставка продажи') +
    '<td class="r" data-c="cost"></td><td class="r" data-c="sale"></td><td class="r" data-c="diff"></td>' +
    '<td><label class="chk"><input type="checkbox" data-f="unconfirmed"' + (l.unconfirmed ? ' checked' : '') + '> не подтверждено</label></td>' +
    '<td><button class="btn ghost small" type="button" data-del>Удалить</button></td></tr>';
}

function drawDeal(okMsg) {
  const s = dealState, d = s.deal;
  const taxOpts = TAX_RATES.slice();
  if (d.tax_rate != null && !taxOpts.includes(Number(d.tax_rate))) taxOpts.push(Number(d.tax_rate));
  const val = (v) => v == null ? '' : esc(v);
  $('view').innerHTML =
    '<div class="dealv" style="display:flex;flex-direction:column;gap:24px">' +
    '<div><a href="#/deals" style="font-size:14px;text-decoration:none">← Все расчёты</a>' +
      '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:10px"><h1 style="margin:0;font-size:28px;letter-spacing:-.5px">' + esc(d.title || 'Без названия') + '</h1>' + dealStatusChip(d.status) + '</div></div>' +
    '<div id="dealErr" class="err hidden"></div>' +
    (okMsg ? '<div class="okbox">' + esc(okMsg) + '</div>' : '') +
    '<div class="cols"><div class="a">' +
      '<div class="card"><h3>Объём и условия</h3><div class="pad">' +
        '<div><label for="dTitle">Название</label><input id="dTitle" value="' + val(d.title) + '"></div>' +
        '<div><label for="dClient">Клиент</label><input id="dClient" list="dClientList" value="' + val(d.client_name) + '" placeholder="Название клиента"><datalist id="dClientList">' + clients.map((c) => '<option value="' + esc(c.name) + '">').join('') + '</datalist></div>' +
        '<div class="f2"><div><label for="dMarks">Бутылок под акцизные марки</label><input id="dMarks" inputmode="numeric" value="' + val(d.qty_marks) + '"></div>' +
          '<div><label for="dStickers">Бутылок под стикеры</label><input id="dStickers" inputmode="numeric" value="' + val(d.qty_stickers) + '"></div></div>' +
        '<div class="f2"><div><label for="dPallets">Палет</label><input id="dPallets" inputmode="numeric" value="' + val(d.pallets) + '"></div>' +
          '<div><label for="dTax">Ставка налога</label><select id="dTax">' + taxOpts.map((t) => '<option value="' + t + '"' + (Number(d.tax_rate) === t ? ' selected' : '') + '>' + pct(t) + '</option>').join('') + '</select></div></div>' +
      '</div></div>' +
      '<div class="card"><h3>Статьи</h3><div class="scroll"><table class="lines"><thead><tr>' +
        '<th>Название</th><th>Основа</th><th class="r">Ставка себестоимости, €</th><th class="r">Ставка продажи, €</th><th class="r">Себестоимость</th><th class="r">Продажа</th><th class="r">Разница</th><th>Подтверждение</th><th></th>' +
        '</tr></thead><tbody id="dLines">' + s.lines.map(dealLineRow).join('') + '</tbody></table></div>' +
        '<div class="pad" style="border-top:1px solid var(--line)"><div class="f2"><div><label for="addLine">Добавить строку</label><select id="addLine"><option value="">Своя строка</option>' +
          s.catalog.map((c) => '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>').join('') + '</select></div>' +
          '<div style="align-self:end"><button class="btn small" id="addLineBtn" type="button">Добавить</button></div></div></div>' +
      '</div>' +
    '</div><div class="b">' +
      '<div class="card"><h3>Итог</h3><div id="dWarn"></div><div class="scroll"><table class="tot"><thead><tr><th></th><th class="r">По расчёту</th><th class="r">Выставлено</th></tr></thead><tbody id="dTot"></tbody></table></div>' +
        '<div class="pad" style="border-top:1px solid var(--line)"><div><label for="dFinal">Выставлено клиенту, €</label><input id="dFinal" inputmode="decimal" value="' + val(d.final_price) + '"></div>' +
        '<div class="sub">Если поле пустое, берётся цена по расчёту.</div></div></div>' +
      '<div class="acts" style="justify-content:flex-start"><button class="btn" id="dSave" type="button">Сохранить</button>' +
        (d.status === 'draft' ? '<button class="btn ghost" id="dActivate" type="button">Создать сделку</button>' : '') + '</div>' +
    '</div></div></div>';

  const bindNum = (elId, field) => { $(elId).oninput = (e) => { d[field] = numOrNull(e.target.value); updateDealCalc(); }; };
  $('dTitle').oninput = (e) => { d.title = e.target.value; };
  $('dClient').oninput = (e) => { d.client_name = e.target.value; };
  bindNum('dMarks', 'qty_marks'); bindNum('dStickers', 'qty_stickers'); bindNum('dPallets', 'pallets'); bindNum('dFinal', 'final_price');
  $('dTax').onchange = (e) => { d.tax_rate = Number(e.target.value); updateDealCalc(); };

  const onLine = (e) => {
    const tr = e.target.closest('tr[data-key]'); const f = e.target.getAttribute('data-f');
    if (!tr || !f) return;
    const l = s.lines.find((x) => x.key === tr.getAttribute('data-key'));
    if (!l) return;
    if (f === 'unconfirmed') l.unconfirmed = e.target.checked;
    else if (f === 'cost_rate' || f === 'sale_rate') l[f] = numOrNull(e.target.value);
    else l[f] = e.target.value;
    l.dirty = true;
    updateDealCalc();
  };
  $('dLines').addEventListener('input', onLine);
  $('dLines').addEventListener('change', onLine);
  $('dLines').addEventListener('click', (e) => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    const tr = b.closest('tr[data-key]');
    const i = s.lines.findIndex((x) => x.key === tr.getAttribute('data-key'));
    if (i < 0) return;
    if (s.lines[i].id) s.removed.push(s.lines[i].id);
    s.lines.splice(i, 1); tr.remove(); updateDealCalc();
  });
  $('addLineBtn').onclick = () => {
    const c = s.catalog.find((x) => x.id === $('addLine').value);
    const l = c ? {name: c.name, basis: c.basis, cost_rate: c.cost_rate, sale_rate: c.sale_rate}
                : {name: '', basis: 'fixed', cost_rate: null, sale_rate: null};
    l.unconfirmed = false; l.key = 'k' + (++lineSeq); l.dirty = true;
    s.lines.push(l);
    $('dLines').insertAdjacentHTML('beforeend', dealLineRow(l));
    updateDealCalc();
    if (!c) $('dLines').lastElementChild.querySelector('[data-f="name"]').focus();
  };
  $('dSave').onclick = () => saveDeal(false);
  if ($('dActivate')) $('dActivate').onclick = () => saveDeal(true);
  updateDealCalc();
}

function updateDealCalc() {
  const s = dealState, res = calcDeal(s.deal, s.lines);
  s.lines.forEach((l, i) => {
    const tr = document.querySelector('#dLines tr[data-key="' + l.key + '"]');
    if (!tr) return;
    const r = res.rows[i];
    tr.querySelector('[data-c="cost"]').textContent = l.cost_rate == null ? '—' : eur(r.cost);
    tr.querySelector('[data-c="sale"]').textContent = l.sale_rate == null ? '—' : eur(r.sale);
    const dc = tr.querySelector('[data-c="diff"]');
    dc.textContent = (l.cost_rate == null && l.sale_rate == null) ? '—' : eur(r.diff);
    dc.className = 'r ' + (r.diff >= 0 ? 'pos' : 'neg');
  });
  const a = res.calc, b = res.billed;
  const line = (label, f, fmt, cls) => '<tr><td' + (cls ? ' style="font-weight:600"' : '') + '>' + label + '</td>' +
    [a, b].map((x) => '<td class="r' + (cls ? ' ' + (x[f] >= 0 ? 'pos' : 'neg') : '') + '">' + fmt(x[f]) + '</td>').join('') + '</tr>';
  $('dTot').innerHTML =
    line('Цена', 'price', eur) + line('Себестоимость', 'cost', eur) + line('Разница', 'diff', eur) +
    line('Налог (' + pct(Number(s.deal.tax_rate) || 0) + ')', 'tax', eur) + line('Прибыль', 'profit', eur, true) +
    line('Маржа', 'margin', pct) + line('Цена за бутылку (марки)', 'perMark', eurFine);
  $('dWarn').innerHTML = res.unconfirmed ? '<div class="warnbox">Есть строки «не подтверждено»: итог может быть неполным.</div>' : '';
  $('dFinal').placeholder = 'Как по расчёту: ' + eur(a.price);
}

async function saveDeal(activate) {
  const s = dealState, d = s.deal, box = $('dealErr');
  box.classList.add('hidden');
  const fail = (m) => { box.textContent = m; box.classList.remove('hidden'); box.scrollIntoView({block: 'center'}); };
  const title = String(d.title || '').trim();
  if (!title) return fail('Укажите название расчёта.');
  for (const v of [d.qty_marks, d.qty_stickers, d.pallets]) {
    if (v != null && !(Number.isInteger(v) && v >= 0)) return fail('Количество бутылок и палет: только целые числа без минуса.');
  }
  if (d.final_price != null && Number.isNaN(d.final_price)) return fail('Проверьте поле «Выставлено клиенту»: только цифры.');
  for (const l of s.lines) {
    if (!String(l.name || '').trim()) return fail('У каждой строки должно быть название.');
    if ([l.cost_rate, l.sale_rate].some((x) => x != null && Number.isNaN(x))) return fail('Проверьте ставки в строке «' + l.name + '»: только цифры.');
  }
  const btns = [$('dSave'), $('dActivate')].filter(Boolean);
  btns.forEach((b) => { b.disabled = true; });
  $('dSave').textContent = 'Сохраняю...';
  try {
    const cid = await findOrCreate('clients', d.client_name);
    const row = {title: title, client_id: cid, qty_marks: d.qty_marks == null ? 0 : d.qty_marks,
      qty_stickers: d.qty_stickers == null ? 0 : d.qty_stickers, pallets: d.pallets,
      tax_rate: Number(d.tax_rate) || 0, final_price: d.final_price};
    if (activate) row.status = 'active';
    let r = await db.from('deals').update(row).eq('id', s.id);
    if (r.error) throw r.error;
    if (s.removed.length) {
      r = await db.from('deal_lines').delete().in('id', s.removed);
      if (r.error) throw r.error;
      s.removed = [];
    }
    const toDb = (l, i) => ({deal_id: s.id, name: String(l.name).trim(), basis: l.basis, cost_rate: l.cost_rate,
      sale_rate: l.sale_rate, unconfirmed: !!l.unconfirmed, sort: i});
    const upd = [], ins = [];
    s.lines.forEach((l, i) => {
      if (!l.id) ins.push(toDb(l, i));
      else if (l.dirty || l.sort !== i) upd.push(Object.assign({id: l.id}, toDb(l, i)));
    });
    if (upd.length) { r = await db.from('deal_lines').upsert(upd); if (r.error) throw r.error; }
    if (ins.length) { r = await db.from('deal_lines').insert(ins); if (r.error) throw r.error; }
    const cl = await db.from('clients').select('id, name').order('name');
    if (!cl.error) clients = cl.data;
    await renderDeal(s.id, activate ? 'Сделка создана и сохранена.' : 'Сохранено.');
  } catch (err) {
    fail('Не удалось сохранить: ' + err.message);
    btns.forEach((b) => { b.disabled = false; });
    $('dSave').textContent = 'Сохранить';
  }
}

function route() {
  const h = location.hash || '#/';
  if (h.startsWith('#/trip/')) return renderTrip(h.slice(7));
  if (h === '#/trips') return renderTrips();
  if (h.startsWith('#/deal/')) return renderDeal(h.slice(7));
  if (h === '#/deals') return renderDeals();
  return renderDashboard();
}

async function enterApp() {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('view').innerHTML = '<div class="muted">Загружаю данные...</div>';
  try { await loadAll(); route(); }
  catch (err) { $('view').innerHTML = '<div class="err">Не удалось загрузить данные: ' + esc(err.message) + '</div>'; }
}

function enterLogin() {
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
}

$('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const box = $('loginErr'); box.classList.add('hidden');
  const btn = $('loginBtn'); btn.disabled = true; btn.textContent = 'Входим...';
  const r = await db.auth.signInWithPassword({email: $('email').value.trim(), password: $('password').value});
  btn.disabled = false; btn.textContent = 'Войти';
  if (r.error) { box.textContent = 'Не удалось войти. Проверьте email и пароль.'; box.classList.remove('hidden'); return; }
  $('password').value = '';
  enterApp();
};

$('logoutBtn').onclick = async () => { await db.auth.signOut(); trips = []; clients = []; carriers = []; enterLogin(); };
window.addEventListener('hashchange', () => { if (!$('app').classList.contains('hidden') && trips.length + clients.length >= 0) route(); });

(async () => {
  const s = await db.auth.getSession();
  if (s.data.session) enterApp(); else enterLogin();
})();
</script>

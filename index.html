<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradeWay CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --navy:#1E3A5F; --ink:#14213D; --muted:#4A5568; --line:#DCE2EA; --bg:#F3F5F8; --card:#FFFFFF;
  --warnbg:#FFF4DC; --warn:#7A4B00; --okbg:#E4F4EC; --ok:#1B6B45; --field:#7B8798;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--navy)}
button{font-family:inherit}
.hidden{display:none!important}
/* login */
.login-wrap{min-height:100vh;display:flex;flex-wrap:wrap}
.login-left{flex:1 1 420px;background:var(--navy);color:#fff;padding:64px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.login-left h1{margin:0;font-size:40px;line-height:1.15;font-weight:600;letter-spacing:-.8px;max-width:460px}
.login-left p{margin:0;font-size:17px;line-height:1.5;color:#C9D6E8;max-width:460px}
.login-right{flex:1 1 420px;display:flex;align-items:center;justify-content:center;padding:48px}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:36px;display:flex;flex-direction:column;gap:18px}
.login-card h2{margin:0;font-size:24px;font-weight:600}
.brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:600}
.brand span{font-weight:400;color:#C9D6E8}
/* shell */
.shell{min-height:100vh;display:flex;flex-wrap:wrap}
.side{flex:0 0 220px;background:var(--card);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:24px}
.side .brand{color:var(--ink);font-size:16px;padding:0 8px}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav a{display:block;padding:10px 12px;font-size:14px;color:var(--ink);border-radius:8px;text-decoration:none}
.side nav a.active{background:#E6EDF6;color:var(--navy);font-weight:600}
.side .spacer{flex:1}
.main{flex:999 1 560px;min-width:0;padding:32px;display:flex;flex-direction:column;gap:24px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px}
.top h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.5px}
.sub{font-size:13px;color:var(--muted)}
.btn{padding:11px 18px;font-size:14px;font-weight:500;color:#fff;background:var(--navy);border:0;border-radius:8px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--field)}
.btn.small{padding:8px 12px;font-size:13px}
.dropz{display:flex;flex-direction:column;align-items:center;gap:4px;margin:16px 20px;padding:18px;border:2px dashed var(--line);border-radius:10px;cursor:pointer;text-align:center;font-size:14px}
.dropz.over{border-color:var(--navy);background:#EEF3F9}
.docrow{display:flex;align-items:center;gap:10px;padding:10px 20px;border-top:1px solid var(--line);font-size:14px}
.docrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docrow .dt{font-size:12px}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;padding:4px 6px;border-radius:6px}
.iconbtn:hover{background:var(--bg);color:var(--ink)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px}
.metric .l{font-size:13px;color:var(--muted)}
.metric .v{font-size:28px;font-weight:600;letter-spacing:-.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card h3{margin:0;padding:18px 20px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600}
.scroll{overflow-x:auto}
table{width:100%;min-width:860px;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-size:12px;font-weight:500;padding:12px 8px}
td{padding:14px 8px;border-top:1px solid var(--line)}
th:first-child,td:first-child{padding-left:20px}
th:last-child,td:last-child{padding-right:20px}
.r{text-align:right}
.pos{color:var(--ok);font-weight:600}
.neg{color:#9B1C1C;font-weight:600}
.chip{display:inline-block;font-size:12px;padding:4px 10px;border-radius:12px;background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding:20px}
.kv .k{font-size:12px;color:var(--muted);margin-bottom:4px}
.kv .val{font-size:14px;line-height:1.5;word-break:break-word}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.cols>.a{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px}
.cols>.b{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:24px}
.row{padding:16px 20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.row:first-of-type{border-top:0}
.pad{padding:20px;display:flex;flex-direction:column;gap:14px}
label{font-size:13px;font-weight:500;display:block;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 12px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff;border:1px solid var(--field);border-radius:8px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.err{background:#FCEBEB;color:#9B1C1C;border-radius:8px;padding:10px 14px;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(20,33,61,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:560px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:20px}
.modal.qi{max-width:760px}
.modal.qi textarea{font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.5}
.qit{width:100%;min-width:0;border-collapse:collapse;font-size:13px}
.qit td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.qit td:first-child{width:38%;color:var(--muted);padding-left:8px}
.qit td:last-child{padding-right:8px}
.qit tr.qibad td{background:#FCEBEB;color:#9B1C1C}
.qih{margin:6px 0 0;font-size:14px}
.miss{font-size:11px;color:var(--warn);margin-top:3px}
#dMissChip:empty{display:none}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
details{padding:0 20px 16px}
summary{cursor:pointer;font-size:13px;color:var(--muted);padding:6px 0}
pre{margin:8px 0 0;white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--bg);padding:12px;border-radius:8px}
.search{max-width:320px}
/* расчёты сделок */
.tbl-sm{min-width:560px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.okbox{background:var(--okbg);color:var(--ok);border-radius:8px;padding:8px 12px;font-size:13px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.4}
.dealv{display:flex;flex-direction:column;gap:14px}
.deal-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.deal-head h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.3px}
.deal-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.deal-left{display:flex;flex-direction:column;gap:14px;min-width:0}
.deal-side{position:sticky;top:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.deal-side #dWarn:empty{display:none}
.card h3.sm{padding:10px 14px;font-size:14px}
/* условия: одна компактная строка полей */
.dfields{display:flex;flex-wrap:wrap;gap:8px 10px;padding:12px 14px}
.dfields>div{flex:1 1 68px;min-width:0}
.dfields>.w{flex:2 1 120px}
.dfields>.dt{flex:1 1 130px}
.dfields>.w3{flex:3 1 200px}
.dfields>.st{flex:1 1 112px}
.dfields>.fx{flex:2 1 170px}
.dfields .hint{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.eq{display:block;font-size:11px;font-weight:400;color:var(--muted);white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.filters>div{flex:0 1 200px;min-width:140px}
.filters label{font-size:12px;color:var(--muted);margin-bottom:3px;display:block}
.filters select{padding:8px 10px;font-size:13px}
.filters .cnt{flex:1 1 auto;font-size:13px;padding-bottom:9px;text-align:right}
table.orders{min-width:860px}
table.orders tbody tr[data-href]{cursor:pointer}
table.orders tbody tr[data-href]:hover td{background:#F7F9FC}
.kind{display:inline-block;font-size:12px;padding:3px 9px;border-radius:12px;white-space:nowrap}
.k-trip{background:#EEF1F5;color:var(--muted)}
.k-deal{background:#E6EDF6;color:var(--navy);font-weight:500}
.toggle{display:flex;align-items:center;gap:8px;padding:0 14px 12px;font-size:13px;cursor:pointer;width:max-content}
.toggle input{width:auto}
.stsel{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.stsel label{margin:0;font-weight:400;color:var(--muted)}
.stsel select{width:auto;padding:7px 10px;font-size:13px}
.cpay{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px 14px}
.cpay label{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:3px}
.cpay input{padding:6px 8px;font-size:13px;border-radius:6px}
.qpay-h{font-size:12px;font-weight:600;color:var(--muted);padding:0 14px 4px}
.lines.qpay{min-width:0;margin-bottom:8px}
.lines.qpay tr.payrow td{border-bottom:0;padding:4px 14px 6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs a{padding:10px 14px;font-size:14px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.active{color:var(--navy);font-weight:600;border-bottom-color:var(--navy)}
.fin-sum .v{font-size:24px}
table.fin-t{table-layout:fixed;min-width:820px}
table.fin-t th:nth-child(1){width:26%}table.fin-t th:nth-child(2){width:14%}table.fin-t th:nth-child(3){width:10%}table.fin-t th:nth-child(4){width:11%}
table.fin-t th:nth-child(5),table.fin-t th:nth-child(6),table.fin-t th:nth-child(7){width:11%}table.fin-t th:nth-child(8){width:132px}
table.fin-in th:nth-child(2){width:11%}table.fin-in th:nth-child(3){width:12%}table.fin-in th:nth-child(4),table.fin-in th:nth-child(5),table.fin-in th:nth-child(6){width:12%}table.fin-in th:nth-child(7){width:150px}
.gsum{font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
tr.overdue td{background:#FDF2F2}
.k-out{background:#FDECEC;color:#9B1C1C}
.k-in{background:var(--okbg);color:var(--ok)}
.lines tr.payrow td{padding-top:0;padding-bottom:6px}
.lines tr.has-pay td{border-bottom:0}
.payf{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12px;color:var(--muted)}
.payf select{width:200px}
.payf input[data-f="invoice_no"]{width:120px}
.payf .pl{display:inline-flex;align-items:center;gap:5px;margin:0;font-size:12px;font-weight:400;color:var(--muted)}
.payf input[type=date]{width:auto}
.payf input.num{width:84px}
.nocar-hint{display:none;color:var(--warn);font-weight:500}
.lines tr.nocar td{background:var(--warnbg)}
.lines tr.nocar .nocar-hint{display:inline}
.lines select.csel{width:132px}
.lines{min-width:840px}
.paytbl{min-width:640px}
.paytbl input{padding:5px 7px;font-size:13px;border-radius:6px;border-color:var(--line)}
.paytbl input[data-g="invoice_no"]{width:110px}.paytbl input[type=date]{width:auto}.paytbl input.num{width:96px;text-align:right}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--navy);text-decoration:underline;cursor:pointer}
tr.total td{font-weight:600;border-top:2px solid var(--line)}
.period{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--field);border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:8px 12px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;border:0;border-left:1px solid var(--line);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:500}
.period .rng{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.period .rng input{width:auto;padding:7px 8px;font-size:13px}
.dfields label{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dfields input,.dfields select{padding:6px 8px;font-size:13px;border-radius:6px}
/* плотная таблица строк; прокручивается только она */
.lines-wrap{max-height:calc(100vh - 290px);min-height:200px;overflow:auto}
.lines{min-width:720px;font-size:13px}
.lines th{position:sticky;top:0;z-index:1;background:var(--card);padding:7px 5px;font-size:11px;box-shadow:inset 0 -1px 0 var(--line);line-height:1.25}
.lines td{padding:3px 5px;vertical-align:middle;border-top:0;border-bottom:1px solid var(--line)}
.lines th:first-child,.lines td:first-child{padding-left:12px}
.lines th:last-child,.lines td:last-child{padding-right:8px}
.lines td.r{white-space:nowrap}
.lines input,.lines select{padding:4px 6px;font-size:13px;border-radius:6px;border-color:var(--line)}
.lines input:focus,.lines select:focus{border-color:var(--field)}
.lines input[data-f="name"]{min-width:110px}
.lines select{width:128px}
.lines input.num{width:58px;text-align:right}
.lines input[type=checkbox]{width:16px;height:16px;margin:0;vertical-align:middle}
.lines .x,.tbl-sm .x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px}
.lines .x:hover,.tbl-sm .x:hover{background:var(--bg);color:#9B1C1C}
.addrow{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.addrow select{flex:1 1 auto;width:auto;min-width:0;padding:6px 8px;font-size:13px;border-radius:6px}
/* панель «Итог» */
.tot{min-width:0;font-size:13px}
.tot th,.tot td{white-space:nowrap;padding:6px 8px}
.tot th:first-child,.tot td:first-child{padding-left:14px;white-space:normal}
.tot th:last-child,.tot td:last-child{padding-right:14px}
.side-acts{display:flex;gap:8px;flex-wrap:wrap}
.side-acts .btn{flex:1 1 auto}
@media (max-width:900px){.deal-grid{grid-template-columns:minmax(0,1fr)}.deal-side{position:static}.lines-wrap{max-height:60vh}}
/* перевозчики · СБ */
.chip.bad{background:#FCEBEB;color:#9B1C1C}
.chip.info{background:#E6EDF6;color:var(--navy)}
.chip.gray{background:#EEF1F5;color:var(--muted)}
.badbox{background:#FCEBEB;color:#9B1C1C;border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.4}
.infobox{background:#E6EDF6;color:var(--navy);border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.4}
.alert{display:flex;align-items:flex-start;gap:14px;padding:12px 20px;border-top:1px solid var(--line);font-size:14px}
.alert:first-of-type{border-top:0}
.alert .chip{flex:0 0 auto;min-width:64px;text-align:center}
.alert .grow{flex:1 1 auto;min-width:0}
.vi{display:flex;gap:12px;align-items:flex-start;padding:10px 20px;border-top:1px solid var(--line);font-size:14px}
.vi .dot{flex:0 0 10px;height:10px;border-radius:50%;margin-top:5px;background:#A0AABA}
.dot.pass{background:var(--ok)!important}.dot.warn{background:#C27A00!important}.dot.fail{background:#9B1C1C!important}
.vi .src{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;padding-left:8px}
.lvlbox{border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:6px}
.lvlbox .n{font-size:28px;font-weight:600;letter-spacing:-.5px}
.lvl-base{background:var(--okbg);color:var(--ok)}.lvl-standard{background:#E6EDF6;color:var(--navy)}.lvl-enhanced{background:#FCEBEB;color:#9B1C1C}
.lvlbox .why{font-size:14px;line-height:1.5;color:var(--ink)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 20px;border-top:1px solid var(--line);cursor:pointer;font-weight:400;margin:0;font-size:14px}
.chk input{width:18px;height:18px;margin-top:2px;flex:0 0 auto}
.chk .grow{flex:1 1 auto}
textarea.json{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:200px}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.marks span{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--bg)}
.vetc{display:flex;flex-direction:column;gap:6px}
.vetc .who{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13px;font-weight:500}
.optrow{display:flex;flex-direction:column;gap:6px}
.optrow .l{font-size:13px;color:var(--muted)}
ul.plain{margin:4px 0 0;padding-left:18px;font-size:13px;line-height:1.5}
</style>
</head>
<body>

<div id="login" class="login-wrap hidden">
  <div class="login-left">
    <div class="brand">TradeWay <span>Solution</span></div>
    <div>
      <h1>Рейсы, документы и акциз в одном месте</h1>
      <p style="margin-top:20px">CRM для международного экспедитора. Рейс в центре: вокруг него клиент, перевозчик, деньги и документы.</p>
    </div>
    <div style="font-size:14px;color:#C9D6E8">Доступ только по логину</div>
  </div>
  <div class="login-right">
    <form id="loginForm" class="login-card">
      <h2>Вход</h2>
      <div id="loginErr" class="err hidden"></div>
      <div><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" id="loginBtn">Войти</button>
    </form>
  </div>
</div>

<div id="app" class="shell hidden">
  <aside class="side">
    <div class="brand">TradeWay</div>
    <nav>
      <a href="#/" id="nav-home">Дашборд</a>
      <a href="#/orders" id="nav-orders">Заказы</a>
      <a href="#/contractors" id="nav-carriers">Контрагенты</a>
      <a href="#/sb" id="nav-sb">Перевозчики · СБ</a>
      <a href="#/finance" id="nav-finance">Финансы</a>
    </nav>
    <div class="spacer"></div>
    <button class="btn ghost small" id="logoutBtn" type="button">Выйти</button>
  </aside>
  <main class="main" id="view"></main>
</div>

<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://imwfzjeewbfseexumard.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bz86mNhG0gcyqr67nFhq1Q_9FG6hhaz';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = (n) => (n == null || n === '') ? '—' : '€' + Number(n).toLocaleString('ru-RU', {maximumFractionDigits: 2});
const fdate = (v) => { if (!v) return '—'; const p = String(v).split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : esc(v); };
const numOrNull = (v) => { v = String(v == null ? '' : v).trim().replace(',', '.'); return v === '' ? null : Number(v); };
const DOC_TYPES = {
  carrier_order: 'Заявка перевозчику', client_order: 'Заявка клиенту', cmr: 'CMR',

// Валюта сделки. Суммы сделки хранятся в её валюте; в евро = сумма × fx_to_eur. Для EUR курс всегда 1.
const CUR_SIGN = {EUR: '€', USD: '$', UAH: '₴'};
// Гривна пишется после суммы и всегда с копейками: «72 300,00 ₴». Евро и доллар — знак перед суммой.
const CUR_AFTER = {UAH: true};
const FX_PLACEHOLDER = {USD: 'напр. 0,92', UAH: 'напр. 0,0225'};
const dealCur = (d) => (d && d.currency) || 'EUR';
function dealFx(d) {
  if (dealCur(d) === 'EUR') return 1;
  const x = Number(d.fx_to_eur);
  return (d.fx_to_eur != null && d.fx_to_eur !== '' && isFinite(x) && x > 0) ? x : 1;
}
const money = (n, cur, fine) => {
  if (n == null || n === '' || !isFinite(n)) return '—';
  if (CUR_AFTER[cur]) return Number(n).toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: fine ? 4 : 2}) + '\u00a0' + CUR_SIGN[cur];
  return (CUR_SIGN[cur] || (esc(cur) + ' ')) + Number(n).toLocaleString('ru-RU', fine ? {minimumFractionDigits: 2, maximumFractionDigits: 4} : {maximumFractionDigits: 2});
};
const curOption = (c, selected) => '<option value="' + esc(c) + '"' + (selected ? ' selected' : '') + '>' + esc(c) + (CUR_SIGN[c] ? ' (' + CUR_SIGN[c] + ')' : '') + '</option>';
// Поле «Курс к EUR» для не-евро валют (для EUR поле не показывается, курс сохраняется как 1).
function fxFieldHtml(id, cur, value) {
  if (cur === 'EUR') return '';
  const hint = 'Сколько EUR за 1 ' + esc(cur) + ', курс НБУ на дату загрузки';
  return '<div class="fx"><label for="' + id + '" title="' + hint + '">Курс к EUR</label>' +
    '<input id="' + id + '" inputmode="decimal" value="' + (value == null ? '' : esc(value)) + '" placeholder="' + (FX_PLACEHOLDER[cur] || 'курс') + '" title="' + hint + '" aria-describedby="' + id + 'Hint">' +
    '<div class="hint" id="' + id + 'Hint">' + hint + '</div></div>';
}
// Сумма в валюте сделки, а для не-EUR рядом мелко эквивалент в евро.
function moneyEq(n, d) {
  const cur = dealCur(d);
  if (cur === 'EUR' || n == null || !isFinite(n)) return money(n, cur);
  return money(n, cur) + ' <span class="eq">≈ ' + money(n * dealFx(d), 'EUR') + '</span>';
}

// Период дашборда (по дате загрузки). range = null — «Всё время»; иначе {from, to} в виде 'ГГГГ-ММ-ДД', любая граница может быть пустой.
// Запись без даты попадает только во «Всё время».
const iso = (dt) => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
function periodRange(p, today) {
  const t = today || new Date();
  if (p.mode === 'month') return {from: iso(new Date(t.getFullYear(), t.getMonth(), 1)), to: iso(new Date(t.getFullYear(), t.getMonth() + 1, 0))};
  if (p.mode === 'year') return {from: t.getFullYear() + '-01-01', to: t.getFullYear() + '-12-31'};
  if (p.mode === 'custom') return {from: p.from || null, to: p.to || null};
  return null;
}
function inRange(date, range) {
  if (!range) return true;
  if (!date) return false;
  const d = String(date).slice(0, 10);
  return !(range.from && d < range.from) && !(range.to && d > range.to);
}

// Чистая функция итогов дашборда: рейсы + сделки (active/done), без обращения к странице и базе.
// Рейс с deal_id, чья сделка учтена, в сумму не идёт: его объём уже посчитан в сделке (по дате сделки).
function dashboardTotals(tripRows, dealRows, range) {
  const allCounted = (dealRows || []).filter((d) => d.status === 'active' || d.status === 'done');
  const countedIds = new Set(allCounted.map((d) => d.id));
  const counted = allCounted.filter((d) => inRange(d.start_date, range));
  const periodTrips = (tripRows || []).filter((t) => inRange(t.loading_date, range));
  const groups = new Map();
  const tot = {income: 0, cost: 0, tax: 0};
  const add = (clientId, clientName, income, cost, tax) => {
    tot.income += income; tot.cost += cost; tot.tax += tax;
    const key = clientId || '';
    if (!groups.has(key)) groups.set(key, {name: clientId ? (clientName || 'Без названия') : 'Без клиента', noClient: !clientId, income: 0, cost: 0, tax: 0});
    const g = groups.get(key);
    g.income += income; g.cost += cost; g.tax += tax;
  };
  let tripsUsed = 0;
  periodTrips.forEach((t) => {
    if (t.deal_id && countedIds.has(t.deal_id)) return;
    tripsUsed++;
    add(t.client_id, t.clients && t.clients.name, Number(t.income_eur) || 0, Number(t.cost_eur) || 0, Number(t.tax_eur) || 0);
  });
  counted.forEach((d) => {
    const b = calcDeal(d, d.deal_lines).billed, fx = dealFx(d);
    add(d.client_id, d.clients && d.clients.name, b.price * fx, b.cost * fx, b.tax * fx);
  });
  const fin = (x) => Object.assign(x, {profit: x.income - x.cost - x.tax, margin: x.income ? (x.income - x.cost - x.tax) / x.income : null});
  const byClient = Array.from(groups.values()).map(fin).sort((a, b) => b.profit - a.profit);
  return Object.assign(fin(tot), {dealsCount: counted.length, tripsCount: periodTrips.length, tripsUsed: tripsUsed, byClient: byClient});
}

const profit = (t) => (Number(t.income_eur) || 0) - (Number(t.cost_eur) || 0);
const taxOf = (t) => Number(t.tax_eur) || 0;
const net = (t) => profit(t) - taxOf(t);

// Один блок для рейса и для заказа с расчётом. Файлы лежат на Диске: TradeWay Docs / Клиент / Папка заказа.
let docsCfg = null;
async function docsConfig() {
  if (docsCfg) return docsCfg;
  const r = await db.from('app_settings').select('key, value').in('key', ['docs_upload_url', 'docs_upload_secret']);
  if (r.error) throw new Error('настройки загрузки не найдены (' + r.error.message + ')');
  const m = Object.fromEntries((r.data || []).map((x) => [x.key, x.value]));
  if (!m.docs_upload_url || !m.docs_upload_secret) throw new Error('загрузка на Диск ещё не настроена');
  docsCfg = {url: m.docs_upload_url, secret: m.docs_upload_secret};
  return docsCfg;
}
async function docsCall(payload) {
  const c = await docsConfig();
  const res = await fetch(c.url, {method: 'POST', body: JSON.stringify(Object.assign({secret: c.secret}, payload))});
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'ошибка Диска');
  return j;
}
const fileToB64 = (file) => new Promise((ok, bad) => {
  const fr = new FileReader();
  fr.onload = () => ok(String(fr.result).split(',')[1]);
  fr.onerror = () => bad(new Error('не удалось прочитать файл'));
  fr.readAsDataURL(file);
});
const docIcon = (n) => /\.(jpe?g|png|heic|webp)$/i.test(n || '') ? '🖼' : '📄';

// Если файл переименовали на Диске (вручную или по просьбе Claude), берём новое имя в CRM.
// Тихо, в фоне: если загрузчик старый или Диск недоступен, просто ничего не меняется.
async function syncDocNames(docs) {
  const withId = (docs || []).filter((d) => d.drive_file_id);
  if (!withId.length) return false;
  let names;
  try { names = (await docsCall({action: 'names', ids: withId.map((d) => d.drive_file_id)})).names || {}; } catch (e) { return false; }
  let changed = false;
  for (const d of withId) {
    const n = names[d.drive_file_id];
    if (n && n !== d.title) {
      const u = await db.from('documents').update({title: n}).eq('id', d.id);
      if (!u.error) changed = true;
    }
  }
  return changed;
}

// link: {trip_id} или {deal_id}; folder: {client, name}
// synced = true: названия с Диска уже сверены в этот раз, второй раз не спрашиваем.
async function mountDocs(boxId, link, folder, synced) {
  const box = $(boxId); if (!box) return;
  const key = link.trip_id ? 'trip_id' : 'deal_id', val = link.trip_id || link.deal_id;
  const r = await db.from('documents').select('*').eq(key, val).order('created_at');
  const docs = r.error ? [] : r.data;
  box.innerHTML =
    (r.error ? '<div class="err">Документы не загрузились: ' + esc(r.error.message) + '</div>' : '') +
    '<label class="dropz" id="' + boxId + 'Drop"><input type="file" multiple id="' + boxId + 'File" class="sr">' +
      '<span>Перетащи файлы сюда или <u>выбери</u></span><span class="muted" id="' + boxId + 'Msg" role="status"></span></label>' +
    (docs.length ? docs.map((d) => {
      const name = d.title || DOC_TYPES[d.doc_type] || 'Документ';
      return '<div class="docrow" data-id="' + esc(d.id) + '"><span class="ic">' + docIcon(name) + '</span>' +
        '<span class="nm">' + (d.drive_url ? '<a href="' + esc(d.drive_url) + '" target="_blank" rel="noopener noreferrer">' + esc(name) + '</a>' : esc(name)) + '</span>' +
        '<span class="muted dt">' + fdate(String(d.created_at || '').slice(0, 10)) + '</span>' +
        '<button type="button" class="iconbtn" data-ren title="Переименовать">✎</button>' +
        '<button type="button" class="iconbtn" data-del title="Убрать">✕</button></div>';
    }).join('') : '<div class="pad muted">Документов пока нет</div>');

  const msg = $(boxId + 'Msg');
  const reload = () => mountDocs(boxId, link, folder, true);
  if (!synced) syncDocNames(docs).then((changed) => { if (changed) reload(); });
  const upload = async (files) => {
    files = Array.from(files || []); if (!files.length) return;
    let done = 0, fails = [];
    for (const f of files) {
      msg.textContent = 'Загружаю ' + (done + 1) + ' из ' + files.length + '...';
      try {
        if (f.size > 30 * 1024 * 1024) throw new Error('больше 30 МБ');
        const j = await docsCall({action: 'upload', client: folder.client, folder: folder.name, name: f.name, mime: f.type, data: await fileToB64(f)});
        const ins = await db.from('documents').insert(Object.assign({doc_type: 'other', title: j.name, drive_url: j.url, drive_file_id: j.id}, link));
        if (ins.error) {
          // Запись в базе не сохранилась — убираем файл с Диска в «_удалённые», чтобы не было файла без записи.
          try { await docsCall({action: 'trash', id: j.id}); } catch (e2) { /* файл останется в папке заказа */ }
          throw ins.error;
        }
        done++;
      } catch (e) { fails.push(f.name + ': ' + e.message); }
    }
    if (fails.length) alert('Не загрузилось:\n' + fails.join('\n'));
    reload();
  };
  $(boxId + 'File').onchange = (e) => upload(e.target.files);
  const drop = $(boxId + 'Drop');
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); upload(e.dataTransfer.files); };

  box.querySelectorAll('.docrow').forEach((row) => {
    const d = docs.find((x) => x.id === row.getAttribute('data-id'));
    row.querySelector('[data-ren]').onclick = async () => {
      const cur = d.title || '';
      const name = prompt('Новое название', cur);
      if (!name || name.trim() === cur) return;
      try {
        let title = name.trim();
        if (d.drive_file_id) {
          const ext = (cur.match(/\.[a-z0-9]{2,5}$/i) || [''])[0];
          if (ext && !/\.[a-z0-9]{2,5}$/i.test(title)) title += ext;
          title = (await docsCall({action: 'rename', id: d.drive_file_id, name: title})).name;
        }
        const u = await db.from('documents').update({title}).eq('id', d.id);
        if (u.error) throw u.error;
        reload();
      } catch (e) { alert('Не удалось переименовать: ' + e.message); }
    };
    row.querySelector('[data-del]').onclick = async () => {
      if (!confirm('Убрать «' + (d.title || 'документ') + '» из рейса?' + (d.drive_file_id ? ' Файл переедет на Диске в папку «_удалённые».' : ' Файл на Диске останется.'))) return;
      try {
        if (d.drive_file_id) await docsCall({action: 'trash', id: d.drive_file_id});
        const x = await db.from('documents').delete().eq('id', d.id);
        if (x.error) throw x.error;
        reload();
      } catch (e) { alert('Не удалось убрать: ' + e.message); }
    };
  });
}

async function findOrCreate(table, name) {
  name = String(name || '').trim();
  if (!name) return null;
  let r = await db.from(table).select('id').eq('name', name).maybeSingle();
  if (r.error) throw r.error;
  if (r.data) return r.data.id;
  r = await db.from(table).insert({name}).select('id').single();
  if (r.error) throw r.error;
  return r.data.id;
}

/* ===== Расчёты сделок ===== */
// Единые статусы всех заказов (и рейсов, и сделок). Черновик в итоги не идёт.
const DEAL_STATUS = {draft: 'Черновик', active: 'Активный', done: 'Завершён'};
const BASIS = {fixed: 'Фиксированно', per_mark: 'За бутылку (марки)', per_sticker: 'За бутылку (стикеры)'};
const TAX_RATES = [0.18, 0.05];
const COMPANIES = ['ТОВ TradeWay', 'ФОП Эльнур'];
const pct = (x) => (x == null || !isFinite(x)) ? '—' : (x * 100).toFixed(1).replace('.', ',') + '%';
const eurFine = (n) => (n == null || !isFinite(n)) ? '—' : '€' + Number(n).toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 4});

// Чистая функция расчёта: не трогает страницу и базу, только считает.
// deal: {qty_marks, qty_stickers, tax_rate, final_price}; lines: [{basis, cost_rate, sale_rate, unconfirmed}]
function calcDeal(deal, lines) {
  const num = (v) => { const x = Number(v); return (v == null || v === '' || !isFinite(x)) ? 0 : x; };
  const qtyMarks = num(deal.qty_marks), qtyStickers = num(deal.qty_stickers), taxRate = num(deal.tax_rate);
  const mult = (basis) => basis === 'per_mark' ? qtyMarks : basis === 'per_sticker' ? qtyStickers : 1;
  const list = lines || [];
  const rows = list.map((l) => {
    const m = mult(l.basis);
    const cost = num(l.cost_rate) * m, sale = num(l.sale_rate) * m;
    return {cost: cost, sale: sale, diff: sale - cost};
  });
  const cost = rows.reduce((s, r) => s + r.cost, 0);
  const calcPrice = rows.reduce((s, r) => s + r.sale, 0);
  const fp = deal.final_price;
  const billedPrice = (fp == null || fp === '' || !isFinite(Number(fp))) ? calcPrice : Number(fp);
  const sum = (price) => {
    const diff = price - cost;
    const tax = Math.max(0, diff) * taxRate;
    const profit = diff - tax;
    return {price: price, cost: cost, diff: diff, tax: tax, profit: profit,
      margin: price ? profit / price : null, perMark: qtyMarks ? price / qtyMarks : null};
  };
  return {rows: rows, calc: sum(calcPrice), billed: sum(billedPrice), unconfirmed: list.some((l) => !!l.unconfirmed)};
}

function dealStatusChip(st) {
  return '<span class="chip' + (st === 'draft' ? ' warn' : '') + '">' + esc(DEAL_STATUS[st] || st) + '</span>';
}

// Новые загрузки сверху; расчёты без даты в конце, среди них новее созданные выше.
function sortDealsByStart(rows) {
  return (rows || []).slice().sort((a, b) => {
    const da = a.start_date ? String(a.start_date).slice(0, 10) : '', dbb = b.start_date ? String(b.start_date).slice(0, 10) : '';
    if (da !== dbb) { if (!da) return 1; if (!dbb) return -1; return da < dbb ? 1 : -1; }
    const ca = String(a.created_at || ''), cb = String(b.created_at || '');
    return ca === cb ? 0 : (ca < cb ? 1 : -1);
  });
}

  const bindNum = (elId, field) => { $(elId).oninput = (e) => { d[field] = numOrNull(e.target.value); updateDealCalc(); }; };
  $('dTitle').oninput = (e) => { d.title = e.target.value; };
  $('dClient').oninput = (e) => { d.client_name = e.target.value; };
  bindNum('dMarks', 'qty_marks'); bindNum('dStickers', 'qty_stickers'); bindNum('dPallets', 'pallets'); bindNum('dFinal', 'final_price');
  $('dTax').onchange = (e) => { d.tax_rate = Number(e.target.value); updateDealCalc(); };
  $('dStart').onchange = (e) => { d.start_date = e.target.value || null; };
  $('dEnd').onchange = (e) => { d.end_date = e.target.value || null; };
  $('dCompany').onchange = (e) => { d.company = e.target.value || null; };
  $('dCur').onchange = (e) => { d.currency = e.target.value; drawDeal(); };
  if ($('dFx')) bindNum('dFx', 'fx_to_eur');
  bindNum('dInv', 'client_invoice_amount');
  $('dDue').onchange = (e) => { d.client_due_date = e.target.value || null; };
  $('dOrd').oninput = (e) => { d.notes = setNotesOrderNo(d.notes, e.target.value); $('dNotes').value = d.notes; };
  $('dNotes').oninput = (e) => { d.notes = e.target.value; $('dOrd').value = qiNotesOrderNo(d.notes) || ''; };
  // Пометка «Неполные данные» обновляется сразу при вводе в любое поле карточки.
  $('view').querySelector('.dealv').addEventListener('input', paintDealMiss);
  $('view').querySelector('.dealv').addEventListener('change', paintDealMiss);
  if (vetReady) {
    $('dExcise').onchange = (e) => { d.cargo_excise = e.target.value === '1'; updateDealCalc(); };
    bindNum('dCargoVal', 'cargo_value_eur');
  }

  const onLine = (e) => { if (lineInput(e, s.lines, () => drawDeal())) updateDealCalc(); };
  const onPay = (e) => { if (payGroupEdit(e, s.lines, () => calcDeal(s.deal, s.lines).rows)) updateDealCalc(); };
  $('dPay').addEventListener('input', onPay);
  $('dPay').addEventListener('change', onPay);
  $('dLines').addEventListener('input', onLine);
  $('dLines').addEventListener('change', onLine);
  $('dLines').addEventListener('click', (e) => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    const tr = b.closest('tr[data-key]');
    const i = s.lines.findIndex((x) => x.key === tr.getAttribute('data-key'));
    if (i < 0) return;
    if (s.lines[i].id) s.removed.push(s.lines[i].id);
    s.lines.splice(i, 1); removeLineRows($('dLines'), tr.getAttribute('data-key')); updateDealCalc();
  });
  $('addLineBtn').onclick = () => {
    const c = s.catalog.find((x) => x.id === $('addLine').value);
    const l = c ? {name: c.name, basis: c.basis, cost_rate: c.cost_rate, sale_rate: c.sale_rate, carrier_id: c.carrier_id || null}
                : {name: '', basis: 'fixed', cost_rate: null, sale_rate: null};
    l.unconfirmed = false; l.key = 'k' + (++lineSeq); l.dirty = true;
    s.lines.push(l); joinPayGroup(s.lines, l);
    $('dLines').insertAdjacentHTML('beforeend', dealLineRow(l));
    updateDealCalc();
    if (!c) $('dLines').querySelector('tr[data-key="' + l.key + '"] [data-f="name"]').focus();
  };
  $('dSave').onclick = () => saveDeal(false);
  $('dStatus').onchange = (e) => { d.status = e.target.value; };
  updateDealCalc();
  paintDealMiss();
  // Документы — в самом конце: даже если с ними что-то не так, остальная карточка уже работает.
  mountDocs('dDocs', {deal_id: s.id}, {client: d.client_name, name: ((d.start_date || '') + ' ' + (d.title || '')).trim()});
}

function paintDealMiss() {
  const s = dealState;
  if (!s || !$('dMiss')) return;
  const list = missOf(s.deal, s.lines);
  $('dMissChip').innerHTML = missChip(list);
  $('dMiss').innerHTML = list.length ? '<div class="warnbox"><strong>Неполные данные.</strong> Не заполнено: ' + esc(list.join(', ')) + '. Дозаполните и нажмите «Сохранить».</div>' : '';
}

function updateDealCalc() {
  const s = dealState, res = calcDeal(s.deal, s.lines), cur = dealCur(s.deal);
  const m = (n) => money(n, cur), mFine = (n) => money(n, cur, true);
  s.lines.forEach((l, i) => {
    const tr = document.querySelector('#dLines tr[data-key="' + l.key + '"]');
    if (!tr) return;
    const r = res.rows[i];
    tr.querySelector('[data-c="cost"]').textContent = l.cost_rate == null ? '—' : m(r.cost);
    tr.querySelector('[data-c="sale"]').textContent = l.sale_rate == null ? '—' : m(r.sale);
    const dc = tr.querySelector('[data-c="diff"]');
    dc.textContent = (l.cost_rate == null && l.sale_rate == null) ? '—' : m(r.diff);
    dc.className = 'r ' + (r.diff >= 0 ? 'pos' : 'neg');
  });
  const a = res.calc, b = res.billed;
  const line = (label, f, fmt, cls) => '<tr><td' + (cls ? ' style="font-weight:600"' : '') + '>' + label + '</td>' +
    [a, b].map((x) => '<td class="r' + (cls ? ' ' + (x[f] >= 0 ? 'pos' : 'neg') : '') + '">' + fmt(x[f]) + '</td>').join('') + '</tr>';
  const mEq = (n) => moneyEq(n, s.deal);
  $('dTot').innerHTML =
    line('Цена', 'price', mEq) + line('Себестоимость', 'cost', mEq) + line('Разница', 'diff', mEq) +
    line('Налог (' + pct(Number(s.deal.tax_rate) || 0) + ')', 'tax', mEq) + line('Прибыль', 'profit', mEq, true) +
    line('Маржа', 'margin', pct) + line('Цена за бутылку (марки)', 'perMark', mFine);
  const fxNum = Number(s.deal.fx_to_eur);
  $('dWarn').innerHTML = (res.unconfirmed ? '<div class="warnbox">Есть строки «не подтверждено»: итог может быть неполным.</div>' : '') +
    (cur !== 'EUR' && fxNum === 1 ? '<div class="warnbox">Курс к евро равен 1. Проверьте, что он указан верно.</div>' : '');
  $('dVet').innerHTML = vetBoxHtml(s.lines.map((l) => l.carrier_id), !!s.deal.cargo_excise, s.deal.cargo_value_eur);
  $('dFinal').placeholder = m(a.price);
  $('dInv').placeholder = String(Math.round(b.price * 100) / 100).replace('.', ',');
  paintLinePay('dLines', s.lines, res.rows);
  updatePayGroups('dPay', s.lines, res.rows, cur);
}

async function saveDeal(activate) {
  const s = dealState, d = s.deal, box = $('dealErr');
  box.classList.add('hidden');
  const fail = (m) => { box.textContent = m; box.classList.remove('hidden'); box.scrollIntoView({block: 'center'}); };
  const title = String(d.title || '').trim();
  if (!title) return fail('Укажите название расчёта.');
  for (const v of [d.qty_marks, d.qty_stickers, d.pallets]) {
    if (v != null && !(Number.isInteger(v) && v >= 0)) return fail('Количество бутылок и палет: только целые числа без минуса.');
  }
  if (d.final_price != null && Number.isNaN(d.final_price)) return fail('Проверьте поле «Выставлено клиенту»: только цифры.');
  if (dealCur(d) !== 'EUR' && !(d.fx_to_eur != null && d.fx_to_eur !== '' && isFinite(Number(d.fx_to_eur)) && Number(d.fx_to_eur) > 0)) return fail('Укажите курс к евро: число больше нуля, например 0,92.');
  if (d.start_date && d.end_date && d.end_date < d.start_date) return fail('Дата выгрузки на складе раньше даты загрузки. Проверьте даты.');
  if (d.client_invoice_amount != null && Number.isNaN(d.client_invoice_amount)) return fail('Проверьте поле «Выставлено клиенту»: только цифры.');
  for (const l of s.lines) {
    if (!String(l.name || '').trim()) return fail('У каждой строки должно быть название.');
    if (lineBad(l)) return fail('Проверьте суммы в строке «' + l.name + '»: только цифры.');
  }
  if (d.cargo_value_eur != null && Number.isNaN(d.cargo_value_eur)) return fail('Проверьте поле «Стоимость груза»: только цифры.');
  const blocked = newlyBlocked(s.lines.map((l) => l.carrier_id), s.savedCarriers);
  const reason = blocked.length ? await askOverrideReason(blocked) : null;
  if (blocked.length && !reason) return;
  const btns = [$('dSave'), $('dActivate')].filter(Boolean);
  btns.forEach((b) => { b.disabled = true; });
  $('dSave').textContent = 'Сохраняю...';
  try {
    const cid = await findOrCreate('clients', d.client_name);
    const row = {title: title, client_id: cid, qty_marks: d.qty_marks == null ? 0 : d.qty_marks,
      qty_stickers: d.qty_stickers == null ? 0 : d.qty_stickers, pallets: d.pallets,
      tax_rate: Number(d.tax_rate) || 0, final_price: d.final_price,
      start_date: d.start_date || null, end_date: d.end_date || null, company: d.company || null,
      currency: dealCur(d), fx_to_eur: dealCur(d) === 'EUR' ? 1 : Number(d.fx_to_eur),
      client_invoice_amount: d.client_invoice_amount == null ? null : d.client_invoice_amount, client_due_date: d.client_due_date || null,
      // Заметки; пометку «Дозаполнить» пересчитываем: заполненное убираем, валюту считаем подтверждённой при сохранении.
      notes: setMissMark(d.notes, missOf(d, s.lines).filter((l) => l !== 'Валюта')) || null};
    row.status = activate ? 'active' : normStatus(d.status);
    if (vetReady) Object.assign(row, {cargo_excise: !!d.cargo_excise, cargo_value_eur: d.cargo_value_eur == null ? null : d.cargo_value_eur});
    let r = await db.from('deals').update(row).eq('id', s.id);
    if (r.error) throw r.error;
    if (s.removed.length) {
      r = await db.from('deal_lines').delete().in('id', s.removed);
      if (r.error) throw r.error;
      s.removed = [];
    }
    const toDb = (l, i) => ({deal_id: s.id, name: String(l.name).trim(), basis: l.basis, cost_rate: l.cost_rate,
      sale_rate: l.sale_rate, unconfirmed: !!l.unconfirmed, sort: i,
      carrier_id: l.carrier_id || null, invoice_no: String(l.invoice_no || '').trim() || null, due_date: l.due_date || null,
      payable_amount: l.payable_amount == null ? null : l.payable_amount});
    const upd = [], ins = [];
    s.lines.forEach((l, i) => {
      if (!l.id) ins.push(toDb(l, i));
      else if (l.dirty || l.sort !== i) upd.push(Object.assign({id: l.id}, toDb(l, i)));
    });
    if (upd.length) { r = await db.from('deal_lines').upsert(upd); if (r.error) throw r.error; }
    if (ins.length) { r = await db.from('deal_lines').insert(ins); if (r.error) throw r.error; }
    await logOverrides(blocked, {deal_id: s.id}, reason);
    const cl = await db.from('clients').select('id, name').order('name');
    if (!cl.error) clients = cl.data;
    const justDone = row.status === 'done' && s.origStatus !== 'done', ids = s.lines.map((l) => l.carrier_id);
    await renderDeal(s.id, 'Сохранено. Статус: ' + DEAL_STATUS[row.status] + '.');
    if (justDone) offerRatings('deal', s.id, title, ids);
  } catch (err) {
    fail('Не удалось сохранить: ' + err.message);
    btns.forEach((b) => { b.disabled = false; });
    $('dSave').textContent = 'Сохранить';
  }
}

/* ===== Заказы: общий список рейсов и сделок из представления orders (все суммы там уже в евро) ===== */
const ORDER_KIND = {trip: 'Рейс', deal: 'С расчётом'};
const ORDER_STATUS = DEAL_STATUS;
const ORDER_COUNTED = ['active', 'done'];   // черновики в итоги не идут
// Статус рейса хранится в самом рейсе (trips.status). Всё, что не draft/active/done
// (старые «Импорт», пустые и прочие значения из старой таблицы), считается «Завершён».
const normStatus = (st) => DEAL_STATUS[st] ? st : 'done';
function normalizeOrders(rows, tripRows) {
  const tripSt = new Map((tripRows || []).map((t) => [t.id, t.status]));
  return (rows || []).map((o) => Object.assign({}, o, {status: o.kind === 'trip' ? normStatus(tripSt.get(o.id)) : normStatus(o.status)}));
}
const NEW_ORDER_TAX = 0.18;
const NEW_ORDER_COMPANY = COMPANIES[0];

let orders = [], ordersErr = null, ordersLoadedAt = 0, ordersOkMsg = '';
let ordersFilter = {mode: 'all', from: '', to: '', client: '', kind: '', status: ''};

let ordersMissing = new Map();   // id заказа → что не заполнено (только заказы из быстрого ввода с пометкой)
async function loadOrders() {
  const [r, mr] = await Promise.all([db.from('orders').select('*'),
    db.from('deals').select('id, title, client_id, start_date, end_date, currency, fx_to_eur, final_price, client_invoice_amount, client_due_date, notes, deal_lines(carrier_id, cost_rate, payable_amount, due_date)').ilike('notes', '%' + MISS_MARK + '%')]);
  ordersMissing = new Map();
  if (!mr.error) (mr.data || []).forEach((d) => { const m = missOf(d, d.deal_lines); if (m.length) ordersMissing.set(d.id, m); });
  if (r.error) { orders = []; ordersErr = r.error.message; } else { orders = normalizeOrders(r.data, trips); ordersErr = null; }
  ordersLoadedAt = Date.now();
}
const clientName = (id) => { const c = clients.find((x) => x.id === id); return c ? c.name : ''; };
const numZ = (v) => { const x = Number(v); return (v == null || v === '' || !isFinite(x)) ? 0 : x; };

// Чистая функция итогов: только active/done, по дате загрузки (start_date). Прибыль = сумма net_eur.
function ordersTotals(rows, range, nameOf) {
  const list = (rows || []).filter((o) => ORDER_COUNTED.includes(o.status) && inRange(o.start_date, range));
  const blank = () => ({income: 0, cost: 0, tax: 0, profit: 0, count: 0});
  const tot = blank(), groups = new Map();
  list.forEach((o) => {
    const v = {income: numZ(o.income_eur), cost: numZ(o.cost_eur), tax: numZ(o.tax_eur), profit: numZ(o.net_eur)};
    const key = o.client_id || '';
    if (!groups.has(key)) groups.set(key, Object.assign(blank(), {name: key ? ((nameOf && nameOf(key)) || 'Без названия') : 'Без клиента', noClient: !key}));
    const g = groups.get(key);
    Object.keys(v).forEach((k) => { tot[k] += v[k]; g[k] += v[k]; });
    g.count++; tot.count++;
  });
  const fin = (x) => Object.assign(x, {margin: x.income ? x.profit / x.income : null});
  return Object.assign(fin(tot), {
    tripsCount: list.filter((o) => o.kind === 'trip').length,
    dealsCount: list.filter((o) => o.kind === 'deal').length,
    noClientCount: list.filter((o) => !o.client_id).length,
    byClient: Array.from(groups.values()).map(fin).sort((a, b) => b.profit - a.profit)
  });
}
// Чистая функция списка: фильтры и сортировка по дате загрузки, новые сверху, без даты в конце.
function filterOrders(rows, f, range) {
  return (rows || []).filter((o) => inRange(o.start_date, range) &&
      (!f.client || (f.client === '__none' ? !o.client_id : o.client_id === f.client)) &&
      (!f.kind || o.kind === f.kind) && (!f.status || o.status === f.status))
    .sort((a, b) => {
      const da = a.start_date ? String(a.start_date).slice(0, 10) : '', dbb = b.start_date ? String(b.start_date).slice(0, 10) : '';
      if (da !== dbb) { if (!da) return 1; if (!dbb) return -1; return da < dbb ? 1 : -1; }
      const ea = a.end_date ? String(a.end_date) : '', eb = b.end_date ? String(b.end_date) : '';
      return ea === eb ? 0 : (ea < eb ? 1 : -1);
    });
}
// Сумма в евро; для не-EUR мелко исходная сумма в валюте заказа (евро ÷ курс).
function orderMoney(n, o) {
  const fx = Number(o.fx_to_eur), cur = o.currency || 'EUR';
  if (cur === 'EUR' || n == null || !(isFinite(fx) && fx > 0)) return eur(n);
  return eur(n) + '<span class="eq">' + money(Number(n) / fx, cur) + '</span>';
}

    carrier_id: q.carrier_id || null, invoice_no: q.invoice_no || null, due_date: q.due_date || null, payable_amount: q.payable_amount == null ? null : q.payable_amount}];

function updateNewOrderCalc() {
  const s = newOrder, x = newOrderDeal(s), res = calcDeal(x.deal, x.lines), b = res.billed, cur = s.currency;
  const m = (n) => money(n, cur), mEq = (n) => moneyEq(n, x.deal);
  if (s.services) {
    s.lines.forEach((l, i) => {
      const tr = document.querySelector('#noLines tr[data-key="' + l.key + '"]');
      if (!tr) return;
      const r = res.rows[i];
      tr.querySelector('[data-c="cost"]').textContent = l.cost_rate == null ? '—' : m(r.cost);
      tr.querySelector('[data-c="sale"]').textContent = l.sale_rate == null ? '—' : m(r.sale);
      const dc = tr.querySelector('[data-c="diff"]');
      dc.textContent = (l.cost_rate == null && l.sale_rate == null) ? '—' : m(r.diff);
      dc.className = 'r ' + (r.diff >= 0 ? 'pos' : 'neg');
    });
    $('noIncome').value = Math.round(b.price * 100) / 100;
    $('noCost').value = Math.round(b.cost * 100) / 100;
    paintLinePay('noLines', s.lines, res.rows);
    updatePayGroups('noPay', s.lines, res.rows, cur);
  } else paintLinePay('noQuick', [s.quick], res.rows);
  $('noInv').placeholder = String(Math.round(b.price * 100) / 100).replace('.', ',');
  $('noVet').innerHTML = vetBoxHtml(x.lines.map((l) => l.carrier_id), !!s.cargo_excise, s.cargo_value_eur);
  const row = (label, n, bold) => '<tr><td' + (bold ? ' style="font-weight:600"' : '') + '>' + label + '</td><td class="r' + (bold ? ' ' + (n >= 0 ? 'pos' : 'neg') : '') + '">' + mEq(n) + '</td></tr>';
  $('noTot').innerHTML = row('Доход', b.price) + row('Затраты', b.cost) + row('Разница', b.diff) +
    row('Налог (' + pct(NEW_ORDER_TAX) + ' с разницы)', b.tax) + row('Чистая прибыль', b.profit, true) +
    '<tr><td>Маржа</td><td class="r">' + pct(b.margin) + '</td></tr>';
  $('noWarn').innerHTML = (res.unconfirmed ? '<div class="warnbox">Есть строки «не подтверждено»: итог может быть неполным.</div>' : '') +
    (cur !== 'EUR' && Number(s.fx_to_eur) === 1 ? '<div class="warnbox">Курс к евро равен 1. Проверьте, что он указан верно.</div>' : '');
}

async function saveNewOrder() {
  const s = newOrder, box = $('noErr');
  box.classList.add('hidden');
  const fail = (m) => { box.textContent = m; box.classList.remove('hidden'); box.scrollIntoView({block: 'center'}); };
  const bad = (v) => v != null && Number.isNaN(v);
  const title = String(s.title || '').trim();
  if (!title) return fail('Укажите название или маршрут заказа.');
  if (s.currency !== 'EUR' && !(s.fx_to_eur != null && isFinite(s.fx_to_eur) && s.fx_to_eur > 0)) return fail('Укажите курс к евро: число больше нуля, например 0,92.');
  if (s.start_date && s.end_date && s.end_date < s.start_date) return fail('Дата выгрузки раньше даты загрузки. Проверьте даты.');
  if (!s.services) {
    if (s.income == null || s.cost == null) return fail('Укажите доход и затраты (можно 0).');
    if (bad(s.income) || bad(s.cost)) return fail('Доход и затраты: только цифры.');
  } else {
    if (!s.lines.length) return fail('Добавьте хотя бы одну строку расчёта или выключите расчёт по услугам.');
    for (const v of [s.qty_marks, s.qty_stickers]) {
      if (v != null && !(Number.isInteger(v) && v >= 0)) return fail('Количество бутылок: только целые числа без минуса.');
    }
    for (const l of s.lines) {
      if (!String(l.name || '').trim()) return fail('У каждой строки должно быть название.');
      if (lineBad(l)) return fail('Проверьте суммы в строке «' + l.name + '»: только цифры.');
    }
  }
  if (!s.services && bad(s.quick.payable_amount)) return fail('Проверьте поле «К оплате»: только цифры.');
  if (bad(s.client_invoice_amount)) return fail('Проверьте поле «Выставлено клиенту»: только цифры.');
  if (bad(s.cargo_value_eur)) return fail('Проверьте поле «Стоимость груза»: только цифры.');
  const blocked = newlyBlocked(newOrderDeal(s).lines.map((l) => l.carrier_id), null);
  const reason = blocked.length ? await askOverrideReason(blocked) : null;
  if (blocked.length && !reason) return;
  const btn = $('noSave'); btn.disabled = true; btn.textContent = 'Сохраняю...';
  let newId = null;
  try {
    const cid = await findOrCreate('clients', s.client_name);
    const x = newOrderDeal(s);
    const d = await db.from('deals').insert({
      title: title, client_id: cid, status: 'active', tax_rate: NEW_ORDER_TAX, company: NEW_ORDER_COMPANY,
      start_date: s.start_date || null, end_date: s.end_date || null,
      currency: s.currency, fx_to_eur: s.currency === 'EUR' ? 1 : s.fx_to_eur,
      final_price: x.deal.final_price, qty_marks: x.deal.qty_marks || 0, qty_stickers: x.deal.qty_stickers || 0,
      client_invoice_amount: s.client_invoice_amount == null ? null : s.client_invoice_amount, client_due_date: s.client_due_date || null,
      ...(vetReady ? {cargo_excise: !!s.cargo_excise, cargo_value_eur: s.cargo_value_eur == null ? null : s.cargo_value_eur} : {})
    }).select('id').single();
    if (d.error) throw d.error;
    newId = d.data.id;
    const ins = await db.from('deal_lines').insert(x.lines.map((l, i) => ({deal_id: newId, name: String(l.name).trim(), basis: l.basis,
      cost_rate: l.cost_rate, sale_rate: l.sale_rate, unconfirmed: !!l.unconfirmed, sort: i,
      carrier_id: l.carrier_id || null, invoice_no: String(l.invoice_no || '').trim() || null, due_date: l.due_date || null,
      payable_amount: l.payable_amount == null ? null : l.payable_amount})));
    if (ins.error) {
      // Строки не сохранились: убираем только что созданную пустую сделку, чтобы не осталось заказа без расчёта.
      await db.from('deals').delete().eq('id', newId);
      throw ins.error;
    }
    await logOverrides(blocked, {deal_id: newId}, reason);
    const cl = await db.from('clients').select('id, name').order('name');
    if (!cl.error) clients = cl.data;
    await loadOrders();
    ordersOkMsg = 'Заказ «' + title + '» сохранён.';
    newOrder = null;
    location.hash = '#/orders';
  } catch (err) {
    fail('Не удалось сохранить: ' + err.message);
    btn.disabled = false; btn.textContent = 'Сохранить заказ';
  }
}

/* ===== Быстрый ввод: заказ из текста по шаблону ===== */
// Ключи сравниваются без учёта регистра; украинские и русские буквы приводятся к одному виду (є→е, і/ї→и).
const QI_FIELDS = [
  {k: 'client', label: 'Клиент', keys: ['клиент'], want: true, t: 'text'},

  {k: 'cost_net', label: 'Перевозчику без ПДВ', keys: ['перевозчику без пдв', 'перевизнику без пдв', 'перевозчику без ндс'], t: 'money'},
  {k: 'vat_carrier', label: 'ПДВ перевозчика', keys: ['пдв перевозчика', 'пдв перевизника', 'ндс перевозчика'], t: 'pct'},

  {k: 'carrier_order', label: 'Заявка перевізнику', keys: ['заявка перевизнику', 'заявка перевозчику'], t: 'text'},
  {k: 'carrier_contract', label: 'Договір з перевізником', keys: ['договир з перевизником', 'договор с перевозчиком'], t: 'text'},
  {k: 'company', label: 'Компания', keys: ['компания'], t: 'company'},
  {k: 'excise', label: 'Акцизный груз', keys: ['акцизный груз', 'акцизний вантаж'], t: 'yesno'}

const qiFold = (s) => String(s == null ? '' : s).toLowerCase().replace(/ё/g, 'е').replace(/є/g, 'е').replace(/[іїы]/g, 'и').replace(/ґ/g, 'г')
  .replace(/[ \s]+/g, ' ').replace(/\s*,\s*/g, ', ').trim();
const QI_KEYMAP = (() => { const m = {}; QI_FIELDS.forEach((f) => f.keys.forEach((k) => { m[qiFold(k)] = f.k; })); return m; })();
const QI_CUR = {eur: 'EUR', '€': 'EUR', usd: 'USD', '$': 'USD', uah: 'UAH', 'грн': 'UAH', '₴': 'UAH', 'гривна': 'UAH', 'гривня': 'UAH'};

// Дата «18.11.2026» → '2026-11-18'; несуществующая дата → null.
function qiDate(s) {
  const m = String(s).trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (!m) return null;
  const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
  if (d.getFullYear() !== Number(m[3]) || d.getMonth() !== Number(m[2]) - 1 || d.getDate() !== Number(m[1])) return null;
  return iso(d);
}
// Сумма: «45000», «45 000», «45 000,50 грн». Всё прочее — null.
function qiNum(s, allowCur) {
  let v = String(s).replace(/[  \s]/g, '');
  if (allowCur) v = v.replace(/(грн\.?|₴|uah|eur|€|usd|\$)$/i, '').replace(/^(€|\$)/, '');
  if (!/^\d+([.,]\d{1,2})?$/.test(v)) return null;
  return Number(v.replace(',', '.'));
}
// Срок оплаты: «14 календарных дней», «7 банковских дней» (и украинские варианты).
function qiTerms(s) {
  const m = qiFold(s).match(/^(\d{1,3})\s*(календарн|банковск|банкивськ|рабоч|робоч)\S*(\s+(дн|день|дня)\S*)?(\s+(после|писля)\s+\S+)?$/);
  if (!m) return null;
  return {days: Number(m[1]), bank: m[2] !== 'календарн'};
}
// Номер документа из «№8 от 18.11.2026 (договір 03/04/26)» → '8'.
function qiDocNo(s) {
  const m = String(s || '').match(/(?:№|\bN[oº°]?\.?)\s*([0-9A-Za-zА-Яа-яЁёІіЇїЄєҐґ/\-.]+)/);
  return m ? m[1].replace(/[.\-/]+$/, '') : null;
}
// Дата + n дней. bank = только будни (без суббот и воскресений).
function qiAddDays(isoDate, n, bank) {
  const p = isoDate.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2]);
  if (!bank) { d.setDate(d.getDate() + n); return iso(d); }
  let left = n;
  while (left > 0) { d.setDate(d.getDate() + 1); const wd = d.getDay(); if (wd !== 0 && wd !== 6) left--; }
  return iso(d);
}
const qiR2 = (x) => Math.round(x * 100) / 100;

// Разбор текста. Возвращает поля, ошибки по полям (что подсветить), предупреждения и итоговые суммы и даты.
function qiParse(text) {
  const raw = {}, errors = {}, warnings = [], f = {};
  String(text || '').split(/\r?\n/).forEach((line, i) => {
    if (!line.trim()) return;
    const at = line.indexOf(':');
    const key = at < 0 ? null : QI_KEYMAP[qiFold(line.slice(0, at)).replace(/\.$/, '')];
    if (!key) { warnings.push('Строка ' + (i + 1) + ' не распознана: «' + line.trim().slice(0, 60) + '»'); return; }
    const val = line.slice(at + 1).trim();
    if (raw[key] != null && raw[key] !== '' && val !== '') { errors[key] = 'Поле указано дважды'; return; }
    if (val !== '' || raw[key] == null) raw[key] = val;
  });
  QI_FIELDS.forEach((fd) => {
    const v = raw[fd.k];
    if (v == null || v === '') return;
    if (errors[fd.k]) return;
    let x = v, bad = '';
    if (fd.t === 'date') { x = qiDate(v); bad = 'Нужна дата вида 18.11.2026'; }
    else if (fd.t === 'money' || fd.t === 'num') { x = qiNum(v, true); bad = 'Нужно число, например 45000'; }
    else if (fd.t === 'int') { x = /^\d+$/.test(v.replace(/\s/g, '')) ? Number(v.replace(/\s/g, '')) : null; bad = 'Нужно целое число'; }
    else if (fd.t === 'pct') { const n = qiNum(v.replace(/%$/, '')); x = n == null || n > 100 ? null : n / 100; bad = 'Нужен процент, например 20%'; }
    else if (fd.t === 'cur') { x = QI_CUR[qiFold(v)] || null; bad = 'Валюта: UAH, EUR или USD'; }
    else if (fd.t === 'terms') { x = qiTerms(v); bad = 'Нужно «14 календарных дней» или «7 банковских дней»'; }
    else if (fd.t === 'ccode') {
      // ЄДРПОУ (только цифры) или иностранный код с буквами (NIP PL…, VAT…) — его сохраняем как есть.
      const dg = v.replace(/\s/g, '');
      x = /^\d{6,10}$/.test(dg) ? dg : /\d/.test(v) ? v : null; bad = 'Не похоже на код';
      if (x != null) f.carrier_code_kind = x === dg && /^\d+$/.test(dg) ? 'edrpou' : 'tax';
    }
    else if (fd.t === 'code') { x = /^\d{6,10}$/.test(v.replace(/\s/g, '')) ? v.replace(/\s/g, '') : null; bad = 'Только цифры ЄДРПОУ'; }
    else if (fd.t === 'doc') { x = qiDocNo(v) ? v : null; bad = 'Не найден номер: нужно «№8 от 18.11.2026»'; }
    else if (fd.t === 'company') { x = COMPANIES.find((c) => qiFold(c) === qiFold(v)) || null; bad = 'Компания: ' + COMPANIES.join(' или '); }
    else if (fd.t === 'yesno') { const y = qiFold(v); x = /^(да|так|yes)$/.test(y) ? true : /^(нет|ни|no)$/.test(y) ? false : null; bad = 'Да или нет'; }
    if (x == null) errors[fd.k] = 'Не распознано: ' + bad.charAt(0).toLowerCase() + bad.slice(1); else f[fd.k] = x;
  });
  if (f.route) f.route = f.route.replace(/\s*(->|—>|=>)\s*/g, ' → ');
  if (f.start && f.end && f.end < f.start) warnings.push('Выгрузка раньше загрузки — проверьте даты.');
  // Суммы: клиенту и перевозчику — без ПДВ и/или с ПДВ; недостающая считается по ставке ПДВ, если ставка известна.
  // Ничего не придумываем: нет ставки — вторая сумма остаётся пустой.
  const vatC = f.vat_client, vatK = f.vat_carrier != null ? f.vat_carrier : f.vat_client;
  const pair = (vat, keyNet, keyGross) => {
    let n = f[keyNet] != null ? f[keyNet] : null, g = f[keyGross] != null ? f[keyGross] : null;
    if (vat != null && n == null && g != null) n = qiR2(g / (1 + vat));
    if (vat != null && g == null && n != null) g = qiR2(n * (1 + vat));
    if (vat != null && f[keyNet] != null && f[keyGross] != null && Math.abs(qiR2(n * (1 + vat)) - g) > 0.011) errors[keyGross] = 'Не сходится с суммой без ПДВ и ставкой ПДВ (сохраню обе как написано)';
    return {net: n, gross: g};
  };
  const inc = pair(vatC, 'income_net', 'income_gross');
  const cost = pair(vatK, 'cost_net', 'cost_gross');
  const calc = {vat_client: vatC, vat_carrier: vatK, vat_carrier_default: f.vat_carrier == null,
    company: f.company || NEW_ORDER_COMPANY, order_no: f.client_order ? qiDocNo(f.client_order) : null,
    income_net: inc.net, income_gross: inc.gross, cost_net: cost.net, cost_gross: cost.gross,
    client_due: f.end && f.client_terms ? qiAddDays(f.end, f.client_terms.days, f.client_terms.bank) : null,
    carrier_due: f.end && f.carrier_terms ? qiAddDays(f.end, f.carrier_terms.days, f.carrier_terms.bank) : null};
  if (inc.net != null || cost.net != null) calc.res = calcDeal({tax_rate: NEW_ORDER_TAX, final_price: inc.net}, [{basis: 'fixed', cost_rate: cost.net, sale_rate: inc.net}]).billed;
  // Совсем пустой заказ (нет ни клиента, ни перевозчика, ни маршрута) создать нельзя; всё остальное можно дозаполнить потом.
  calc.empty = !f.client && !f.carrier && !f.route;
  return {f: f, raw: raw, errors: errors, warnings: warnings, calc: calc, ok: !calc.empty};
}

// Заметки заказа: груз, авто, водитель, документы, условия оплаты. Хранятся только в базе.
function qiNotes(p, missing) {
  const f = p.f, out = [];
  const termsTxt = (t) => t.days + ' ' + (t.bank ? 'банковских' : 'календарных') + ' дн.';
  const cargo = [f.cargo, f.pallets != null ? f.pallets + ' палет' : '', f.weight != null ? String(f.weight).replace('.', ',') + ' кг' : ''].filter(Boolean).join(', ');
  if (cargo) out.push('Груз: ' + cargo);
  if (f.truck) out.push('Авто: ' + f.truck);
  if (f.trailer) out.push('Прицеп: ' + f.trailer);
  if (f.driver) out.push('Водитель: ' + f.driver);
  if (f.client_order) out.push('Заявка клиенту: ' + f.client_order);
  if (f.carrier_order) out.push('Заявка перевізнику: ' + f.carrier_order);
  if (f.carrier_contract) out.push('Договір з перевізником: ' + f.carrier_contract);
  out.push('Оплата клиента: ' + (f.client_terms ? termsTxt(f.client_terms) + ' после выгрузки' : 'не указано'));
  out.push('Оплата перевозчику: ' + (f.carrier_terms ? termsTxt(f.carrier_terms) + ' после выгрузки' : 'не указано'));
  return setMissMark(out.join('\n'), missing || []);
}
// Номер заявки клиенту из заметок уже созданного заказа.
function qiNotesOrderNo(notes) {
  const line = String(notes || '').split('\n').find((l) => /^заявка клиенту:/i.test(l.trim()));
  return line ? qiDocNo(line) : null;
}
// Название для сравнения: без регистра, кавычек и форм собственности (ТОВ, ПП, ФОП, фірма…).
const QI_FORMS = /^(тов|ооо|пп|фоп|флп|ип|тзов|прат|пат|ат|зат|ват|фирма|компания|llc|ltd|gmbh|sro|s\.r\.o\.|sp\.|z|o\.o\.|приватне|пидприемство|товариство|з|обмеженою|видповидальнистю)$/;
const qiNameKey = (s) => qiFold(s).replace(/[«»"'“”„`’]/g, ' ').split(/\s+/).filter((w) => w && !QI_FORMS.test(w)).join(' ');
// Поиск в списке: сначала по коду, потом по названию (и юр. названию у клиентов). Возвращает {by, list}.
// Код для сравнения: без пробелов и приставок NIP/VAT/IČO/ЄДРПОУ; «PL1234567890» совпадает и с «1234567890».
function qiCodeKeys(s) {
  const n = String(s || '').toUpperCase().replace(/[\s.\-:]/g, '').replace(/^(NIP|VAT|ICO|IČO|DIČ|DIC|REGON|KRS|EDRPOU|ЄДРПОУ|ЕДРПОУ)/, '');
  if (!n) return [];
  return /^[A-Z]{2}\d/.test(n) ? [n, n.slice(2)] : [n];
}
function qiFind(list, name, code, codesOf, names) {
  const want = qiCodeKeys(code);
  if (want.length) {
    const byCode = list.filter((x) => (codesOf(x) || []).some((c) => qiCodeKeys(c).some((k) => want.includes(k))));
    if (byCode.length) return {by: 'code', list: byCode};
  }
  const key = qiNameKey(name);
  if (!key) return {by: '', list: []};
  return {by: 'name', list: list.filter((x) => names(x).some((n) => n && qiNameKey(n) === key))};
}

// Курс НБУ на дату: сколько EUR за 1 единицу валюты. null — курса нет (будущая дата или нет связи).
const qiRateCache = {}, qiRateNote = {};
async function qiNbuRate(cur, isoDate) {
  if (cur === 'EUR') return 1;
  const key = cur + isoDate;
  if (qiRateCache[key] !== undefined) return qiRateCache[key];
  const get = async (cc) => {
    const r = await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=' + cc + '&date=' + isoDate.replace(/-/g, '') + '&json');
    const j = await r.json();
    return Array.isArray(j) && j[0] && Number(j[0].rate) > 0 ? Number(j[0].rate) : null;
  };
  let rate = null;
  try {
    const e = await get('EUR');
    if (e && cur === 'UAH') { rate = 1 / e; qiRateNote[key] = '1 € = ' + e.toLocaleString('ru-RU', {maximumFractionDigits: 4}) + ' ₴'; }
    else if (e) {
      const u = await get(cur);
      rate = u ? u / e : null;
      if (u) qiRateNote[key] = '1 € = ' + e.toLocaleString('ru-RU', {maximumFractionDigits: 4}) + ' ₴, 1 ' + (CUR_SIGN[cur] || cur) + ' = ' + u.toLocaleString('ru-RU', {maximumFractionDigits: 4}) + ' ₴';
    }
  } catch (err) { rate = null; }
  if (rate != null) rate = Math.round(rate * 1e6) / 1e6;
  qiRateCache[key] = rate;
  return rate;
}

const QI_TEMPLATE = QI_FIELDS.filter((f) => !['income_gross', 'cost_net', 'client_code', 'company', 'excise'].includes(f.k)).map((f) => f.label + ': ').join('\n');

function openQuickInput() {

  $('modalRoot').innerHTML =
    '<div class="overlay"><div class="modal qi" role="dialog" aria-label="Быстрый ввод заказа"><h2>Быстрый ввод заказа</h2>' +
    '<div class="sub">Вставьте текст по шаблону: «Ключ: значение», по одной строке, порядок любой. Сайт сам разберёт его и покажет, что будет создано.</div>' +
    '<textarea id="qiText" rows="12" spellcheck="false" placeholder="Клиент: …&#10;Перевозчик: …&#10;Маршрут: …"></textarea>' +
    '<div class="acts" style="justify-content:flex-start"><button class="btn ghost" type="button" id="qiTpl">Вставить пустой шаблон</button></div>' +
    '<div id="qiOut"></div>' +
    '<div id="qiErr" class="err hidden"></div>' +
    '<div class="acts"><button class="btn ghost" type="button" id="qiCancel">Отмена</button><button class="btn" type="button" id="qiCreate" disabled>Создать</button></div></div></div>';
  let timer = null;
  $('qiText').oninput = () => { clearTimeout(timer); timer = setTimeout(qiRefresh, 250); };
  $('qiTpl').onclick = () => { if (!$('qiText').value.trim() || confirm('Заменить текст пустым шаблоном?')) { $('qiText').value = QI_TEMPLATE; qiRefresh(); $('qiText').focus(); } };
  $('qiCancel').onclick = () => { $('modalRoot').innerHTML = ''; qi = null; };
  $('qiCreate').onclick = qiCreate;
  $('qiText').focus();
  db.from('clients').select('id, name, legal_name, edrpou').order('name').then((r) => { if (qi) { qi.clients = r.error ? clients : r.data; qiRefresh(); } });
}

// Клиент и перевозчик из базы для разобранного текста.
// client/carrier: {id, name, row, by} — есть в базе; {isNew} — будет создан; {none, why} — не привяжем (дозаполнить потом).
function qiResolve() {
  const p = qi.p, f = p.f, out = {client: null, carrier: null};
  if (f.client && qi.clients) {
    const m = qiFind(qi.clients, f.client, f.client_code, (c) => [c.edrpou], (c) => [c.name, c.legal_name]);
    const ch = qi.clientChoice, chosen = ch && ch !== '__new' ? qi.clients.find((c) => c.id === ch) : null;
    if (chosen) out.client = {id: chosen.id, name: chosen.name, row: chosen, by: 'choice', remember: !chosen.legal_name && qiNameKey(chosen.name) !== qiNameKey(f.client)};
    else if (m.list.length === 1 && ch !== '__new') out.client = {id: m.list[0].id, name: m.list[0].name, row: m.list[0], by: m.by};
    else if (m.list.length > 1 && ch !== '__new') out.client = {none: true, ask: true, many: true, list: m.list, why: 'в базе несколько похожих клиентов'};
    else out.client = {isNew: true, name: f.client, ask: ch !== '__new', list: qi.clients};
  }
  if (f.carrier) {
    const code = f.carrier_code;
    const m = qiFind(carriers, f.carrier, code, (c) => [c.edrpou, c.reg_code], (c) => [c.name]);
    const ch = qi.carrierChoice, chosen = ch ? m.list.find((c) => c.id === ch) : null;
    if (m.list.length === 1 || chosen) {
      const c = chosen || m.list[0], has = carrierCode(c);
      out.carrier = {id: c.id, name: c.name, row: c, by: chosen ? 'choice' : m.by, hasCode: !!has};
      if (code && !has) out.carrier.fillCode = code;
      else if (code && has && m.by !== 'code' && !qiCodeKeys(has).some((k) => qiCodeKeys(code).includes(k))) out.carrier.codeNote = 'В базе код ' + has + ', в тексте ' + code + '. Оставлю код из базы — проверьте.';
    } else if (m.list.length > 1) out.carrier = {none: true, ask: true, list: m.list, why: 'в базе несколько похожих контрагентов'};
    else out.carrier = {isNew: true, name: f.carrier, code: code || null, hasCode: !!code};
    if (out.carrier.row && vetReady && vetOf(out.carrier.row) === 'blocked') out.carrier = {none: true, blocked: true, name: out.carrier.name, why: 'заблокирован СБ — к заказу не привяжу; привяжите в карточке заказа с указанием причины'};
  }
  return out;
}

// Что не заполнено. Эти названия сохраняются в заметках заказа (строка «Дозаполнить: …») и проверяются в карточке.
function qiMissing(p, res, fx) {
  const f = p.f, c = p.calc, miss = [];
  const add = (label, cond) => { if (cond) miss.push(label); };
  add('Клиент', !f.client || (res.client && res.client.none));
  add('Перевозчик', !f.carrier || (res.carrier && res.carrier.none));
  add('ЄДРПОУ перевозчика', f.carrier && res.carrier && !res.carrier.none && !res.carrier.hasCode && !f.carrier_code);
  add('Маршрут', !f.route);
  add('Загрузка', !f.start);
  add('Выгрузка', !f.end);
  add('Валюта', !f.currency);
  add('Курс к EUR', f.currency && f.currency !== 'EUR' && !fx);
  add('Доход', c.income_net == null);
  add('Выставлено клиенту', c.income_net != null && c.income_gross == null);
  add('Расход', c.cost_net == null);
  add('К оплате перевозчику', c.cost_net != null && c.cost_gross == null);
  add('Оплата клиента', !c.client_due);
  add('Оплата перевозчику', !c.carrier_due);
  add('Номер заявки клиенту', !c.order_no);
  return miss;
}

async function qiRefresh() {
  if (!qi || !$('qiText')) return;
  const seq = ++qi.seq;
  qi.text = $('qiText').value;
  qi.p = qiParse(qi.text);
  const f = qi.p.f, cur = f.currency;
  // Курс НБУ на дату загрузки (один запрос на пару «валюта + дата»).
  const rateFor = cur && f.start ? cur + f.start : '';
  if (rateFor !== qi.rateFor) { qi.rateFor = rateFor; qi.rate = undefined; qi.fxManual = null; }
  qiDraw();
  if (rateFor && qi.rate === undefined) {
    const r = await qiNbuRate(cur, f.start);
    if (!qi || seq !== qi.seq) return;
    qi.rate = r;
  }
  await qiCheckDup();
  if (!qi || seq !== qi.seq) return;
  qiDraw();
}

// Защита от дубля: заказ того же клиента с той же датой загрузки и тем же номером заявки клиенту.
async function qiCheckDup() {
  const p = qi.p, res = qiResolve(), cl = res.client;
  const key = cl && cl.id && p.f.start && p.calc.order_no ? cl.id + '|' + p.f.start + '|' + p.calc.order_no : '';
  if (key === qi.dupFor) return;
  qi.dupFor = key; qi.dup = null;
  if (!key) return;
  const r = await db.from('deals').select('id, title, notes').eq('client_id', cl.id).eq('start_date', p.f.start);
  if (r.error) { qi.dup = {err: r.error.message}; return; }
  const same = (r.data || []).find((d) => String(qiNotesOrderNo(d.notes) || '').toLowerCase() === String(p.calc.order_no).toLowerCase());
  qi.dup = same ? {id: same.id, title: same.title} : null;
}

function qiFx() {
  const cur = qi.p.f.currency;
  if (cur === 'EUR') return 1;
  if (qi.fxManual != null) return qi.fxManual;
  return qi.rate || null;
}

  const vatTxt = (v) => v == null ? '' : ' (ПДВ ' + String(qiR2(v * 100)).replace('.', ',') + '%)';

  if ($('qiFx')) $('qiFx').onchange = (ev) => { const v = numOrNull(ev.target.value); qi.fxManual = v != null && isFinite(v) && v > 0 ? v : null; qiDraw(); };

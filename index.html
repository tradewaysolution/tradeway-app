async function qiCreate() {
  const btn = $('qiCreate'), box = $('qiErr');
  box.classList.add('hidden');
  const fail = (msg) => { box.textContent = msg; box.classList.remove('hidden'); btn.disabled = false; btn.textContent = 'Создать'; };
  btn.disabled = true; btn.textContent = 'Создаю...';
  // Перед записью ещё раз разбираем текст и проверяем дубль — вдруг текст или база успели измениться.
  qi.p = qiParse($('qiText').value);
  qi.dupFor = '';
  await qiCheckDup();
  qiDraw();
  if ($('qiCreate').disabled) { btn.textContent = 'Создать'; return; }
  if (qi.dup && qi.dup.id && !confirm('Похоже, такой заказ уже есть: «' + qi.dup.title + '». Всё равно создать ещё один?')) { btn.disabled = false; btn.textContent = 'Создать'; return; }
  btn.disabled = true; btn.textContent = 'Создаю...';
  const p = qi.p, f = p.f, c = p.calc, res = qiResolve(), fx = qiFx(), miss = qiMissing(p, res, fx);
  const cur = f.currency || 'EUR';
  let newId = null;
  try {
    // Клиент: есть в базе — берём; новый — создаём; не определён — заказ без клиента.
    let cid = null;
    if (res.client && res.client.id) {
      cid = res.client.id;
      const upd = {};
      if (res.client.remember) upd.legal_name = f.client;
      if (f.client_code && !res.client.row.edrpou) upd.edrpou = f.client_code;
      if (Object.keys(upd).length) { const r = await db.from('clients').update(upd).eq('id', cid); if (r.error) throw r.error; }
    } else if (res.client && res.client.isNew) {
      const r = await db.from('clients').insert({name: f.client, edrpou: f.client_code || null}).select('id').single();
      if (r.error) throw r.error;
      cid = r.data.id;
    }
    // Перевозчик. ЄДРПОУ (цифры) пишем в ЄДРПОУ; код с буквами (NIP PL…) — как есть в поле кода (reg_code).
    let kid = null;
    const code = f.carrier_code || null, isTax = f.carrier_code_kind === 'tax';
    const codeFields = (cd) => {
      if (!cd) return {};
      if (!isTax) return vetReady ? {edrpou: cd, reg_code: cd} : {edrpou: cd};
      const k = qiCodeKeys(cd)[0] || '';
      return vetReady ? {reg_code: cd, country: /^[A-Z]{2}\d/.test(k) ? k.slice(0, 2) : null} : {};
    };
    if (res.carrier && res.carrier.id) {
      kid = res.carrier.id;
      if (res.carrier.fillCode && Object.keys(codeFields(res.carrier.fillCode)).length) {
        const upd = codeFields(res.carrier.fillCode);
        if (res.carrier.row.country) delete upd.country;
        const r = await db.from('carriers').update(upd).eq('id', kid);
        if (r.error) throw r.error;
      }
    } else if (res.carrier && res.carrier.isNew) {
      const notes = [c.vat_carrier > 0 ? 'платник ПДВ' : '', isTax && !vetReady && code ? 'Код: ' + code : ''].filter(Boolean).join('\n') || null;
      const row = Object.assign({name: f.carrier, type: 'carrier', currency: cur, edrpou: null, notes: notes}, codeFields(code));
      if (vetReady && !isTax && code) row.country = 'UA';
      const r = await db.from('carriers').insert(row).select('id').single();
      if (r.error) throw r.error;
      kid = r.data.id;
    }
    // Заказ (быстрый режим) и одна строка «Перевозка». Пустое — пусто, без придуманных значений.
    const d = await db.from('deals').insert({
      title: f.route || QI_NO_ROUTE, client_id: cid, status: 'active', tax_rate: NEW_ORDER_TAX, company: c.company,
      start_date: f.start || null, end_date: f.end || null, currency: cur, fx_to_eur: cur === 'EUR' ? 1 : (fx || 1),
      final_price: c.income_net, qty_marks: 0, qty_stickers: 0, pallets: f.pallets == null ? null : f.pallets,
      notes: qiNotes(p, miss) || null, client_invoice_amount: c.income_gross, client_due_date: c.client_due,
      ...(vetReady ? {cargo_excise: !!f.excise, cargo_value_eur: null} : {})
    }).select('id').single();
    if (d.error) throw d.error;
    newId = d.data.id;
    const ins = await db.from('deal_lines').insert({deal_id: newId, name: 'Перевозка', basis: 'fixed', cost_rate: c.cost_net, sale_rate: c.income_net,
      unconfirmed: false, sort: 0, carrier_id: kid, invoice_no: null, due_date: c.carrier_due, payable_amount: c.cost_gross});
    if (ins.error) { await db.from('deals').delete().eq('id', newId); throw ins.error; }
    const [cl, k] = await Promise.all([db.from('clients').select('id, name').order('name'), db.from('carriers').select('*').order('name')]);
    if (!cl.error) clients = cl.data;
    if (!k.error) carriers = k.data;
    await loadOrders();
    $('modalRoot').innerHTML = ''; qi = null;
    ordersOkMsg = 'Заказ «' + (f.route || QI_NO_ROUTE) + '» создан через быстрый ввод.' + (miss.length ? ' Не заполнено: ' + miss.join(', ') + '.' : '');
    if (location.hash === '#/orders') renderOrders(true); else location.hash = '#/orders';
  } catch (err) {
    fail('Не удалось создать: ' + err.message);
  }
}

/* ----- Неполные данные: строка «Дозаполнить: …» в заметках заказа ----- */
// Список ставит быстрый ввод. Поле пропадает из списка, как только его заполнили в карточке; пустой список — пометка исчезает.
const QI_NO_ROUTE = 'Без маршрута';
const MISS_MARK = 'Дозаполнить:';
const lineCarrier = (l) => carriers.find((x) => x.id === l.carrier_id);
const MISS_CHECKS = {
  'Клиент': (d) => !!(d.client_id || String(d.client_name || '').trim()),
  'Перевозчик': (d, ls) => ls.some((l) => l.carrier_id),
  'ЄДРПОУ перевозчика': (d, ls) => ls.some((l) => { const c = lineCarrier(l); return c && !!carrierCode(c); }),
  'Маршрут': (d) => !!String(d.title || '').trim() && d.title !== QI_NO_ROUTE,
  'Загрузка': (d) => !!d.start_date,
  'Выгрузка': (d) => !!d.end_date,
  'Валюта': () => false,   // снимается при сохранении карточки (валюта видна и выбрана)
  'Курс к EUR': (d) => dealCur(d) === 'EUR' || (Number(d.fx_to_eur) > 0 && Number(d.fx_to_eur) !== 1),
  'Доход': (d) => d.final_price != null && d.final_price !== '',
  'Выставлено клиенту': (d) => d.client_invoice_amount != null && d.client_invoice_amount !== '',
  'Расход': (d, ls) => ls.some((l) => l.cost_rate != null && l.cost_rate !== ''),
  'К оплате перевозчику': (d, ls) => ls.some((l) => l.payable_amount != null && l.payable_amount !== ''),
  'Оплата клиента': (d) => !!d.client_due_date,
  'Оплата перевозчику': (d, ls) => ls.some((l) => l.due_date),
  'Номер заявки клиенту': (d) => !!qiNotesOrderNo(d.notes)
};
function missMarkLabels(notes) {
  const line = String(notes || '').split('\n').find((l) => l.trim().startsWith(MISS_MARK));
  return line ? line.trim().slice(MISS_MARK.length).split(',').map((x) => x.trim()).filter(Boolean) : [];
}
// Что из отмеченного всё ещё не заполнено.
const missOf = (d, lines) => missMarkLabels(d.notes).filter((l) => !(MISS_CHECKS[l] && MISS_CHECKS[l](d, lines || [])));
function setMissMark(notes, list) {
  const rest = String(notes || '').split('\n').filter((l) => !l.trim().startsWith(MISS_MARK));
  return (list.length ? [MISS_MARK + ' ' + list.join(', ')] : []).concat(rest).join('\n').trim();
}
// Номер заявки клиенту в заметках: меняем только номер в строке «Заявка клиенту: …», остальное не трогаем.
function setNotesOrderNo(notes, no) {
  no = String(no || '').trim();
  const lines = String(notes || '').split('\n').filter((l, i, a) => !(l === '' && i === a.length - 1 && a.length === 1));
  const i = lines.findIndex((l) => /^заявка клиенту:/i.test(l.trim()));
  const re = /(№|\bN[oº°]?\.?)\s*[0-9A-Za-zА-Яа-яЁёІіЇїЄєҐґ/\-.]+/;
  if (i < 0) { if (no) lines.push('Заявка клиенту: №' + no); return lines.join('\n'); }
  let l = lines[i];
  if (re.test(l)) l = l.replace(re, no ? '№' + no : '').replace(/\s{2,}/g, ' ');
  else if (no) l = l.replace(/^(\s*заявка клиенту:)\s*/i, '$1 №' + no + ' ');
  l = l.trim();
  if (/^заявка клиенту:\s*$/i.test(l)) lines.splice(i, 1); else lines[i] = l;
  return lines.join('\n');
}
const missChip = (list) => list.length ? '<span class="chip warn" title="Не заполнено: ' + esc(list.join(', ')) + '">Неполные данные</span>' : '';

/* ===== Контрагенты и финансы ===== */
const CARRIER_TYPES = {carrier: 'Перевозчик', warehouse: 'Склад', insurer: 'Страховая', broker: 'Брокер', other: 'Другое'};
const FIN_STATUSES = ['active', 'done'];   // долги считаем только по активным и завершённым заказам
const todayIso = () => iso(new Date());
const carrierName = (id) => { const c = carriers.find((x) => x.id === id); return c ? c.name : ''; };
const numOr = (v, dflt) => (v == null || v === '' || !isFinite(Number(v))) ? dflt : Number(v);

// Чистая функция долгов.
// Мы должны: по каждому заказу строки с одним контрагентом — один счёт; к оплате = сумма payable_amount строк
//   (если пусто — расход строки по расчёту); осталось = к оплате − платежи direction='out' этому контрагенту по этому заказу.
// Нам должны: заказ; выставлено = client_invoice_amount, а если пусто — итоговая цена заказа;
//   осталось = выставлено − платежи direction='in' по этому заказу.
// Суммы строк — в валюте заказа, итоги — в евро по курсу заказа. Просрочка: срок раньше сегодняшнего дня.
function financeDebts(dealRows, lineRows, payRows, today, nameOfCarrier, nameOfClient) {
  const paidOut = new Map(), paidDeal = new Map();
  const lineById = new Map((lineRows || []).map((l) => [l.id, l]));
  (payRows || []).forEach((p) => {
    const a = numOr(p.amount, 0);
    if (p.direction === 'out') {
      const ln = p.deal_line_id ? lineById.get(p.deal_line_id) : null;
      const dealId = p.deal_id || (ln && ln.deal_id), car = p.carrier_id || (ln && ln.carrier_id);
      if (dealId && car) paidOut.set(dealId + '|' + car, (paidOut.get(dealId + '|' + car) || 0) + a);
    }
    if (p.direction === 'in' && p.deal_id) paidDeal.set(p.deal_id, (paidDeal.get(p.deal_id) || 0) + a);
  });
  const linesBy = new Map();
  (lineRows || []).forEach((l) => { if (!linesBy.has(l.deal_id)) linesBy.set(l.deal_id, []); linesBy.get(l.deal_id).push(l); });
  const out = new Map(), inn = new Map();
  let unassigned = 0;
  const group = (map, key, name) => {
    if (!map.has(key)) map.set(key, {id: key, name: name, items: [], totalEur: 0, overdueEur: 0, byCur: {}});
    return map.get(key);
  };
  const push = (g, item) => {
    g.items.push(item); g.totalEur += item.leftEur;
    if (item.overdue) g.overdueEur += item.leftEur;
    g.byCur[item.cur] = (g.byCur[item.cur] || 0) + item.left;
  };
  (dealRows || []).filter((d) => FIN_STATUSES.includes(normStatus(d.status))).forEach((d) => {
    const ls = (linesBy.get(d.id) || []).slice().sort((a, b) => (a.sort || 0) - (b.sort || 0));
    const res = calcDeal(d, ls), cur = dealCur(d), fx = dealFx(d);
    const bills = new Map();
    ls.forEach((l, i) => {
      const payable = numOr(l.payable_amount, res.rows[i].cost);
      if (!l.carrier_id) { if (payable > 0.005) unassigned++; return; }
      if (!bills.has(l.carrier_id)) bills.set(l.carrier_id, {lines: [], payable: 0, invoice: '', due: null});
      const b = bills.get(l.carrier_id);
      b.lines.push(l); b.payable += payable;
      if (!b.invoice && l.invoice_no) b.invoice = l.invoice_no;
      if (l.due_date && (!b.due || String(l.due_date) < String(b.due))) b.due = l.due_date;
    });
    bills.forEach((b, car) => {
      const key = d.id + '|' + car, paid = paidOut.get(key) || 0, left = b.payable - paid;
      if (left <= 0.005) return;
      push(group(out, car, (nameOfCarrier && nameOfCarrier(car)) || 'Без названия'),
        {key: key, deal: d, carrier_id: car, lines: b.lines, names: b.lines.map((l) => l.name).join(', '), invoice: b.invoice,
         payable: b.payable, paid: paid, left: left, leftEur: left * fx, cur: cur, fx: fx,
         due: b.due || null, overdue: !!(b.due && String(b.due).slice(0, 10) < today)});
    });
    const invoiced = numOr(d.client_invoice_amount, res.billed.price), paidIn = paidDeal.get(d.id) || 0, leftIn = invoiced - paidIn;
    if (leftIn > 0.005) {
      const key = d.client_id || '';
      push(group(inn, key, key ? ((nameOfClient && nameOfClient(key)) || 'Без названия') : 'Без клиента'),
        {deal: d, invoiced: invoiced, paid: paidIn, left: leftIn, leftEur: leftIn * fx, cur: cur, fx: fx,
         due: d.client_due_date || null, overdue: !!(d.client_due_date && String(d.client_due_date).slice(0, 10) < today)});
    }
  });
  const byDue = (a, b) => { const x = a.due ? String(a.due) : '9999', y = b.due ? String(b.due) : '9999'; return x < y ? -1 : x > y ? 1 : 0; };
  const finish = (map) => {
    const groups = Array.from(map.values());
    groups.forEach((g) => g.items.sort(byDue));
    groups.sort((a, b) => b.overdueEur - a.overdueEur || b.totalEur - a.totalEur);
    return {groups: groups, totalEur: groups.reduce((s, g) => s + g.totalEur, 0), overdueEur: groups.reduce((s, g) => s + g.overdueEur, 0)};
  };
  return {weOwe: Object.assign(finish(out), {unassigned: unassigned}), owedToUs: finish(inn)};
}

let fin = {deals: [], lines: [], pays: [], err: null};
async function loadFinance() {
  const [d, l, p, k] = await Promise.all([
    db.from('deals').select('*'),
    db.from('deal_lines').select('*'),
    db.from('payments').select('*').order('paid_at', {ascending: false}),
    db.from('carriers').select('*').order('name')
  ]);
  const e = d.error || l.error || p.error || k.error;
  fin = {deals: d.data || [], lines: l.data || [], pays: p.data || [], err: e ? e.message : null};
  if (!k.error) carriers = k.data;
}
const curSums = (byCur) => Object.entries(byCur).map(([c, v]) => money(v, c)).join(' + ');

/* ----- Контрагенты ----- */

  const debtOf = new Map(debts.groups.map((g) => [g.id, g]));
  $('view').innerHTML =
    '<div class="top"><div><h1>Контрагенты</h1><div class="sub">Перевозчики, склады, страховые, брокеры и другие, кому мы платим</div></div>' +

    '<div class="card">' + (!carriers.length ? '<div class="pad muted">Контрагентов пока нет</div>' :
      '<div class="scroll"><table class="tbl-sm"><thead><tr><th>Название</th><th>Тип</th><th>Валюта</th><th>Код</th><th>Контакт</th>' + (vetReady ? '<th>Проверка СБ</th>' : '') + '<th class="r">Мы должны</th><th></th></tr></thead><tbody>' +
      carriers.map((c) => {
        const g = debtOf.get(c.id), showVet = vetReady && (isCarrierType(c) || vetOf(c) !== 'not_checked');
        return '<tr><td style="font-weight:500">' + (showVet ? '<a href="#/sb/c/' + esc(c.id) + '">' + esc(c.name) + '</a>' : esc(c.name)) + (c.notes ? '<div class="sub">' + esc(c.notes) + '</div>' : '') + '</td>' +
          '<td><span class="kind k-trip">' + esc(CARRIER_TYPES[c.type] || c.type || '—') + '</span></td>' +
          '<td>' + esc(c.currency || '—') + '</td><td style="white-space:nowrap">' + esc([c.country, carrierCode(c)].filter(Boolean).join(' · ') || '—') + '</td><td>' + esc(c.contact || '—') + '</td>' +
          (vetReady ? '<td>' + (showVet ? vetChip(vetOf(c)) : '<span class="muted">—</span>') + '</td>' : '') +
          '<td class="r">' + (g ? '<span class="' + (g.overdueEur > 0.005 ? 'neg' : '') + '">' + curSums(g.byCur) + '</span>' + (Object.keys(g.byCur).some((x) => x !== 'EUR') ? '<span class="eq">≈ ' + eur(g.totalEur) + '</span>' : '') : '<span class="muted">—</span>') + '</td>' +
          '<td class="r"><button class="btn ghost small" type="button" data-edit="' + esc(c.id) + '">Изменить</button></td></tr>';

    '<div><label for="cName">Название</label><input id="cName" value="' + g('name') + '" required></div>' +
    '<div class="f2"><div><label for="cType">Тип</label><select id="cType">' + opt(CARRIER_TYPES, edit ? c.type || 'carrier' : 'carrier') + '</select></div>' +

    (vetReady
      ? '<div class="f2"><div><label for="cCountry">Страна</label><input id="cCountry" list="cCountryList" maxlength="2" value="' + (edit ? esc(c.country || '') : '') + '" placeholder="UA, PL, SK…" style="text-transform:uppercase"><datalist id="cCountryList">' + COUNTRIES.map((x) => '<option value="' + x + '">').join('') + '</datalist></div>' +
        '<div><label for="cCode">Код (ЄДРПОУ / IČO / NIP / VAT)</label><input id="cCode" value="' + (edit ? esc(carrierCode(c)) : '') + '"></div></div>'
      : '<div class="f2"><div><label for="cCode">ЕДРПОУ</label><input id="cCode" value="' + g('edrpou') + '" inputmode="numeric"></div><div></div></div>') +
    '<div><label for="cContact">Контакт</label><input id="cContact" value="' + g('contact') + '"></div>' +
    '<div><label for="cNotes">Заметки</label><textarea id="cNotes" rows="3">' + g('notes') + '</textarea></div>' +
    '<div class="acts"><button class="btn ghost" type="button" id="carCancel">Отмена</button><button class="btn" type="submit" id="carSave">Сохранить</button></div></form></div>';
  $('cName').focus();
  $('carCancel').onclick = () => { $('modalRoot').innerHTML = ''; if (onCancel) onCancel(); };
  $('carForm').onsubmit = async (e) => {
    e.preventDefault();
    const box = $('carErr'); box.classList.add('hidden');
    const row = {name: $('cName').value.trim(), type: $('cType').value, currency: $('cCur').value,
      edrpou: $('cCode').value.trim() || null, contact: $('cContact').value.trim() || null, notes: $('cNotes').value.trim() || null};
    if (vetReady) {
      // Один код для всех стран; для Украины он же ЄДРПОУ (старое поле, его видят прежние экраны).
      const country = $('cCountry').value.trim().toUpperCase() || null, code = $('cCode').value.replace(/\s+/g, '') || null;
      if (country && !/^[A-Z]{2}$/.test(country)) { box.textContent = 'Страна — две латинские буквы, например UA или PL.'; box.classList.remove('hidden'); return; }
      Object.assign(row, {country: country, reg_code: code, edrpou: (!country || country === 'UA') ? code : null});
    }
    if (!row.name) { box.textContent = 'Укажите название.'; box.classList.remove('hidden'); return; }
    const btn = $('carSave'); btn.disabled = true; btn.textContent = 'Сохраняю...';

                   : await db.from('carriers').insert(row).select('*').single();
    if (r.error) { box.textContent = 'Не удалось сохранить: ' + r.error.message; box.classList.remove('hidden'); btn.disabled = false; btn.textContent = 'Сохранить'; return; }
    const k = await db.from('carriers').select('*').order('name');
    if (!k.error) carriers = k.data;
    $('modalRoot').innerHTML = '';
    if (onSaved) onSaved(r.data);
  };
}

// Общая обработка ввода в строках. Возвращает строку, если она изменилась.
function lineInput(e, lines, redraw) {
  const tr = e.target.closest('tr[data-key]'), f = e.target.getAttribute('data-f');
  if (!tr || !f) return null;
  const l = lines.find((x) => x.key === tr.getAttribute('data-key'));
  if (!l) return null;
  if (f === 'carrier_id') {
    if (e.type !== 'change') return null;
    if (e.target.value === '__new') {
      e.target.value = l.carrier_id || '';
      openCarrierForm(null, (c) => { l.carrier_id = c.id; l.dirty = true; redraw(); });
      return null;
    }
    l.carrier_id = e.target.value || null;
    joinPayGroup(lines, l);
  } else if (f === 'unconfirmed') l.unconfirmed = e.target.checked;
  else if (f === 'cost_rate' || f === 'sale_rate' || f === 'payable_amount') l[f] = numOrNull(e.target.value);
  else if (f === 'due_date') l[f] = e.target.value || null;
  else l[f] = e.target.value;
  l.dirty = true;
  return l;
}
// Строка, попавшая к контрагенту, берёт № счёта и срок оплаты его счёта в этом заказе.
function joinPayGroup(lines, l) {
  if (!l.carrier_id) return;
  const mate = lines.find((x) => x !== l && x.carrier_id === l.carrier_id);
  if (!mate) return;
  if (!l.invoice_no && mate.invoice_no) l.invoice_no = mate.invoice_no;
  if (!l.due_date && mate.due_date) l.due_date = mate.due_date;
}
function removeLineRows(tbody, key) { tbody.querySelectorAll('tr[data-key="' + key + '"]').forEach((r) => r.remove()); }
// Подсветка строк расхода без контрагента и подсказка «К оплате» = расход строки.
function paintLinePay(tbodyId, lines, rows) {
  lines.forEach((l, i) => {
    const trs = document.querySelectorAll('#' + tbodyId + ' tr[data-key="' + l.key + '"]');
    const r = rows[i] || {cost: 0};
    const expense = r.cost > 0.005 || (l.payable_amount != null && l.payable_amount > 0);
    trs.forEach((tr) => tr.classList.toggle('nocar', expense && !l.carrier_id));
    const p = document.querySelector('#' + tbodyId + ' tr.payrow[data-key="' + l.key + '"] [data-f="payable_amount"]');
    if (p) p.placeholder = String(Math.round(r.cost * 100) / 100).replace('.', ',');
  });
}
// Счета к оплате: строки заказа с одним контрагентом — один счёт (№, срок, «К оплате»).
// «К оплате» хранится в строках: введённая сумма делится между строками группы пропорционально их расходу.
function payGroups(lines, rows) {
  const groups = new Map(), loose = [];
  lines.forEach((l, i) => {
    const r = rows[i] || {cost: 0};
    if (!l.carrier_id) { if (r.cost > 0.005 || (l.payable_amount != null && l.payable_amount > 0)) loose.push(l); return; }
    if (!groups.has(l.carrier_id)) groups.set(l.carrier_id, {carrier_id: l.carrier_id, lines: [], cost: 0, payable: 0, manual: false, invoice: '', due: null});
    const g = groups.get(l.carrier_id);
    g.lines.push(l); g.cost += r.cost;
    g.payable += (l.payable_amount != null && isFinite(l.payable_amount)) ? l.payable_amount : r.cost;
    if (l.payable_amount != null) g.manual = true;
    if (!g.invoice && l.invoice_no) g.invoice = l.invoice_no;
    if (!g.due && l.due_date) g.due = l.due_date;

  return {groups: Array.from(groups.values()), loose: loose};
}
const plainNum = (n) => String(Math.round(n * 100) / 100).replace('.', ',');
function updatePayGroups(boxId, lines, rows, cur) {
  const box = $(boxId); if (!box) return;

  const sig = JSON.stringify([pg.groups.map((g) => [g.carrier_id, g.lines.map((l) => l.key + ':' + l.name)]), pg.loose.map((l) => l.key + ':' + l.name)]);

      pg.groups.map((g) => '<tr data-carrier="' + esc(g.carrier_id) + '"><td style="font-weight:500">' + esc(carrierName(g.carrier_id) || '(контрагент не найден)') + '</td>' +

        '<td><input type="date" data-g="due_date" value="' + esc(g.due || '') + '" aria-label="Срок оплаты"></td>' +

function payGroupEdit(e, lines, rowsFn) {
  const tr = e.target.closest('tr[data-carrier]'), f = e.target.getAttribute('data-g');
  if (!tr || !f) return false;
  const carrier = tr.getAttribute('data-carrier');
  const idx = []; lines.forEach((l, i) => { if (l.carrier_id === carrier) idx.push(i); });
  if (!idx.length) return false;
  if (f === 'invoice_no') idx.forEach((i) => { lines[i].invoice_no = e.target.value; });
  else if (f === 'due_date') { if (e.type !== 'change') return false; idx.forEach((i) => { lines[i].due_date = e.target.value || null; }); }
  else if (f === 'payable') {
    const P = numOrNull(e.target.value);
    if (P == null || Number.isNaN(P)) idx.forEach((i, k) => { lines[i].payable_amount = (P == null || k) ? null : P; });
    else {
      const rows = rowsFn(), costs = idx.map((i) => (rows[i] || {cost: 0}).cost), C = costs.reduce((a, b) => a + b, 0);
      let rest = P;
      idx.forEach((i, k) => {
        const v = k === idx.length - 1 ? Math.round(rest * 100) / 100 : (C > 0 ? Math.round(costs[k] * P / C * 100) / 100 : (k ? 0 : P));
        lines[i].payable_amount = v; rest -= v;
      });
    }
  }
  idx.forEach((i) => { lines[i].dirty = true; });
  return true;
}

let vetReady = false;   // true, когда в базе есть таблицы проверок (файл sql/006 запущен)

const vetOf = (c) => (c && VET[c.vetting_status]) ? c.vetting_status : 'not_checked';
const vetChip = (st) => '<span class="chip ' + VET[st][1] + '">' + VET[st][0] + '</span>';
const carrierCode = (c) => (c && (c.reg_code || c.edrpou)) || '';
const isCarrierType = (c) => !!c && (!c.type || c.type === 'carrier');
const addDays = (isoStr, n) => { const p = String(isoStr).slice(0, 10).split('-').map(Number); return iso(new Date(p[0], p[1] - 1, p[2] + n)); };
function daysUntil(d, today) {
  const p = String(d).slice(0, 10).split('-').map(Number), t = String(today || todayIso()).split('-').map(Number);
  return Math.round((Date.UTC(p[0], p[1] - 1, p[2]) - Date.UTC(t[0], t[1] - 1, t[2])) / 86400000);
}
function expiryChip(d) {
  if (!d) return '<span class="chip gray">Без срока</span>';
  const n = daysUntil(d);
  if (n < 0) return '<span class="chip bad">Истёк</span>';
  if (n === 0) return '<span class="chip warn">Истекает сегодня</span>';
  if (n <= 30) return '<span class="chip warn">Через ' + n + ' дн.</span>';
  return '<span class="chip">Действует</span>';
}

// Уровень проверки под рейс: акциз или дороже €50k — усиленный; обычный до €10k и уже возил — базовый; иначе стандартный.
function checkLevel(excise, band, known) {
  if (excise || band === 'high') return 'enhanced';
  if (band === 'low' && known) return 'base';
  return 'standard';
}
const valueBand = (v) => (v == null || v === '' || !isFinite(Number(v))) ? null : Number(v) <= 10000 ? 'low' : Number(v) <= 50000 ? 'mid' : 'high';

// Предупреждения по перевозчику в заказе. Чистая функция: [{kind: 'bad'|'warn'|'info', text}].
function vetWarnings(c, excise, valueEur) {
  if (!c) return [];
  const st = vetOf(c), out = [];
  if (st === 'blocked') return [{kind: 'bad', text: 'Заблокирован СБ' + (c.vetting_conditions ? ': ' + c.vetting_conditions : '') + '. Сохранить заказ можно только с указанием причины.'}];
  if (!isCarrierType(c)) return [];
  if (st === 'not_checked') return [{kind: 'info', text: 'Перевозчик не проверен — запусти агента СБ.'}];
  if (st === 'in_progress') out.push({kind: 'info', text: 'Проверка СБ ещё идёт.'});
  const big = Number(valueEur) > 50000;
  if ((excise || big) && (LEVEL_N[c.vetting_max_level] || 0) < 3) {
    out.push({kind: 'warn', text: (excise ? 'Груз акцизный' : 'Груз дороже €50 000') + ', а допуск ' +
      (c.vetting_max_level ? 'только до уровня «' + LEVELS[c.vetting_max_level] + '»' : 'без уровня') + '. Нужна усиленная проверка.'});
  }
  if (st === 'conditional' && c.vetting_conditions) out.push({kind: 'warn', text: 'Условие допуска: ' + c.vetting_conditions});
  return out;
}
// Блок «Проверка перевозчиков» в заказе: значок статуса и предупреждения по каждому перевозчику.
function vetBoxHtml(ids, excise, valueEur) {
  if (!vetReady) return '';
  const list = Array.from(new Set((ids || []).filter(Boolean))).map((id) => carriers.find((c) => c.id === id)).filter((c) => c && (isCarrierType(c) || vetOf(c) === 'blocked'));
  if (!list.length) return '';
  return '<div class="card"><h3 class="sm">Проверка перевозчиков</h3><div class="pad" style="padding:12px 14px;gap:10px">' +
    list.map((c) => '<div class="vetc"><div class="who"><a href="#/sb/c/' + esc(c.id) + '">' + esc(c.name) + '</a>' + vetChip(vetOf(c)) +
      (c.vetting_max_level ? '<span class="muted" style="font-weight:400">до уровня «' + LEVELS[c.vetting_max_level] + '»</span>' : '') + '</div>' +
      vetWarnings(c, excise, valueEur).map((w) => '<div class="' + (w.kind === 'bad' ? 'badbox' : w.kind === 'warn' ? 'warnbox' : 'infobox') + '">' + esc(w.text) + '</div>').join('') + '</div>').join('') +
    '</div></div>';
}
// Заблокированные перевозчики, которых раньше в заказе не было: для них нужна причина.
const newlyBlocked = (ids, saved) => Array.from(new Set((ids || []).filter(Boolean)))
  .filter((id) => !(saved && saved.has(id))).map((id) => carriers.find((c) => c.id === id)).filter((c) => vetReady && vetOf(c) === 'blocked');
function askOverrideReason(list) {
  return new Promise((resolve) => {
    $('modalRoot').innerHTML =
      '<div class="overlay"><form class="modal" id="ovrForm" role="dialog" aria-label="Перевозчик заблокирован"><h2>Перевозчик заблокирован СБ</h2>' +
      list.map((c) => '<div class="badbox"><strong>' + esc(c.name) + '</strong>' + (c.vetting_conditions ? ': ' + esc(c.vetting_conditions) : '') + '</div>').join('') +
      '<div id="ovrErr" class="err hidden"></div>' +
      '<div><label for="ovrReason">Почему всё равно работаем с ним</label><textarea id="ovrReason" rows="3" placeholder="Напр. согласовано с клиентом, груз застрахован отдельно"></textarea><div class="sub">Причина сохранится в журнал.</div></div>' +
      '<div class="acts"><button class="btn ghost" type="button" id="ovrCancel">Отмена</button><button class="btn" type="submit">Сохранить с причиной</button></div></form></div>';
    $('ovrReason').focus();
    $('ovrCancel').onclick = () => { $('modalRoot').innerHTML = ''; resolve(null); };
    $('ovrForm').onsubmit = (e) => {
      e.preventDefault();
      const v = $('ovrReason').value.trim();
      if (!v) { $('ovrErr').textContent = 'Напишите причину.'; $('ovrErr').classList.remove('hidden'); return; }
      $('modalRoot').innerHTML = ''; resolve(v);
    };
  });
}
async function logOverrides(list, ref, reason) {
  if (!list.length || !reason) return;
  const r = await db.from('carrier_overrides').insert(list.map((c) => Object.assign({carrier_id: c.id, reason: reason}, ref)));
  if (r.error) alert('Заказ сохранён, но причину не удалось записать в журнал: ' + r.error.message);
}

// Данные раздела: перевозчики, последние проверки, страховки, документы, заказы и оценки.
let sb = {checks: [], ins: [], docs: [], lines: [], deals: [], ratings: [], err: null};
async function loadSb() {
  const [k, ck, ins, dc, ln, dl, rt] = await Promise.all([
    db.from('carriers').select('*').order('name'),
    db.from('carrier_checks').select('id, carrier_id, checked_at, level, verdict, score, conditions, red_flags, created_at').order('checked_at', {ascending: false}).order('created_at', {ascending: false}),
    db.from('carrier_insurance').select('*'),
    db.from('carrier_documents').select('*'),
    db.from('deal_lines').select('deal_id, carrier_id').not('carrier_id', 'is', null),
    db.from('deals').select('id, title, status, start_date'),
    db.from('trip_ratings').select('*')
  ]);
  if (!k.error) carriers = k.data;
  vetReady = !ck.error;
  const e = k.error || ins.error || dc.error || ln.error || dl.error || rt.error;
  sb = {checks: ck.data || [], ins: ins.data || [], docs: dc.data || [], lines: ln.data || [], deals: dl.data || [], ratings: rt.data || [], err: e ? e.message : null};
}
// Заказы перевозчика (без черновиков): старые рейсы и новые заказы, где он стоит в строках.
function carrierOrders(cid) {
  const out = [];
  trips.filter((t) => t.carrier_id === cid && normStatus(t.status) !== 'draft').forEach((t) => out.push({kind: 'trip', id: t.id,
    title: 'Рейс ' + fdate(t.loading_date) + (t.clients ? ' · ' + t.clients.name : '') + (t.city ? ' · ' + t.city : ''), date: t.loading_date, cargo: t.cargo}));
  const ids = new Set(sb.lines.filter((l) => l.carrier_id === cid).map((l) => l.deal_id));
  sb.deals.filter((d) => ids.has(d.id) && normStatus(d.status) !== 'draft').forEach((d) => out.push({kind: 'deal', id: d.id, title: d.title || 'Без названия', date: d.start_date}));
  return out.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
}
// Полисы и документы со сроком до указанной даты (просроченные тоже), ближайшие сверху.
function expiringDocs(ins, docs, until) {
  const out = [];
  (ins || []).forEach((i) => { if (i.valid_until && String(i.valid_until).slice(0, 10) <= until) out.push({carrier_id: i.carrier_id, title: 'Полис ' + (i.insurer || '') + (POLICY_TYPES[i.policy_type] ? ' · ' + POLICY_TYPES[i.policy_type] : ''), date: i.valid_until}); });
  (docs || []).forEach((d) => { if (d.valid_until && String(d.valid_until).slice(0, 10) <= until) out.push({carrier_id: d.carrier_id, title: d.title || CDOC_TYPES[d.doc_type] || d.doc_type || 'Документ', date: d.valid_until}); });
  return out.sort((a, b) => String(a.date).localeCompare(String(b.date)));
}
const sbTopButtons = () => '<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn ghost" href="#/sb/check" style="text-decoration:none">Проверка под рейс</a>' +
  '<button class="btn" type="button" data-import>Импорт проверки</button></div>';
const bindImport = () => document.querySelectorAll('[data-import]').forEach((b) => { b.onclick = () => openImportModal(); });

/* ----- Реестр ----- */
let sbFilter = {status: '', country: '', q: ''};
async function renderSb() {
  setNav('sb');
  $('view').innerHTML = '<div class="muted">Загружаю перевозчиков...</div>';
  await loadSb();
  if (location.hash !== '#/sb') return;
  const head = '<div class="top"><div><h1>Перевозчики · СБ</h1><div class="sub">Проверки делает агент СБ в Claude, сюда загружается его результат.</div></div>' + (vetReady ? sbTopButtons() : '') + '</div>';
  if (!vetReady) { $('view').innerHTML = head + '<div class="warnbox" style="font-size:14px">' + VET_SETUP_MSG + '</div>'; return; }
  const list = carriers.filter((c) => isCarrierType(c) || vetOf(c) !== 'not_checked');
  const exp = expiringDocs(sb.ins, sb.docs, addDays(todayIso(), 30));
  const last = new Map(); sb.checks.forEach((k) => { if (!last.has(k.carrier_id)) last.set(k.carrier_id, k); });
  const cnt = (st) => list.filter((c) => vetOf(c) === st).length;
  const metric = (l, v, cls) => '<div class="metric"><div class="l">' + l + '</div><div class="v' + (cls ? ' ' + cls : '') + '">' + v + '</div></div>';
  const alerts = [];
  list.filter((c) => vetOf(c) === 'blocked').forEach((c) => {
    const k = last.get(c.id), flags = k && k.red_flags && k.red_flags.length ? k.red_flags.join('; ') : '';
    alerts.push(['bad', 'Стоп', c, flags || c.vetting_conditions || 'Стоп-фактор по проверке СБ']);
  });
  list.filter((c) => vetOf(c) === 'conditional').forEach((c) => alerts.push(['warn', 'Условие', c, c.vetting_conditions || 'Допущен с условиями']));
  exp.forEach((x) => { const c = carriers.find((y) => y.id === x.carrier_id); if (c) alerts.push(['info', 'Срок', c, x.title + ' — ' + (daysUntil(x.date) < 0 ? 'истёк ' : 'до ') + fdate(x.date)]); });
  const countries = Array.from(new Set(list.map((c) => c.country).filter(Boolean))).sort();
  const opt = (v, label, cur) => '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(label) + '</option>';
  $('view').innerHTML = head +
    (sb.err ? '<div class="err">Данные загрузились не полностью: ' + esc(sb.err) + '</div>' : '') +
    '<div class="metrics">' + metric('Всего', list.length) + metric('Допущены', cnt('approved'), 'pos') +
      metric('С условиями', cnt('conditional')) + metric('Заблокированы', cnt('blocked'), cnt('blocked') ? 'neg' : '') +
      metric('Документы истекают ≤30 дн.', exp.length) + '</div>' +
    (alerts.length ? '<div class="card"><h3>Требует внимания</h3>' + alerts.map(([cls, tag, c, text]) =>
      '<div class="alert"><span class="chip ' + cls + '">' + tag + '</span><div class="grow"><div style="font-weight:600">' + esc(c.name) + '</div><div class="sub" style="font-size:14px">' + esc(text) + '</div></div>' +
      '<a href="#/sb/c/' + esc(c.id) + '" style="white-space:nowrap">Открыть →</a></div>').join('') + '</div>' : '') +
    '<div class="filters">' +
      '<div><label for="sbSt">Статус</label><select id="sbSt">' + opt('', 'Все статусы', sbFilter.status) + Object.entries(VET).map(([k, v]) => opt(k, v[0], sbFilter.status)).join('') + '</select></div>' +
      '<div><label for="sbCo">Страна</label><select id="sbCo">' + opt('', 'Все страны', sbFilter.country) + countries.map((x) => opt(x, x, sbFilter.country)).join('') + '</select></div>' +
      '<div style="flex:1 1 260px"><label for="sbQ">Поиск</label><input id="sbQ" type="search" value="' + esc(sbFilter.q) + '" placeholder="Название, код, номер авто" style="padding:8px 10px;font-size:13px"></div>' +
      '<div class="cnt muted" id="sbCnt"></div></div>' +
    '<div class="card" id="sbTable"></div>';
  const draw = () => {
    const q = sbFilter.q.trim().toLowerCase();
    const rows = list.filter((c) => (!sbFilter.status || vetOf(c) === sbFilter.status) && (!sbFilter.country || c.country === sbFilter.country) &&
      (!q || [c.name, carrierCode(c), c.director].concat(trips.filter((t) => t.carrier_id === c.id).map((t) => t.vehicle)).join(' ').toLowerCase().includes(q)));
    $('sbCnt').textContent = 'Найдено: ' + rows.length;
    $('sbTable').innerHTML = !rows.length ? '<div class="pad muted">Никого не нашлось. Перевозчик появится здесь после импорта проверки или если создать его в «Контрагентах» с типом «Перевозчик».</div>' :
      '<div class="scroll"><table class="orders"><thead><tr><th>Перевозчик</th><th>Страна / код</th><th>Статус</th><th class="r">Балл</th><th>Допуск до уровня</th><th class="r">Заказов</th><th>Проверен</th></tr></thead><tbody>' +
      rows.map((c) => '<tr data-href="#/sb/c/' + esc(c.id) + '"><td><a href="#/sb/c/' + esc(c.id) + '" style="font-weight:500">' + esc(c.name) + '</a>' + (c.director ? '<div class="sub">' + esc(c.director) + '</div>' : '') + '</td>' +
        '<td style="white-space:nowrap">' + esc([c.country, carrierCode(c)].filter(Boolean).join(' · ') || '—') + '</td>' +
        '<td>' + vetChip(vetOf(c)) + '</td><td class="r" style="font-weight:600">' + (c.vetting_score != null ? esc(c.vetting_score) : '—') + '</td>' +
        '<td>' + (LEVELS[c.vetting_max_level] || '—') + '</td><td class="r">' + carrierOrders(c.id).length + '</td>' +
        '<td style="white-space:nowrap">' + fdate(c.last_checked_at) + '</td></tr>').join('') + '</tbody></table></div>';
    bindOrderRows($('sbTable'));
  };
  $('sbSt').onchange = (e) => { sbFilter.status = e.target.value; draw(); };
  $('sbCo').onchange = (e) => { sbFilter.country = e.target.value; draw(); };
  $('sbQ').oninput = (e) => { sbFilter.q = e.target.value; draw(); };
  draw();
  bindImport();
}

function openRatingModal(carrierId, order, onDone, offered) {

  const close = () => { $('modalRoot').innerHTML = ''; };

    const btn = $('rateSave'); btn.disabled = true; btn.textContent = 'Сохраняю...';
    const row = {carrier_id: carrierId, trip_id: order && order.kind === 'trip' ? order.id : null, deal_id: order && order.kind === 'deal' ? order.id : null,
      on_time: $('rOnTime').value === '1', docs_score: Number($('rDocs').value), comm_score: Number($('rComm').value), claims: $('rClaims').value.trim() || null};
    const r = await db.from('trip_ratings').insert(row);

// После завершения заказа: предложить оценить каждого перевозчика, которого ещё не оценили по этому заказу.
async function offerRatings(kind, id, title, ids) {
  if (!vetReady) return;
  const list = Array.from(new Set((ids || []).filter(Boolean))).map((x) => carriers.find((c) => c.id === x)).filter(isCarrierType);
  if (!list.length) return;
  const r = await db.from('trip_ratings').select('carrier_id').eq(kind === 'trip' ? 'trip_id' : 'deal_id', id);
  if (r.error) return;
  const rated = new Set(r.data.map((x) => x.carrier_id)), todo = list.filter((c) => !rated.has(c.id));
  const next = () => { const c = todo.shift(); if (c) openRatingModal(c.id, {kind: kind, id: id, title: title}, next, true); };
  next();
}

/* ----- Импорт проверки от агента СБ ----- */
// Чистая функция: разбирает и проверяет JSON агента. Возвращает {errors: [...]} или {errors: [], data}.
function parseCheckJson(text) {
  const s = String(text == null ? '' : text).trim();
  if (!s) return {errors: ['Вставьте JSON, который выдал агент СБ.']};
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b < a) return {errors: ['Не нашёл JSON: он начинается с { и заканчивается }. Скопируйте ответ агента целиком.']};
  let p;
  try { p = JSON.parse(s.slice(a, b + 1)); } catch (e) { return {errors: ['JSON повреждён, его не получается прочитать. Скопируйте ответ агента ещё раз целиком, от { до }.']}; }
  if (!p || typeof p !== 'object' || Array.isArray(p)) return {errors: ['Ожидался JSON в фигурных скобках { }.']};
  const errs = [];
  const str = (v) => typeof v === 'string' && v.trim() !== '';
  const optStr = (v) => v == null || typeof v === 'string';
  const isDate = (v) => v == null || v === '' || (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(Date.parse(v + 'T00:00:00Z')) && new Date(v + 'T00:00:00Z').toISOString().slice(0, 10) === v);
  const isUrl = (v) => v == null || v === '' || (typeof v === 'string' && /^https:\/\//i.test(v.trim()));
  const strArr = (v) => v == null || (Array.isArray(v) && v.every((x) => typeof x === 'string'));
  const isObj = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
  const DATE_HINT = ' в формате ГГГГ-ММ-ДД, например 2026-07-30';
  if (p.tw_carrier_check !== 1) errs.push('Нет метки "tw_carrier_check": 1 — похоже, это не результат агента СБ.');
  const c = p.carrier, k = p.check;
  if (!isObj(c)) errs.push('Нет блока "carrier" с данными перевозчика.');
  else {
    if (!str(c.name)) errs.push('Перевозчик: не указано название (carrier.name).');
    if (!(typeof c.country === 'string' && /^[A-Za-z]{2}$/.test(c.country.trim()))) errs.push('Перевозчик: страна — две латинские буквы, например UA, PL, SK (carrier.country).');
    if (!(str(c.reg_code) || (typeof c.reg_code === 'number' && isFinite(c.reg_code)))) errs.push('Перевозчик: не указан код ЄДРПОУ / IČO / NIP / VAT (carrier.reg_code).');
    ['director', 'iban', 'email', 'phone'].forEach((f) => { if (!optStr(c[f])) errs.push('Перевозчик: поле carrier.' + f + ' должно быть текстом.'); });
  }
  if (!isObj(k)) errs.push('Нет блока "check" с итогом проверки.');
  else {
    if (!LEVELS[k.level]) errs.push('Итог: уровень проверки — base, standard или enhanced (check.level).');
    if (!['approved', 'conditional', 'blocked'].includes(k.verdict)) errs.push('Итог: вердикт — approved, conditional или blocked (check.verdict).');
    if (k.score != null && !(typeof k.score === 'number' && k.score >= 0 && k.score <= 10)) errs.push('Итог: балл — число от 0 до 10 (check.score).');
    if (!isDate(k.checked_at)) errs.push('Итог: дата проверки' + DATE_HINT + ' (check.checked_at).');
    ['red_flags', 'missing', 'tasks'].forEach((f) => { if (!strArr(k[f])) errs.push('Итог: check.' + f + ' — список строк в квадратных скобках.'); });
    ['trip_context', 'conditions'].forEach((f) => { if (!optStr(k[f])) errs.push('Итог: поле check.' + f + ' должно быть текстом.'); });
    if (!isUrl(k.card_url)) errs.push('Итог: ссылка на карточку должна начинаться с https:// (check.card_url).');
  }
  ['items', 'insurance', 'documents'].forEach((f) => { if (p[f] != null && !Array.isArray(p[f])) errs.push('Блок "' + f + '" должен быть списком в квадратных скобках.'); });
  const arr = (f) => Array.isArray(p[f]) ? p[f] : [];
  arr('items').forEach((it, i) => {
    const n = 'Пункт проверки №' + (i + 1) + (isObj(it) && str(it.title) ? ' «' + it.title.trim() + '»' : '');
    if (!isObj(it)) { errs.push(n + ': ожидался объект { }.'); return; }
    if (![1, 2, 3].includes(it.layer)) errs.push(n + ': слой — 1, 2 или 3 (layer).');
    if (!str(it.title)) errs.push(n + ': нет названия (title).');
    if (!RESULTS[it.result]) errs.push(n + ': результат — pass, warn, fail или not_checked (result).');
    if (!optStr(it.detail) || !optStr(it.source)) errs.push(n + ': detail и source должны быть текстом.');
  });
  arr('insurance').forEach((x, i) => {
    const n = 'Страховка №' + (i + 1);
    if (!isObj(x)) { errs.push(n + ': ожидался объект { }.'); return; }
    ['insurer', 'policy_type', 'currency', 'franchise_note'].forEach((f) => { if (!optStr(x[f])) errs.push(n + ': поле ' + f + ' должно быть текстом.'); });
    if (x.limit_amount != null && !(typeof x.limit_amount === 'number' && x.limit_amount >= 0)) errs.push(n + ': лимит — число или null (limit_amount).');
    if (!strArr(x.exclusions)) errs.push(n + ': исключения — список строк (exclusions).');
    if (x.confirmed_by_insurer != null && typeof x.confirmed_by_insurer !== 'boolean') errs.push(n + ': confirmed_by_insurer — true или false.');
    if (!isDate(x.valid_until)) errs.push(n + ': срок действия' + DATE_HINT + ' (valid_until).');
    if (!isUrl(x.drive_url)) errs.push(n + ': ссылка должна начинаться с https:// (drive_url).');
  });
  arr('documents').forEach((x, i) => {
    const n = 'Документ №' + (i + 1);
    if (!isObj(x)) { errs.push(n + ': ожидался объект { }.'); return; }
    if (!optStr(x.doc_type) || !optStr(x.title)) errs.push(n + ': doc_type и title должны быть текстом.');
    if (!str(x.doc_type) && !str(x.title)) errs.push(n + ': нужен тип (doc_type) или название (title).');
    if (!isDate(x.valid_until)) errs.push(n + ': срок действия' + DATE_HINT + ' (valid_until).');
    if (!isUrl(x.drive_url)) errs.push(n + ': ссылка должна начинаться с https:// (drive_url).');
  });
  if (errs.length) return {errors: errs};
  const t = (v) => typeof v === 'string' ? (v.trim() || null) : (v == null ? null : v);
  const sa = (v) => (v || []).map((x) => x.trim()).filter(Boolean);
  const data = Object.assign({}, p, {
    tw_carrier_check: 1,
    carrier: Object.assign({}, c, {name: c.name.trim(), country: c.country.trim().toUpperCase(), reg_code: String(c.reg_code).replace(/\s+/g, ''),
      director: t(c.director), iban: c.iban ? String(c.iban).replace(/\s+/g, '') || null : null, email: t(c.email), phone: t(c.phone)}),
    check: Object.assign({}, k, {checked_at: t(k.checked_at), trip_context: t(k.trip_context), conditions: t(k.conditions), score: k.score == null ? null : k.score,
      red_flags: sa(k.red_flags), missing: sa(k.missing), tasks: sa(k.tasks), card_url: t(k.card_url)}),
    items: arr('items').map((it) => ({layer: it.layer, title: it.title.trim(), result: it.result, detail: t(it.detail), source: t(it.source)})),
    insurance: arr('insurance').map((x) => ({insurer: t(x.insurer), policy_type: t(x.policy_type), limit_amount: x.limit_amount == null ? null : x.limit_amount, currency: t(x.currency),
      franchise_note: t(x.franchise_note), exclusions: x.exclusions == null ? null : sa(x.exclusions), confirmed_by_insurer: x.confirmed_by_insurer == null ? null : x.confirmed_by_insurer,
      valid_until: t(x.valid_until), drive_url: t(x.drive_url)})),
    documents: arr('documents').map((x) => ({doc_type: t(x.doc_type), title: t(x.title), valid_until: t(x.valid_until), drive_url: t(x.drive_url)}))
  });
  return {errors: [], data: data};
}
// Тот же поиск, что делает база при сохранении: страна + код, для Украины ещё по старому полю ЄДРПОУ.
const findCarrierByCode = (list, country, code) => (list || []).find((c) => String(c.country || '').toUpperCase() === country && c.reg_code === code) ||
  (country === 'UA' ? (list || []).find((c) => c.edrpou === code) : null) || null;
function importPreviewHtml(d) {
  const k = d.check, found = findCarrierByCode(carriers, d.carrier.country, d.carrier.reg_code);
  const byLayer = [1, 2, 3].map((n) => d.items.filter((x) => x.layer === n).length);
  const bad = d.items.filter((x) => x.result === 'fail').length, warn = d.items.filter((x) => x.result === 'warn').length;
  const older = found && found.last_checked_at && k.checked_at && k.checked_at < String(found.last_checked_at).slice(0, 10);
  const li = (title, arr) => arr.length ? '<div><strong>' + title + ':</strong><ul class="plain">' + arr.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul></div>' : '';
  return '<div class="card"><h3 class="sm">Предпросмотр</h3><div class="pad" style="padding:14px;gap:10px;font-size:14px">' +
    '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px"><strong>' + esc(d.carrier.name) + '</strong><span class="muted">' + esc(d.carrier.country + ' · ' + d.carrier.reg_code) + '</span></div>' +
    (found ? '<div class="infobox">Перевозчик уже есть в базе (' + esc(found.name) + ') — проверка добавится к нему.</div>' : '<div class="infobox">Новый перевозчик — будет создан в «Контрагентах».</div>') +
    '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px">' + vetChip(k.verdict) + '<span>Балл: <b>' + (k.score != null ? esc(k.score) : '—') + '</b></span><span>Уровень: <b>' + LEVELS[k.level] + '</b></span><span>Дата: <b>' + (k.checked_at ? fdate(k.checked_at) : 'сегодня') + '</b></span></div>' +
    (k.trip_context ? '<div class="sub" style="font-size:14px">Под рейс: ' + esc(k.trip_context) + '</div>' : '') +
    (k.conditions ? '<div class="warnbox">Условие: ' + esc(k.conditions) + '</div>' : '') +
    '<div>Пунктов проверки: <b>' + d.items.length + '</b> (слой 1: ' + byLayer[0] + ', слой 2: ' + byLayer[1] + ', слой 3: ' + byLayer[2] + ')' +
      (bad ? ' · <span class="neg">не пройдено: ' + bad + '</span>' : '') + (warn ? ' · с замечаниями: ' + warn : '') + '</div>' +
    '<div>Страховок: <b>' + d.insurance.length + '</b> · документов: <b>' + d.documents.length + '</b></div>' +
    (k.red_flags.length ? '<div class="badbox">' + li('Стоп-факторы', k.red_flags) + '</div>' : '') + li('Не хватает', k.missing) + li('Сделать до погрузки', k.tasks) +
    (older ? '<div class="warnbox">Эта проверка старее последней (' + fdate(found.last_checked_at) + '): она попадёт в историю, а статус перевозчика не изменится.</div>' : '') +
  '</div></div>';
}
function openImportModal() {
  let parsed = null;
  $('modalRoot').innerHTML =
    '<div class="overlay"><div class="modal" role="dialog" aria-label="Импорт проверки" style="max-width:680px"><h2>Импорт проверки</h2>' +
    '<div class="sub">Вставьте JSON, который выдал агент СБ. Можно вместе с текстом вокруг — CRM сама найдёт JSON.</div>' +
    '<textarea id="impText" class="json" placeholder="{ &quot;tw_carrier_check&quot;: 1, ... }"></textarea>' +
    '<div id="impErr" class="err hidden"></div><div id="impPrev"></div>' +
    '<div class="acts"><button class="btn ghost" type="button" id="impCancel">Отмена</button><button class="btn ghost" type="button" id="impCheck">Проверить</button><button class="btn" type="button" id="impSave" disabled>Сохранить</button></div></div></div>';
  const err = $('impErr');
  const showErrs = (list) => { err.innerHTML = '<strong>Не сохранено, исправьте:</strong><ul class="plain">' + list.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>'; err.classList.remove('hidden'); };
  $('impText').focus();
  $('impText').oninput = () => { parsed = null; $('impSave').disabled = true; $('impPrev').innerHTML = ''; err.classList.add('hidden'); };
  $('impCancel').onclick = () => { $('modalRoot').innerHTML = ''; };
  $('impCheck').onclick = () => {
    const r = parseCheckJson($('impText').value);
    err.classList.add('hidden'); $('impPrev').innerHTML = '';
    if (r.errors.length) { parsed = null; $('impSave').disabled = true; showErrs(r.errors); return; }
    parsed = r.data; $('impPrev').innerHTML = importPreviewHtml(parsed); $('impSave').disabled = false;
  };
  $('impSave').onclick = async () => {
    if (!parsed) return;
    const btn = $('impSave'); btn.disabled = true; btn.textContent = 'Сохраняю...';
    const r = await db.rpc('import_carrier_check', {p: parsed});
    if (r.error) { showErrs(['База не приняла проверку, ничего не сохранено: ' + r.error.message]); btn.disabled = false; btn.textContent = 'Сохранить'; return; }
    $('modalRoot').innerHTML = '';
    const k = await db.from('carriers').select('*').order('name');
    if (!k.error) carriers = k.data;
    const to = '#/sb/c/' + r.data.carrier_id;
    if (location.hash === to) renderSbCard(r.data.carrier_id); else location.hash = to;
  };
}

/* ----- Дашборд: полисы и документы, которые истекают в ближайшие 30 дней ----- */
async function fillDashExpiring() {
  if (!vetReady || !$('dashExp')) return;
  const soon = addDays(todayIso(), 30);
  const [i, d] = await Promise.all([
    db.from('carrier_insurance').select('carrier_id, insurer, policy_type, valid_until').lte('valid_until', soon),
    db.from('carrier_documents').select('carrier_id, doc_type, title, valid_until').lte('valid_until', soon)
  ]);
  const box = $('dashExp');
  if (!box) return;
  if (i.error || d.error) { box.innerHTML = '<div class="err">Сроки документов не загрузились: ' + esc((i.error || d.error).message) + '</div>'; return; }
  const list = expiringDocs(i.data, d.data, soon);
  box.innerHTML = !list.length ? '' : '<div class="card"><h3>Истекают ≤30 дней <span class="gsum">полисы и документы перевозчиков</span></h3>' +
    list.map((x) => '<div class="row"><div><a href="#/sb/c/' + esc(x.carrier_id) + '" style="font-weight:500">' + esc(carrierName(x.carrier_id) || 'Перевозчик') + '</a><div class="sub">' + esc(x.title) + ' · до ' + fdate(x.date) + '</div></div>' + expiryChip(x.date) + '</div>').join('') + '</div>';
}

function route() {
  const h = location.hash || '#/';
  if (h === '#/sb') return renderSb();
  if (h.startsWith('#/sb/c/')) return renderSbCard(h.slice(7));
  if (h === '#/sb/check') return renderSbCheck(null);
  if (h.startsWith('#/sb/check/')) return renderSbCheck(h.slice(11));
  if (h.startsWith('#/trip/')) return renderTrip(h.slice(7));
  if (h === '#/trips') { ordersFilter.kind = 'trip'; location.replace('#/orders'); return; }
  if (h.startsWith('#/deal/')) return renderDeal(h.slice(7));
  if (h === '#/deals') { ordersFilter.kind = 'deal'; location.replace('#/orders'); return; }
  if (h === '#/orders/new') return renderNewOrder();
  if (h === '#/orders') return renderOrders();
  if (h === '#/contractors') return renderCarriers();
  if (h === '#/finance') return renderFinance('out');
  if (h === '#/finance/in') return renderFinance('in');
  if (h === '#/finance/payments') return renderFinance('payments');
  return renderDashboard();
}

async function enterApp() {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('view').innerHTML = '<div class="muted">Загружаю данные...</div>';
  try { await loadAll(); route(); }
  catch (err) { $('view').innerHTML = '<div class="err">Не удалось загрузить данные: ' + esc(err.message) + '</div>'; }
}

function enterLogin() {
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
}

$('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const box = $('loginErr'); box.classList.add('hidden');
  const btn = $('loginBtn'); btn.disabled = true; btn.textContent = 'Входим...';
  const r = await db.auth.signInWithPassword({email: $('email').value.trim(), password: $('password').value});
  btn.disabled = false; btn.textContent = 'Войти';
  if (r.error) { box.textContent = 'Не удалось войти. Проверьте email и пароль.'; box.classList.remove('hidden'); return; }
  $('password').value = '';
  enterApp();
};

$('logoutBtn').onclick = async () => { await db.auth.signOut(); trips = []; clients = []; carriers = []; deals = []; orders = []; enterLogin(); };
window.addEventListener('hashchange', () => { if (!$('app').classList.contains('hidden') && trips.length + clients.length >= 0) route(); });

(async () => {
  const s = await db.auth.getSession();
  if (s.data.session) enterApp(); else enterLogin();
})();
</script>
